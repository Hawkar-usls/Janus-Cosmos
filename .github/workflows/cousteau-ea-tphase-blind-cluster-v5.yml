name: Cousteau EA T-phase Blind Cluster v5

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ea-tphase-blind-cluster-v5.yml"
      - "workspace/cousteau_ea_tphase_blind_cluster_v5.py"

permissions:
  contents: write

jobs:
  blind-cluster-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Cousteau branch
        uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml numpy pandas scikit-learn

      - name: Execute MGDS prebind archive-aware replay v5
        id: run_gate
        continue-on-error: true
        run: |
          python workspace/cousteau_ea_tphase_blind_cluster_v5.py \
            --output data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4.json \
            --status-output data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4-STATUS.json

      - name: Show scientific status
        if: always()
        run: |
          cat data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4-STATUS.json
          if [ -f data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4.json ]; then
            python - <<'PY'
          import json
          p='data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4.json'
          r=json.load(open(p,encoding='utf-8'))
          print(json.dumps(r['summary'],indent=2,ensure_ascii=False))
          PY
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-ea-tphase-blind-cluster-v5-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4.json
            data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4-STATUS.json
          if-no-files-found: error
          retention-days: 90

      - name: Freeze result on Cousteau branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4-STATUS.json
          if [ -f data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4.json ]; then
            git add data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-005-2026-08-21-v1.4.json
          fi
          git commit -m "Cousteau: freeze EA T-phase archive-aware blind cluster run ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau

      - name: Enforce gate outcome
        if: steps.run_gate.outcome != 'success'
        run: |
          echo "Blind cluster v5 remains BLOCKED; status receipt was frozen."
          exit 1
