name: GOLDMEMBER IEEE 1282295 Recovery

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/goldmember_ieee_1282295_recovery.py"
      - ".github/workflows/goldmember-ieee-1282295-recovery.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pymupdf
      - run: python workspace/goldmember_ieee_1282295_recovery.py
      - run: cat data/cousteau/GOLDMEMBER-IEEE-1282295-CORRECTED-PRIMARY-RECOVERY-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: goldmember-ieee-1282295-${{ github.run_number }}
          path: |
            data/cousteau/GOLDMEMBER-IEEE-1282295-CORRECTED-PRIMARY-RECOVERY-001-2026-08-22-v1.0.json
            workspace/goldmember_ieee_1282295/
          retention-days: 90
      - name: Freeze corrected IEEE receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/GOLDMEMBER-IEEE-1282295-CORRECTED-PRIMARY-RECOVERY-001-2026-08-22-v1.0.json
          git commit -m "GOLDMEMBER: freeze IEEE 1282295 recovery ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
