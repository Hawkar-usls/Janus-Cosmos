name: JANUS R40IA matched historical calibration
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r40ia-matched.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r40ia-matched
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  PYTHONUNBUFFERED: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [bliss, fastdd, turbo]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned BLISS
        if: matrix.mode == 'bliss'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libhdf5-dev libfftw3-dev liblz4-dev pkg-config
          python -m pip install numpy==2.2.6 h5py==3.13.0 requests==2.32.3 matplotlib==3.10.1
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps 'git+https://github.com/UCBerkeleySETI/bliss.git@2b98afe960f13ee7e467aca499576d87ee7502f5'
      - name: Install fastDD dependencies
        if: matrix.mode == 'fastdd'
        run: python -m pip install numpy==2.2.6 requests==2.32.3
      - name: Install pinned turboSETI
        if: matrix.mode == 'turbo'
        run: |
          python -m pip install numpy==1.26.4 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 numba==0.61.2
          python -m pip install 'git+https://github.com/UCBerkeleySETI/turbo_seti.git@7d9b4fde9bc98d834dc11cfc0acd2380e6676f0e'
      - run: python -m pip install scipy==1.15.3 scikit-learn==1.6.1
      - name: Historical null then common array evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_ID: '14476995403'
          EVAL_DIGEST: 'sha256:cbb45f9fda24c56b8eddda710e1206c7a1adf1136f90e1d1979458e70a4e31ac'
          MODE: ${{ matrix.mode }}
        run: /usr/bin/time -v python research/seti/r40ia_matched.py "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r40ia-matched-${{ matrix.mode }}
          path: |
            runtime/r40ia_matched/${{ matrix.mode }}/*.json
            runtime/r40ia_matched/${{ matrix.mode }}/*.npz
          retention-days: 90
          if-no-files-found: warn
