name: JANUS R37F2D1A natural legacy metadata
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f2d1a-legacy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r37f2d1a-legacy
  cancel-in-progress: false
jobs:
  natural-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.3 numpy==2.2.6 astropy==7.1.0 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4
      - name: Audit historical natural maser catalogue and SIGPROC headers
        run: |
          python -m py_compile research/seti/r37f2d1a_legacy.py
          python research/seti/r37f2d1a_legacy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f2d1a-legacy
          path: runtime/r37f2d1a/result.json
          if-no-files-found: warn
