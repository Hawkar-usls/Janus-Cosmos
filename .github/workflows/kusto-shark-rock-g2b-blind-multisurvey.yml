name: KUSTO Shark Rock G2B Blind Multisurvey

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_shark_rock_g2b_blind_multisurvey.py'
      - 'data/cousteau/JANUS-KUSTO-SHARK-ROCK-G2B-BLIND-MULTISURVEY-MORPHOLOGY-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-shark-rock-g2b-blind-multisurvey.yml'
  workflow_dispatch:

jobs:
  g2b:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests shapely
      - name: Run blind multisurvey morphology
        run: python workspace/kusto_shark_rock_g2b_blind_multisurvey.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-shark-rock-g2b-blind-multisurvey-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SHARK-ROCK-G2B-BLIND-MULTISURVEY-MORPHOLOGY-RUN-2026-09-23-v1.0.json
          retention-days: 30
