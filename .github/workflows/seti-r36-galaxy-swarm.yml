name: JANUS R36 GALAXY SWARM exact coordination benchmark
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r36-galaxy-swarm.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r36-galaxy-swarm
  cancel-in-progress: false
jobs:
  swarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 numba==0.61.2 requests==2.32.3
      - name: Compile exact swarm and run donor blackboard tests
        run: |
          python -m py_compile research/seti/r36_galaxy_swarm.py research/seti/r36_kenshi_blackboard.py
          python research/seti/r36_kenshi_blackboard.py
      - name: Test R36A-E on immutable measured-background input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lscpu
          /usr/bin/time -v python research/seti/r36_galaxy_swarm.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r36-galaxy-swarm-result
          path: runtime/r36/*.json
          if-no-files-found: warn
      - name: Require exact witnesses, disjoint partition and failure recovery
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path("runtime/r36")
          r=json.loads((p/"result.json").read_text())
          assert r["lock_sha256"]==hashlib.sha256((p/"lock.json").read_bytes()).hexdigest()
          assert sum(r["B_twin"]["exclusive_template_counts"])==r["A_dedup"]["unique"]
          assert r["A_dedup"]["duplicate_templates"]>0
          assert all(x["exact"] for x in r["gates"].values())
          assert r["metrics"]["positives"]==r["metrics"]["controls"]==512
          assert r["E_failure"]["exact_recovered"] and r["E_failure"]["denied_conflict_stale_duplicate"]==3
          assert r["E_failure"]["unique_commits"]==1
          assert r["D_core"]["priority"]["completed"]==r["D_core"]["fifo"]["completed"]
          assert r["F"].startswith("HOLD") and not r["production_adoption"]
          PY
