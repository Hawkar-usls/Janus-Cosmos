name: JANUS R42A2 conditional NOISE score curve
on:
  push:
    branches: [research/seti-r42a2-conditional-janus-20261120]
    paths: ['.github/workflows/seti-r42a2-conditional-janus.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 requests==2.32.3
      - name: Verify exact frozen decisions and calculate conditional score curves
        run: |
          python -m py_compile research/seti/r42a2_conditional_janus.py
          python research/seti/r42a2_conditional_janus.py
          test -s runtime/r42a2/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r42a2-conditional-janus
          path: runtime/r42a2/
          if-no-files-found: error
          retention-days: 90
