name: KUSTO Lake Crescent Zero-MAD Audit

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_lakecrescent_backscatter_zero_mad_audit.py'
      - 'data/cousteau/JANUS-KUSTO-LAKE-CRESCENT-BACKSCATTER-ZERO-MAD-ROBUSTNESS-AUDIT-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-lakecrescent-zero-mad-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio
      - name: Run frozen zero-MAD robustness audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_lakecrescent_backscatter_zero_mad_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-lakecrescent-zero-mad-audit-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-LAKE-CRESCENT-BACKSCATTER-ZERO-MAD-ROBUSTNESS-RUN-2026-09-23-v1.0.json
          retention-days: 30
