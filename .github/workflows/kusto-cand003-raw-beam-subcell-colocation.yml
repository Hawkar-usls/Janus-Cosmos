name: KUSTO CAND003 Raw Beam Subcell Colocation

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_raw_beam_subcell_colocation.py'
      - '.github/workflows/kusto-cand003-raw-beam-subcell-colocation.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy requests
      - name: Run frozen raw-beam subcell colocation gate
        run: python workspace/kusto_cand003_raw_beam_subcell_colocation.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-raw-beam-subcell-colocation-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-RAW-BEAM-SUBCELL-COLOCATION-RUN-2026-09-23-v1.0.json
          retention-days: 30
