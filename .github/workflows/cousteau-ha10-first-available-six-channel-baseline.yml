name: Cousteau HA10 First Available Six-Channel Baseline

on:
  pull_request:
    branches: [janus-echo-cousteau]
    paths:
      - '.github/workflows/cousteau-ha10-first-available-six-channel-baseline.yml'
      - 'workspace/cousteau_ha10_first_available_six_channel_baseline.py'
      - 'tests/test_cousteau_ha10_first_available_six_channel_baseline.py'
      - 'data/cousteau/JANUS-ECHO-COUSTEAU-HA10-FIRST-AVAILABLE-SIX-CHANNEL-BASELINE-PROTOCOL-2026-08-22-v1.0.json'
      - 'data/cousteau/JANUS-ECHO-COUSTEAU-HA10-N1-S2-TEMPORAL-SCALE-STABILITY-DIAGNOSTIC-RUN-001-SUMMARY-2026-08-22-v1.0.json'
      - 'data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cousteau-ha10-first-six-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  earliest-six-channel-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact frozen implementation and evidence blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object workspace/cousteau_ha10_first_available_six_channel_baseline.py)" = "89eb62a693cf5dd0fb1eada5ccb4477ff494e776"
          test "$(git hash-object tests/test_cousteau_ha10_first_available_six_channel_baseline.py)" = "c7360362cefb638c424a3e714c1a717a5091eade"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-FIRST-AVAILABLE-SIX-CHANNEL-BASELINE-PROTOCOL-2026-08-22-v1.0.json)" = "f040c5df715fb1cc3dca3d478be9334c5c09d271"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-N1-S2-TEMPORAL-SCALE-STABILITY-DIAGNOSTIC-RUN-001-SUMMARY-2026-08-22-v1.0.json)" = "45f2901adde866df610a563f27c50177d32be414"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json)" = "eb8b48fb7f043160c057f9df6264a781412ed854"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen analysis stack
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' \
            'scipy==1.18.1' \
            'requests==2.34.2' \
            'obspy==1.5.0' \
            'pytest>=8,<9'

      - name: Compile and test before network acquisition
        run: |
          python -m py_compile workspace/cousteau_ha10_first_available_six_channel_baseline.py
          python -m pytest -q tests/test_cousteau_ha10_first_available_six_channel_baseline.py

      - name: Execute JANUS-selected value-blind earliest six-channel gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cousteau-first-six
          python workspace/cousteau_ha10_first_available_six_channel_baseline.py \
            --output "artifacts/cousteau-first-six/run-${GITHUB_RUN_ID}.json"
          python -m pip freeze > "artifacts/cousteau-first-six/python-environment-${GITHUB_RUN_ID}.txt"

      - name: Validate result and epistemic firewalls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path('artifacts/cousteau-first-six').glob('run-*.json'))
          assert len(paths)==1, paths
          r=json.loads(paths[0].read_text(encoding='utf-8'))
          allowed={
            'EARLY_LARGE_S2_N1_BASELINE_SIMILAR_TO_2014',
            'EARLY_S2_N1_BASELINE_MATERIALLY_LOWER_THAN_2014',
            'EARLY_S2_N1_BASELINE_DIFFERENT_OR_MIXED',
            'BLOCKED_FIRST_AVAILABLE_SIX_CHANNEL_BASELINE_COMPLETENESS',
            'NO_SIMULTANEOUS_SIX_CHANNEL_PROBE_FOUND_BEFORE_REFERENCE_HORIZON',
          }
          assert r['analysis']['classification'] in allowed
          assert r['selection_used_waveform_values'] is False
          assert r['source_writeback'] is False
          assert r['authority_delta_for_119hz']==0
          assert r['frozen_119hz_verdict']=='NEGATIVE_CONFIRMATORY_HA10_PUBLIC_SLICE'
          assert r['target_identity']=='UNCONFIRMED'
          print('CLASSIFICATION=' + r['analysis']['classification'])
          print('EARLIEST=' + str(r['discovery']['earliest_simultaneous_six_channel_probe_date']))
          print('SELECTED=' + str(r['discovery']['selected_count']))
          print('SOURCE_WRITEBACK=FALSE')
          PY

      - name: Prove no source-tree writeback
        run: test -z "$(git status --porcelain)"

      - name: Upload exact receipt and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-ha10-first-six-${{ github.run_id }}
          path: artifacts/cousteau-first-six/
          if-no-files-found: error
          retention-days: 30
