name: JANUS SETI R15C R16C R17C SIGPROC multi-band and frozen holdout
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-parallel-r15c-r16c-r17c.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        lane: [r15c, r16c, r17c]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned spectral dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Install CPU model runtime
        if: matrix.lane == 'r17c'
        run: python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze metadata-only manifest
        env:
          LANE: ${{ matrix.lane }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$LANE" = r17c ]; then
            python research/seti/r17c_frozen_holdout.py freeze
          else
            python research/seti/r15c_r16c_spectral.py "$LANE" freeze
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-${{ matrix.lane }}-manifest
          path: runtime/${{ matrix.lane }}/
          retention-days: 90
      - name: Run frozen experiment
        env:
          LANE: ${{ matrix.lane }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$LANE" = r17c ]; then
            python research/seti/r17c_frozen_holdout.py scan
          else
            python research/seti/r15c_r16c_spectral.py "$LANE" scan
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-${{ matrix.lane }}-result
          path: runtime/${{ matrix.lane }}/
          retention-days: 90
      - name: Check required evidence
        env:
          LANE: ${{ matrix.lane }}
        run: |
          python - <<'PY'
          import json,os
          lane=os.environ["LANE"]
          d=json.load(open("runtime/"+lane+"/result.json"))
          if lane=="r15c":
              assert d["summary"]["anchor_read"] and d["summary"]["read"]==d["summary"]["selected"]
          elif lane=="r16c":
              assert d["summary"]["complete"]>=1 and d["summary"]["complete"]==d["summary"]["selected"]
          else:
              assert d["evaluation_samples"]==1024 and not d["production_adoption"]
          PY
