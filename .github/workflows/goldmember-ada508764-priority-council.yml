name: GOLDMEMBER ADA508764 Priority Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_goldmember_ada508764_priority_council.py"
      - ".github/workflows/goldmember-ada508764-priority-council.yml"

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python workspace/janus_goldmember_ada508764_priority_council.py
      - run: cat data/cousteau/GOLDMEMBER-ADA508764-PRIORITY-COUNCIL-RUN-003-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: goldmember-ada508764-priority-${{ github.run_number }}
          path: data/cousteau/GOLDMEMBER-ADA508764-PRIORITY-COUNCIL-RUN-003-2026-08-22-v1.0.json
      - name: Freeze council
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/GOLDMEMBER-ADA508764-PRIORITY-COUNCIL-RUN-003-2026-08-22-v1.0.json
          git commit -m "GOLDMEMBER: freeze ADA508764 priority council ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
