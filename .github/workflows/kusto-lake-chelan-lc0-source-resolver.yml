name: KUSTO Lake Chelan LC0 Source Resolver

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_lake_chelan_source_resolver.py'
      - 'data/cousteau/JANUS-KUSTO-LAKE-CHELAN-UNSEEN-DUALCHANNEL-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-lake-chelan-lc0-source-resolver.yml'
  workflow_dispatch:

jobs:
  lc0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve public Lake Chelan files without raster reads
        run: python workspace/kusto_lake_chelan_source_resolver.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-lake-chelan-lc0-source-resolver-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-LAKE-CHELAN-LC0-SOURCE-RESOLVER-RUN-2026-09-23-v1.0.json
          retention-days: 30
