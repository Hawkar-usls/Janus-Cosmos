name: JANUS R35C native author fastDD CPU
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r35c-fastdd-native.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fastdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 requests==2.32.3
      - name: Execute pinned author CPU functions and exact path validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r35c_fastdd_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r35c-fastdd-result
          path: runtime/r35c/*.json
          if-no-files-found: warn
