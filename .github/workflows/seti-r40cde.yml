name: JANUS R40CDE frozen transfer and flow experiment
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r40cde.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r40cde
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      model_id: ${{ steps.model.outputs.artifact-id }}
      model_digest: ${{ steps.model.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1
      - name: Freeze single model without reading new spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r40cde.py
          python research/seti/r40cde.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: model
        with:
          name: janus-r40cde-frozen-model
          path: runtime/r40cde/freeze/
          retention-days: 90
          if-no-files-found: error
  transfer:
    needs: freeze
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [LHS138, LHS288, GJ682, GJ845A, DEN1048]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2 scipy==1.15.3 scikit-learn==1.6.1
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Evaluate immutable model on new frequencies
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ needs.freeze.outputs.model_id }}
          MODEL_DIGEST: ${{ needs.freeze.outputs.model_digest }}
          TARGET: ${{ matrix.target }}
        run: /usr/bin/time -v python research/seti/r40cde.py evaluate "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r40cde-${{ matrix.target }}
          path: runtime/r40cde/evaluate/
          retention-days: 90
          if-no-files-found: warn
