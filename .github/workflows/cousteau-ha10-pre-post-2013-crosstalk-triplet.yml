name: Cousteau HA10 Pre-Post 2013 Crosstalk Triplet Gate

on:
  pull_request:
    branches: [janus-echo-cousteau]
    paths:
      - 'data/cousteau/JANUS-ECHO-COUSTEAU-HA10-PRE-POST-2013-CROSSTALK-TRIPLET-PROTOCOL-2026-08-22-v1.0.json'
      - 'workspace/cousteau_ha10_pre_post_2013_crosstalk_triplet.py'
      - 'tests/test_cousteau_ha10_pre_post_2013_crosstalk_triplet.py'
      - '.github/workflows/cousteau-ha10-pre-post-2013-crosstalk-triplet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-post-triplet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact frozen inputs and code blobs
        shell: bash
        run: |
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-PRE-POST-2013-CROSSTALK-TRIPLET-PROTOCOL-2026-08-22-v1.0.json)" = "bfa9d00082aad01f8ea1246a48e0e72a91188ceb"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-PUBLIC-RESPONSE-EPOCH-AUDIT-RUN-001-SUMMARY-2026-08-22-v1.0.json)" = "4db3760f0ee04d5d832941f5001212e8414978f8"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-REVERSE-SPIRAL-CALIBRATION-CROSSTALK-AUDIT-2026-08-22-v1.0.json)" = "775b53d17e4fd2c185ab1b47cf6e5bfe8d5d3ddf"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json)" = "eb8b48fb7f043160c057f9df6264a781412ed854"
          test "$(git hash-object workspace/cousteau_ha10_pre_post_2013_crosstalk_triplet.py)" = "01b62eb0c6af28ff97700b2bb8a2faa53a4eea5e"
          test "$(git hash-object tests/test_cousteau_ha10_pre_post_2013_crosstalk_triplet.py)" = "59afcd0100e46d51eb440d6f57b11e187ebf3f08"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen analysis stack
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'scipy==1.18.1' 'requests==2.34.2' 'obspy==1.5.0' 'pytest>=8,<9'
          python -m pip freeze | sort > "$RUNNER_TEMP/python-environment.txt"

      - name: Compile before waveform acquisition
        run: python -m py_compile workspace/cousteau_ha10_pre_post_2013_crosstalk_triplet.py

      - name: Run semantic unit tests before waveform acquisition
        run: python -m pytest -q tests/test_cousteau_ha10_pre_post_2013_crosstalk_triplet.py

      - name: Execute frozen six-channel pre-post gate
        run: |
          python workspace/cousteau_ha10_pre_post_2013_crosstalk_triplet.py \
            --output "$RUNNER_TEMP/run-${{ github.run_id }}.json"

      - name: Validate result and authority boundary
        shell: bash
        run: |
          python - "$RUNNER_TEMP/run-${{ github.run_id }}.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          allowed={
            'BLOCKED_PRE_POST_2013_TRIPLET_DATA',
            'LINEAR_COHERENT_SOUTH_TRIPLET_CROSSTALK_SIGNATURE_DETECTED',
            'NO_PREREGISTERED_LINEAR_COHERENT_CROSSTALK_SIGNATURE',
          }
          preclasses={
            'BLOCKED_PRE_POST_2013_TRIPLET_DATA',
            'LARGE_S2_N1_OFFSET_PREEXISTS_AND_IS_STABLE_ACROSS_FAULT',
            'LARGE_S2_N1_OFFSET_EMERGES_AFTER_FAULT',
            'S2_N1_OFFSET_PRE_POST_MIXED',
          }
          assert r['verdict'] in allowed, r['verdict']
          assert r['preexistence_classification'] in preclasses, r['preexistence_classification']
          assert r['frozen_119hz_verdict']=='NEGATIVE_CONFIRMATORY_HA10_PUBLIC_SLICE'
          assert r['authority']['raw_counts_are_primary_for_crosstalk_gate'] is True
          assert r['authority']['public_response_corrected_power_is_secondary'] is True
          assert r['authority']['bathymetry_lane_remains_independent'] is True
          assert r['authority']['authority_delta_for_119hz']==0
          assert r['authority']['target_identity']=='UNCONFIRMED'
          assert r['authority']['source_writeback'] is False
          print(json.dumps({
            'verdict':r['verdict'],
            'preexistence_classification':r['preexistence_classification'],
            'pre_complete':r['summary']['pre_complete_windows'],
            'post_complete':r['summary']['post_complete_windows'],
          },sort_keys=True))
          PY

      - name: Prove no source writeback
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          echo SOURCE_WRITEBACK=FALSE

      - name: Upload exact receipt
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-ha10-pre-post-2013-triplet-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/run-${{ github.run_id }}.json
            ${{ runner.temp }}/python-environment.txt
          if-no-files-found: error
          retention-days: 30
