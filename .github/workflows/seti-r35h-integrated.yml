name: JANUS R35H integrated exact search and protected recognition
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r35h-integrated.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r35h
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact maxima, tie path and signed ordering
        run: |
          python -m py_compile research/seti/r35h_integrated.py
          python research/seti/r35h_integrated.py selftest
      - name: Freeze new target and day groups excluding R32, R35B and G4
        run: python research/seti/r35h_integrated.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r35h-frozen-manifest
          path: runtime/r35h/manifest.json
      - name: Fit then lock and test exact JUXTAPOSE, ODONTO and HANNAH
        run: |
          lscpu
          /usr/bin/time -v python research/seti/r35h_integrated.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r35h-integrated-result
          path: runtime/r35h/*.json
          if-no-files-found: warn
      - name: Validate measured counts, exactness and non-promotion
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("runtime/r35h")
          r=json.loads((p/"result.json").read_text())
          assert r["lock_sha256"]==hashlib.sha256((p/"lock.json").read_bytes()).hexdigest()
          assert all(x["positives"]==x["controls"]==512 for x in r["eval"].values())
          assert all(x["positives"]==128 for x in r["shared"].values())
          assert r["search"]["score_path_exact"] and r["search"]["samples"]==1152
          assert r["search"]["row_operations"]<=r["search"]["exhaustive_row_operations"]
          assert r["known_references"]==7 and r["review_only_references"]==4
          assert r["distinct_measured_tiles"]==128
          assert r["gate"]==("PASS_DEVELOPMENT" if all(r["gate_checks"].values()) else "HOLD")
          assert not r["production_adoption"]
          PY
