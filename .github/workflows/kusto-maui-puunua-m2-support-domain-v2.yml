name: KUSTO Maui Puunua M2 Paired Support V2

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_maui_puunua_m2_support_domain_v2.py'
      - 'data/cousteau/JANUS-KUSTO-MAUI-PUUNUA-UNSEEN-DUALCHANNEL-V2-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-MAUI-PUUNUA-M0-SOURCE-BINDING-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-MAUI-PUUNUA-M1-BLIND-BATHYMETRY-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-MAUI-PUUNUA-M2-PAIRED-SUPPORT-DOMAIN-V2-IMPLEMENTATION-ADDENDUM-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-maui-puunua-m2-support-domain-v2.yml'
  workflow_dispatch:

jobs:
  m2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run Maui Puunoa unseen paired-support-domain v2 replay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_maui_puunua_m2_support_domain_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-maui-puunua-m2-support-domain-v2
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-MAUI-PUUNUA-M2-UNSEEN-BACKSCATTER-V2-RUN-2026-09-23-v1.0.json
          retention-days: 30
