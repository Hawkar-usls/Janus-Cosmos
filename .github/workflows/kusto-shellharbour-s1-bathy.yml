name: KUSTO Shellharbour S1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_shellharbour_s1_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-SHELLHARBOUR-S0-SOURCE-BINDING-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-SHELLHARBOUR-S0-FINAL-SOURCE-BINDING-RECEIPT-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-shellharbour-s1-bathy.yml'
  workflow_dispatch:

jobs:
  s1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run unchanged-v2 Shellharbour blind bathymetry
        run: python workspace/kusto_shellharbour_s1_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-shellharbour-s1-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SHELLHARBOUR-S1-BLIND-BATHYMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
