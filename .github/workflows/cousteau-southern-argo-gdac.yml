name: JANUS Cousteau Southern Ocean Argo GDAC Core QC1
on:
  push:
    branches:
      - experiment/cousteau-southern-ocean-20261109
    paths:
      - workspace/cousteau_southern_ocean_argo_gdac.py
      - data/cousteau/southern_ocean/COUSTEAU-SOUTHERN-ARGO-CORE-PREREG-2026-11-09.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cousteau-southern-argo-gdac
  cancel-in-progress: false

jobs:
  argo-delayed-mode-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 netCDF4==1.7.2 requests==2.32.5
      - name: Deterministic model self-test (not scientific evidence)
        run: python workspace/cousteau_southern_ocean_argo_gdac.py --self-test
      - name: Acquire Argo GDAC index, QC1 delayed-mode profiles, evaluate models
        env:
          COUSTEAU_ARGO_RAW_DIR: /tmp/cousteau-argo-core
        run: python workspace/cousteau_southern_ocean_argo_gdac.py
      - name: Save raw per-profile NetCDF and index in Action artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-argo-gdac-raw-${{ github.run_id }}
          path: |
            /tmp/cousteau-argo-core/*.nc
            /tmp/cousteau-argo-core/ar_index_global_prof.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Append source-grounded profile and model evidence to research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          r="data/cousteau/southern_ocean/argo_runs/run-${GITHUB_RUN_ID}.json"
          o="data/cousteau/southern_ocean/argo_observations/argo_core_D_QC1_run-${GITHUB_RUN_ID}.json"
          if [ ! -f "$r" ]; then
            echo "No Argo receipt: failed before executable setup"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$r"
          if [ -f "$o" ]; then git add "$o"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cousteau: append Argo GDAC QC and benchmark run ${GITHUB_RUN_ID} [skip ci]"
          for retry in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Archived Argo run $GITHUB_RUN_ID safely"
              exit 0
            fi
            echo "Concurrent push detected, retrying $retry"
          done
          echo "FAILED to append result to branch; artifact retained independently" >&2
          exit 1
      - name: Archive QC observations and run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-argo-qc-results-${{ github.run_id }}
          path: |
            data/cousteau/southern_ocean/argo_runs/*.json
            data/cousteau/southern_ocean/argo_observations/*.json
          if-no-files-found: warn
          retention-days: 90
