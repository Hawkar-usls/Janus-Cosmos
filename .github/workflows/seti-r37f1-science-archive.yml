name: JANUS R37F1 historical scientific archive qualification
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f1-science-archive.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r37f1-science-archive
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Audit historical labels and natural control archive metadata
        run: |
          python -m py_compile research/seti/r37f1_science_archive.py
          python research/seti/r37f1_science_archive.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f1-historical-science-qualification
          path: runtime/r37f1/
          if-no-files-found: warn
