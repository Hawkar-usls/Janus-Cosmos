name: LOVE EDEM Open Sky Multi-Survey Scan

on:
  push:
    branches:
      - research/love-g1-007-multieye-v2
    paths:
      - 'janus_cosmos/love_edem_open_sky_scan.py'
      - '.github/workflows/love-edem-open-sky-scan.yml'
      - 'requirements.txt'
  pull_request:
    branches:
      - research/luci-only-v1
    paths:
      - 'janus_cosmos/love_edem_open_sky_scan.py'
      - '.github/workflows/love-edem-open-sky-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-open-surveys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install astronomy stack
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile scan
        run: python -m py_compile janus_cosmos/love_edem_open_sky_scan.py
      - name: Query Gaia SIMBAD 2MASS AllWISE Pan-STARRS and SkyView
        run: >-
          python -u -m janus_cosmos.love_edem_open_sky_scan
          --output-dir results/love_edem_open_sky
          --radius-arcsec 120
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results/love_edem_open_sky/open-sky-scan.json',encoding='utf-8'))
          for label,t in d['targets'].items():
              print('\nTARGET',label,t['ra_deg_icrs'],t['dec_deg_icrs'])
              for cat in ('gaia_dr3','simbad','2mass_psc','allwise','panstarrs_dr2'):
                  x=t[cat]
                  print(cat,x.get('status'),'count=',x.get('count'),'nearest=',(x.get('rows') or [None])[0])
              print('skyview=',{k:{'status':v.get('status'),'downloads':[q.get('file') for q in v.get('downloaded',[]) if q.get('file')]} for k,v in t['skyview'].items()})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: love-edem-open-sky-scan
          path: results/love_edem_open_sky/
          if-no-files-found: error
          retention-days: 14
