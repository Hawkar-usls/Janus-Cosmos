name: JANUS SETI R15C2 exact BLC1 SIGPROC archive recovery
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-blc1-sigproc-r15c2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned spectral dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Test decoder on generated byte stream
        run: |
          PYTHONPATH=research/seti python - <<'PY'
          import io,struct,numpy as np
          from r15c_r16c_spectral import parse_header,fil_window
          def s(x):
              b=x.encode();return struct.pack("<i",len(b))+b
          h=s("HEADER_START")
          for k,v in {"nchans":2048,"nbits":32,"nifs":1}.items():h+=s(k)+struct.pack("<i",v)
          for k,v in {"fch1":982.006,"foff":-0.000003814697265625,"tsamp":16.8,"tstart":58602.5}.items():h+=s(k)+struct.pack("<d",v)
          h+=s("HEADER_END")
          x=np.arange(16*2048,dtype="<f4").reshape(16,2048)
          r=io.BytesIO(h+x.tobytes());r.size=len(r.getvalue())
          parsed=parse_header(r);assert parsed["rows"]==16
          a,t=fil_window(r,parsed,982.002571,20)
          k=round((982.002571-parsed["fch1"])/parsed["foff"])
          assert np.array_equal(a[:,a.shape[1]//2],x[:,k])
          print("SIGPROC_SYNTHETIC_PASS")
          PY
      - name: Freeze published source and exact verified public metadata
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/seti/r15c_r16c_spectral.py r15c freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r15c2-manifest
          path: runtime/r15c/
          retention-days: 90
      - name: Read frozen SIGPROC products
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/seti/r15c_r16c_spectral.py r15c scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r15c2-result
          path: runtime/r15c/
          retention-days: 90
      - name: Require published anchor
        run: |
          python - <<'PY'
          import json
          s=json.load(open("runtime/r15c/result.json"))["summary"]
          assert s["anchor_read"], "Published anchor unavailable or unsupported"
          assert s["read"]==s["selected"], "Partial read"
          PY
