name: Cousteau Full JANUS Assembly Pointer Gate

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-full-assembly-pointer-gate.yml"
      - "workspace/janus_full_assembly_osiris_pointer_gate.py"

permissions:
  contents: write

jobs:
  pointer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full JANUS pointer arbitration
        run: python workspace/janus_full_assembly_osiris_pointer_gate.py
      - name: Show frozen result
        run: cat data/cousteau/JANUS-FULL-ASSEMBLY-OSIRIS-POINTER-GATE-2026-08-22-v1.0.json
      - name: Freeze result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-FULL-ASSEMBLY-OSIRIS-POINTER-GATE-2026-08-22-v1.0.json
          git commit -m "Cousteau: freeze full JANUS pointer gate ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
