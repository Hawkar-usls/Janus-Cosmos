name: JANUS SETI R27X BLISS native CPU feasibility
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r27x-bliss.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bliss:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build external reference in ephemeral read-only runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libhdf5-dev libfftw3-dev liblz4-dev pkg-config
          python -m pip install numpy==2.2.6 h5py==3.13.0
          python -m pip install --no-deps 'git+https://github.com/UCBerkeleySETI/bliss.git@2b98afe960f13ee7e467aca499576d87ee7502f5'
      - name: Check actual upstream import
        run: |
          python -m pip install matplotlib==3.10.1
          python - <<'PY'
          import blissdedrift as b
          import json, pathlib
          p=pathlib.Path("runtime/r27x");p.mkdir(parents=True,exist_ok=True)
          d={"status":"BLISS_NATIVE_IMPORT_PASS","version":b.__version__,"source":"2b98afe960f13ee7e467aca499576d87ee7502f5","scope":"Build and import only; not a sensitivity, speed, or full pipeline benchmark"}
          print("R27X_SUMMARY",json.dumps(d))
          (p/"result.json").write_text(json.dumps(d,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r27x-bliss
          path: runtime/r27x/
