name: KUSTO INFOMAR I1D Batch Header Geometry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_infomar_i1d_batch_header_geometry.py'
      - 'data/cousteau/JANUS-KUSTO-INFOMAR-I1D-BATCH-PAIRED-RASTER-HEADER-GEOMETRY-PREREG-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-infomar-i1d-batch-header-geometry.yml'
  workflow_dispatch:

jobs:
  i1d:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Deflate64-capable extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - run: pip install --disable-pip-version-check requests rasterio
      - name: Verify frozen members and read raster headers only
        run: python workspace/kusto_infomar_i1d_batch_header_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-infomar-i1d-batch-header-geometry-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INFOMAR-I1D-BATCH-PAIRED-RASTER-HEADER-GEOMETRY-RECEIPT-2026-09-24-v1.0.json
          retention-days: 30
