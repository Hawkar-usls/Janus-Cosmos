name: JANUS SETI R21BC timestamp integration and exact join
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r21bc-multiscan.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze metadata-only fresh targets
        run: |
          python -m py_compile research/seti/r21bc_multiscan.py
          python research/seti/r21bc_multiscan.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r21bc-manifest
          path: runtime/r21bc/manifest.json
      - name: Timestamp-aligned two-scan benchmark
        run: python research/seti/r21bc_multiscan.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r21bc-result
          path: runtime/r21bc/
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r21bc/result.json"))
          assert d["samples"]==1024 and d["challenge_cases"]==128
          assert d["selftests"]["status"]=="PASS" and d["semijoin_mismatches"]==0
          assert all(x["positives"]==512 and x["controls"]==512 for x in d["modes"].values())
          assert not d["production_adoption"]
          PY
