name: JANUS R35D native turboSETI and HyperSETI hardware qualification
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r35d-turbo-native.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  turbo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native pinned turboSETI package
        run: |
          python -m pip install numpy==1.26.4 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 numba==0.61.2
          python -m pip install 'git+https://github.com/UCBerkeleySETI/turbo_seti.git@7d9b4fde9bc98d834dc11cfc0acd2380e6676f0e'
      - name: Test exact input bridge and native FindDoppler
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r35d_turbo_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r35d-native-turbo
          path: |
            runtime/r35d/*.json
            runtime/r35d/*/native_stdout.txt
            runtime/r35d/*/*.dat
          if-no-files-found: warn
  hyperseti_qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Determine actual CUDA hardware availability without provisioning
        run: |
          mkdir -p runtime/r35e
          python - <<'PY'
          import subprocess,shutil,json,pathlib
          tool=shutil.which("nvidia-smi")
          probe=subprocess.run([tool,"-L"],capture_output=True,text=True,timeout=10) if tool else None
          available=bool(probe and probe.returncode==0 and "GPU " in probe.stdout)
          d={"source":"https://github.com/UCBerkeleySETI/hyperseti","source_commit":"a15f7ebfd9ea418a3cb12b61e1d92a3bd4752f63","gpu_present":available,"status":"GPU_VISIBLE_NEEDS_NATIVE_TEST" if available else "HOLD_NO_CUDA_GPU","native_test_executed":False,"no_paid_runner_provisioned":True,"probe":probe.stdout[:1000] if probe else "nvidia-smi absent"}
          pathlib.Path("runtime/r35e/qualification.json").write_text(json.dumps(d,indent=2)+"\n")
          print("R35E_QUALIFICATION",json.dumps(d))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r35e-hyperseti-qualification
          path: runtime/r35e/qualification.json
