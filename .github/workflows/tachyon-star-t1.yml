name: JANUS TACHYON STAR T1 Look-back Holdout
on:
  push:
    branches: [research/luci-only-v1]
    paths:
      - 'experiments/luci/run_tachyon_star_t1.py'
      - 'tests/test_tachyon_star_t1.py'
      - 'data/luci_palomar/JANUS-TACHYON-STAR-T1-LOOKBACK-HOLDOUT-PREREG.json'
      - 'data/luci_palomar/JANUS-TACHYON-STAR-T1-LOOKBACK-HOLDOUT-MANIFEST.csv'
      - '.github/workflows/tachyon-star-t1.yml'
permissions: {contents: read}
jobs:
  lookback:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Verify preregistered manifest before pixel access
        run: |
          echo '334fe0cacd0b056214d991be5256e05ab678fe5edb072d46a26ad07d4ae803b7  data/luci_palomar/JANUS-TACHYON-STAR-T1-LOOKBACK-HOLDOUT-MANIFEST.csv' | sha256sum -c -
      - run: python -m unittest tests/test_tachyon_star_t1.py -v
      - name: Execute sealed A-B-C look-back test
        shell: bash
        run: |
          mkdir -p results/tachyon_star_t1
          set +e
          python -m experiments.luci.run_tachyon_star_t1 --output-dir results/tachyon_star_t1 --cache-dir .cache/tachyon_star_t1
          rc=$?
          set -e
          echo "$rc" > results/tachyon_star_t1/scientific_runner_exit_code.txt
          test -s results/tachyon_star_t1/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-tachyon-star-t1
          path: results/tachyon_star_t1/
          if-no-files-found: error
