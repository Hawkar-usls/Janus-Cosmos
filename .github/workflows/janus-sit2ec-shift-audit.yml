name: JANUS SIT2E-C - Parkes July September Shift Audit
on:
  push:
    branches:
      - research/janus-sit2ec-parkes-shift-audit-20261122
    paths:
      - 'research/seti/janus_sit2ec_shift_diagnostics.py'
      - '.github/workflows/janus-sit2ec-shift-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-power-and-if-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout pinned research methods
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.1.0 requests==2.32.3 beautifulsoup4==4.12.3 scikit-learn==1.6.1
      - name: Enforce never-Oct and unchanged SIT2E-B thresholds
        run: |
          python -m py_compile research/seti/janus_sit2ec_shift_diagnostics.py
          python - <<'PY'
          import ast,json,pathlib
          src=pathlib.Path('research/seti/janus_sit2ec_shift_diagnostics.py').read_text()
          assert '/PKS_Oct_' not in src
          tree=ast.parse(src)
          assignments={n.targets[0].id:ast.literal_eval(n.value) for n in tree.body
                       if isinstance(n,ast.Assign) and len(n.targets)==1
                       and isinstance(n.targets[0],ast.Name) and n.targets[0].id=='DATES'}
          assert assignments['DATES']==('2025-07-31','2025-09-12')
          r=json.loads(pathlib.Path('research/seti/janus_sit2eb_july_september_calibration_receipt.json').read_text())
          assert r['inference_limits']['allow_october_one_shot_exam'] is False
          assert r['numeric_thresholds']['JANUS_NATIVE_RIDGE']==2.834103476282684
          print('OCTOBER_SEALED_AND_SIT2EB_LOCK_UNCHANGED')
          PY
      - name: Inspect every IF on original July and September radio power and replay frozen thresholds
        run: python research/seti/janus_sit2ec_shift_diagnostics.py --audit
      - name: Archive digestible scientific audit JSON only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-sit2ec-july-september-if-power-shift
          path: runtime/sit2ec/sit2ec_shift_audit.json
          if-no-files-found: warn
          retention-days: 90
