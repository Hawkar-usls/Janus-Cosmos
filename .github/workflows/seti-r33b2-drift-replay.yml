name: JANUS SETI R33B2 measured drift replay
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r33b2-drift-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-seti-r33b2
  cancel-in-progress: false
jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and validate signed drift search
        run: |
          python -m py_compile research/seti/r33b2_drift_replay.py
          python research/seti/r33b2_drift_replay.py selftest
      - name: Freeze 36 publication-guided raw source windows
        run: python research/seti/r33b2_drift_replay.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: manifest
        with:
          name: janus-r33b2-frozen-manifest
          path: runtime/r33b2/manifest.json
      - name: Restore measured tracks and independently corroborating OFF windows
        env:
          R33B2_MANIFEST_ID: ${{ steps.manifest.outputs.artifact-id }}
          R33B2_MANIFEST_SHA: ${{ steps.manifest.outputs.artifact-digest }}
        run: python research/seti/r33b2_drift_replay.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r33b2-drift-replay
          path: |
            runtime/r33b2/*.json
            runtime/r33b2/*.npy
          if-no-files-found: warn
      - name: Verify counted outcomes and raw passports without promoting labels
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path("runtime/r33b2")
          r=json.loads((p/"result.json").read_text())
          c=json.loads((p/"drift_candidates.json").read_text())
          rows=json.loads((p/"raw_receipts.json").read_text())
          assert len(rows)==36 and sum(r["holds"].values())==36
          assert r["candidate_count"]==len(c["entries"])==r["direct"]+r["mirrored"]
          assert r["candidate_sha256"]==hashlib.sha256((p/"drift_candidates.json").read_bytes()).hexdigest()
          for e in c["entries"]:
              assert e["passport"]["label"]=="UNKNOWN" and e["off_matches"]
              assert e["on_track"]["drift_hz_s"]*e["published"]["sign"]>0
              for v in e["off_matches"]:
                  assert v["passport"]["label"]=="UNKNOWN"
                  assert v["passport"]["provenance"]["source_tile_sha256"]!=e["passport"]["provenance"]["source_tile_sha256"]
                  assert abs(v["frequency_residual_hz"])<=150.00001
          assert r["verified_promoted"]==0 and not r["production_adoption"]
          PY
