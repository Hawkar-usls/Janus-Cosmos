name: Cousteau Hannah CD169 Real Mnemonic
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_bodc_9406_tobi_real_mnemonic_run.py'
      - 'data/cousteau/JANUS-HANNAH-CD169-TOBI-SYNESTHETIC-ADAPTER-CONTRACT-2026-08-25-v1.0.json'
      - '.github/workflows/cousteau-hannah-cd169-real-mnemonic.yml'
permissions:
  contents: read
jobs:
  real-mnemonic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen mnemonic adapter on real TOBI bytes
        id: run
        continue-on-error: true
        run: |
          python workspace/hannah_bodc_9406_tobi_real_mnemonic_run.py \
            --output out/JANUS-HANNAH-BODC-MEASUREMENT-RECEIPT-001-REAL-CD169-TOBI-SENSORY-PASSPORTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hannah-cd169-real-tobi-sensory-passports
          path: out/JANUS-HANNAH-BODC-MEASUREMENT-RECEIPT-001-REAL-CD169-TOBI-SENSORY-PASSPORTS.json
          if-no-files-found: error
          retention-days: 7
      - name: Propagate run failure after receipt preservation
        if: steps.run.outcome == 'failure'
        run: exit 1
