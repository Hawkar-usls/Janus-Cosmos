name: Cousteau EA T-phase Blind Cluster

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ea-tphase-blind-cluster.yml"
      - "workspace/cousteau_ea_tphase_blind_cluster.py"
      - "workspace/cousteau_ea_tphase_blind_cluster_v4.py"

permissions:
  contents: write

jobs:
  blind-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Cousteau branch
        uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml numpy pandas scikit-learn
      - name: Execute blind MGDS T-phase clustering gate v4
        id: run_gate
        continue-on-error: true
        run: |
          python workspace/cousteau_ea_tphase_blind_cluster_v4.py \
            --output data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3.json \
            --status-output data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3-STATUS.json
      - name: Show status
        if: always()
        run: |
          cat data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3-STATUS.json
          if [ -f data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3.json ]; then
            python - <<'PY'
          import json
          p='data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3.json'
          print(json.dumps(json.load(open(p))['summary'], indent=2))
          PY
          fi
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-ea-tphase-blind-cluster-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3.json
            data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3-STATUS.json
          if-no-files-found: error
          retention-days: 90
      - name: Freeze receipt on Cousteau branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3-STATUS.json
          if [ -f data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3.json ]; then
            git add data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-BLIND-CLUSTER-RUN-004-2026-08-21-v1.3.json
          fi
          git commit -m "Cousteau: freeze EA T-phase blind cluster website-flow run ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
      - name: Enforce scientific gate outcome
        if: steps.run_gate.outcome != 'success'
        run: |
          echo "Blind cluster gate did not complete; BLOCKED receipt was frozen."
          exit 1
