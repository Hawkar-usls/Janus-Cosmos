name: KUSTO Solitary Islands SI0B Member Inventory

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_solitary_islands_si0b_member_inventory.py'
      - 'data/cousteau/JANUS-KUSTO-SOLITARY-ISLANDS-SI0-SOURCE-BINDING-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-solitary-islands-si0b-members.yml'
  workflow_dispatch:

jobs:
  si0b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Inventory Solitary Islands archives without pixel decode
        run: python workspace/kusto_solitary_islands_si0b_member_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-solitary-islands-si0b-members-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOLITARY-ISLANDS-SI0B-ARCHIVE-MEMBER-INVENTORY-2026-09-24-v1.0.json
          retention-days: 30
