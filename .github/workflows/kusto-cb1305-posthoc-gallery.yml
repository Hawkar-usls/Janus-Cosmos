name: KUSTO CB13_05 Posthoc Object Gallery
on:
  push:
    branches: [feature/kusto-global-groundtruth-calibration-v1]
    paths:
      - 'workspace/kusto_cb1305_posthoc_gallery.py'
      - '.github/workflows/kusto-cb1305-posthoc-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: which 7z || (sudo apt-get update && sudo apt-get install -y p7zip-full)
      - run: pip install --disable-pip-version-check requests rasterio numpy pyproj matplotlib
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workspace/kusto_cb1305_posthoc_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cb1305-posthoc-object-gallery-v1
          path: workspace/kusto_global_groundtruth_out/cb1305_gallery/
          retention-days: 30
