name: KUSTO Elizabeth Middleton EM1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_elizabeth_middleton_em1_blind_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0-UNCHANGED-V2-PREREG-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0B-ARCHIVE-MEMBER-RECEIPT-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0C-DUAL-METHOD-FREEZE-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0E-PAIRED-DOMAIN-REPROJECTION-FREEZE-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-elizabeth-middleton-em1-blind-bathy.yml'
  workflow_dispatch:

jobs:
  em1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run blind bathymetry discovery on frozen paired domains
        run: python workspace/kusto_elizabeth_middleton_em1_blind_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-elizabeth-middleton-em1-blind-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM1-BLIND-BATHYMETRY-RUN-2026-09-24-v1.0.json
          retention-days: 30
