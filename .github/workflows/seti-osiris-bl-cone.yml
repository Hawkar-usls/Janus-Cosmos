name: JANUS COSMOS · OSIRIS Breakthrough Listen GBT/Parkes cone search
on:
  push:
    branches: [research/seti-osiris-spear-radio-audit-20261121]
    paths:
      - '.github/workflows/seti-osiris-bl-cone.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-osiris-bl-r1c
  cancel-in-progress: false
jobs:
  bl-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile research/seti/osiris_bl_cone_lookup.py research/seti/osiris_spear_radio_coverage.py
          python -m json.tool research/seti/osiris_bl_cone_protocol.json > /dev/null
          python -m pip install requests==2.32.3 beautifulsoup4==4.13.4
      - name: Independently query official Breakthrough Listen archive sky-coordinate HDF5 coverage
        run: |
          python research/seti/osiris_bl_cone_lookup.py
          test -s runtime/osiris_spear_bl_r1c/bl_gate_report.json
          test -s runtime/osiris_spear_bl_r1c/bl_radio_coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-osiris-spear-BL-GBT-Parkes-radio-coverage
          path: runtime/osiris_spear_bl_r1c/
          if-no-files-found: warn
          retention-days: 90
