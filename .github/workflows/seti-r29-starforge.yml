name: JANUS SETI R29 Star Forge scheduler
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r29-starforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile research/seti/r29_starforge.py
      - name: Freeze metadata-only targets
        run: python research/seti/r29_starforge.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r29-manifest
          path: runtime/r29/manifest.json
      - name: Fresh frozen five-lane scheduler and budget comparison
        run: python research/seti/r29_starforge.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r29-result
          path: runtime/r29/
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r29/result.json"))
          assert d["samples"]==1024 and len(d["modes"])==5 and d["selftests"]["tree_witness"]=="PASS"
          assert all(v["positives"]==512 and v["controls"]==512 for v in d["modes"].values())
          assert all(v["positives"]==128 for v in d["leak_challenge"].values())
          assert all(d["modes"][k]["proxy_cost"]<=d["modes"][k]["proxy_budget"]+1e-6 for k in ("star_forge","fixed_five","orbit_budget"))
          assert d["selftests"]["coprime_coverage"]=="PASS"
          assert not d["production_adoption"]
          PY
