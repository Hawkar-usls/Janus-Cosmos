name: GOLDMEMBER H10N1 UKHO Exact Catalog Probe

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/goldmember_h10n1_ukho_exact_catalog_probe.py"
      - ".github/workflows/goldmember-h10n1-ukho-exact-catalog-probe.yml"

permissions:
  contents: write

concurrency:
  group: goldmember-h10n1-ukho-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Probe exact public UKHO/ArcGIS catalogue identifiers
        run: python workspace/goldmember_h10n1_ukho_exact_catalog_probe.py
      - name: Show receipt
        run: cat data/cousteau/GOLDMEMBER-H10N1-MODERN-BGS-UKHO-EXACT-CATALOG-PROBE-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: goldmember-h10n1-ukho-catalog-${{ github.run_number }}
          path: data/cousteau/GOLDMEMBER-H10N1-MODERN-BGS-UKHO-EXACT-CATALOG-PROBE-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze result safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/GOLDMEMBER-H10N1-MODERN-BGS-UKHO-EXACT-CATALOG-PROBE-001-2026-08-22-v1.0.json
          git commit -m "GOLDMEMBER: freeze H10N1 UKHO exact catalog probe ${{ github.run_number }}" || true
          git fetch origin janus-echo-cousteau
          git rebase origin/janus-echo-cousteau
          git push origin HEAD:janus-echo-cousteau
