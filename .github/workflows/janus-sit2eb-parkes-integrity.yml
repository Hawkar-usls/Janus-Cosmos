name: JANUS SIT2E-B - Parkes July September Full Integrity
on:
  push:
    branches:
      - research/janus-sit2eb-integrity-calibration-20261122
    paths:
      - 'research/seti/janus_sit2eb_full_integrity.py'
      - '.github/workflows/janus-sit2eb-parkes-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-file-full-byte-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded network dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Syntax check and verify locked date selectors
        run: |
          python -m py_compile research/seti/janus_sit2eb_full_integrity.py
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          p=Path("research/seti/janus_sit2eb_full_integrity.py")
          s=importlib.util.spec_from_file_location("sit2eb",p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          q=json.loads(Path("research/seti/janus_sit2e_parkes_preflight_result.json").read_text())
          f=m.selected_files(q)
          assert len(f)==4 and {x[0] for x in f}==set(m.PERMITTED_DATES)
          assert not any("Oct_05" in x[2]["url"] for x in f)
          print("SIT2EB_OCTOBER_NOT_SELECTED")
          PY
      - name: Stream original four complete July September files and hash
        run: python research/seti/janus_sit2eb_full_integrity.py
      - name: Preserve integrity receipts only, never raw radio power
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-sit2eb-july-september-four-file-full-sha
          path: runtime/sit2eb/sit2eb_integrity.json
          if-no-files-found: warn
          retention-days: 90
