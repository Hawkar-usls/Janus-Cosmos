name: Stargate Abydos Raw unWISE Frozen Center

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stargate-abydos-raw-unwise.yml"
      - "workspace/stargate_abydos_raw_unwise.py"
      - "data/stargate/STARGATE-ABYDOS-RAW-UNWISE-FROZEN-CENTER-GATE-v1.json"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "astropy>=7.0" "requests>=2.31"

      - name: Run raw unWISE frozen-center gate
        run: |
          python workspace/stargate_abydos_raw_unwise.py

      - name: Show receipt
        if: always()
        run: |
          cat data/stargate/STARGATE-ABYDOS-RAW-UNWISE-FROZEN-CENTER-v1-LATEST-RECEIPT.json || true

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stargate-abydos-raw-unwise-${{ github.run_number }}
          path: data/stargate/STARGATE-ABYDOS-RAW-UNWISE-FROZEN-CENTER-v1-LATEST-RECEIPT.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist receipt to Janus-Cosmos
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stargate/STARGATE-ABYDOS-RAW-UNWISE-FROZEN-CENTER-v1-LATEST-RECEIPT.json
          git commit -m "cosmos: freeze Stargate Abydos raw unWISE run ${{ github.run_number }}"
          git push
