name: KUSTO South-west Corner SWC2 Paired Support V2

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_southwest_corner_swc2_support_domain_v2.py'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0-UNCHANGED-V2-PREREG-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0D-EXACT-MEMBER-BINDING-RECEIPT-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC1-BLIND-BATHYMETRY-RECEIPT-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC2-UNCHANGED-V2-IMPLEMENTATION-FREEZE-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-southwest-corner-swc2-support-domain-v2.yml'
  workflow_dispatch:

jobs:
  swc2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine pyproj
      - name: Run unchanged-v2 South-west Corner held-out backscatter replay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_southwest_corner_swc2_support_domain_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-southwest-corner-swc2-support-domain-v2
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOUTHWEST-CORNER-SWC2-UNSEEN-BACKSCATTER-V2-RUN-2026-09-24-v1.0.json
          retention-days: 30
