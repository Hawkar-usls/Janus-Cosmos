name: KUSTO CAND003 Extreme Beam vs 2008 Residuals

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_extreme_beam_vs_2008_residuals.py'
      - '.github/workflows/kusto-cand003-extreme-beam-vs-2008-residuals.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests
      - name: Run frozen extreme-beam residual stratification
        run: python workspace/kusto_cand003_extreme_beam_vs_2008_residuals.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-extreme-beam-vs-2008-residuals-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-EXTREME-BEAM-VS-2008-RESIDUAL-STRATIFICATION-RUN-2026-09-23-v1.0.json
          retention-days: 30
