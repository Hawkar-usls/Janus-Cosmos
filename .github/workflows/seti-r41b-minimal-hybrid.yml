      - name: Verify all paired decisions and report actual cost and residual lanes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41b_minimal_hybrid.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
