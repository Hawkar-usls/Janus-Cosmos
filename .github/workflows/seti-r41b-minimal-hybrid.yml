            runtime/r41b/result.json
            runtime/r41b/residual_ledger.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41b-minimal-hybrid
          path: |
            runtime/r41b/*.json
            runtime/r41b/progress/*.json
          retention-days: 90
          if-no-files-found: warn
