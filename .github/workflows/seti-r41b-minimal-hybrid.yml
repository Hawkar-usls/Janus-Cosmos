          path: |
            runtime/r41b/progress/group-03.json
            runtime/r41b/minimal-03.json
            runtime/r41b/full-03.json
          retention-days: 90
          if-no-files-found: error
      - name: Independent full and minimal processes 04 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41b_minimal_hybrid.py pair 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
