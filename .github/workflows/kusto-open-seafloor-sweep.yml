name: KUSTO Open Seafloor Sweep

on:
  push:
    branches:
      - feature/kusto-open-seafloor-sweep-v1
    paths:
      - 'workspace/kusto_open_seafloor_sweep.py'
      - 'workspace/kusto_kn19207_open_fvn_gate.py'
      - 'workspace/kusto_kn19207_blind_morphology.py'
      - '.github/workflows/kusto-open-seafloor-sweep.yml'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific IO
        run: pip install --disable-pip-version-check numpy xarray netCDF4 requests
      - name: Run KUSTO coverage-first open-seafloor sweep
        run: python workspace/kusto_open_seafloor_sweep.py
      - name: Scan KN192-07 MB-System FNV swath geometry
        run: python workspace/kusto_kn19207_open_fvn_gate.py
      - name: Parse matching KN192-07 FBT beams
        run: python workspace/kusto_kn19207_fbt_beam_gate.py
      - name: Run preregistered blind morphology screen
        run: python workspace/kusto_kn19207_blind_morphology.py
      - name: Upload sweep products
        uses: actions/upload-artifact@v4
        with:
          name: kusto-open-seafloor-sweep-v1
          path: workspace/kusto_open_seafloor_out/
          retention-days: 30
