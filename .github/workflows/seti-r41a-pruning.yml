      - name: Compare parent and rescue alarms and conditionally freeze candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41a_pruning.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41a-progress-99-summary
          path: |
            runtime/r41a/progress/99-summary.json
            runtime/r41a/pruning_lock.json
            runtime/r41a/result.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41a-pruning
          path: |
            runtime/r41a/*.json
            runtime/r41a/progress/*.json
          retention-days: 90
          if-no-files-found: warn
