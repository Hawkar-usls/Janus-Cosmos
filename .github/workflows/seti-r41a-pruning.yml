name: JANUS R41A frozen pruning and residual audit
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r41a-pruning.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r41a-pruning
  cancel-in-progress: false
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile pruning audit
        run: python -m py_compile research/seti/r41a_pruning.py
      - name: Authenticate R41 and R40N10 frozen archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41a_pruning.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41a-progress-00-prepare
          path: |
            runtime/r41a/progress/00-prepare.json
            runtime/r41a/plan.json
          retention-days: 90
          if-no-files-found: error
      - name: Paired frozen pruning group 01 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41a_pruning.py group 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41a-progress-group-01
          path: |
            runtime/r41a/progress/group-01.json
            runtime/r41a/group-01.json
          retention-days: 90
          if-no-files-found: error
      - name: Paired frozen pruning group 02 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41a_pruning.py group 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41a-progress-group-02
          path: |
            runtime/r41a/progress/group-02.json
            runtime/r41a/group-02.json
          retention-days: 90
          if-no-files-found: error
      - name: Paired frozen pruning group 03 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41a_pruning.py group 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41a-progress-group-03
          path: |
            runtime/r41a/progress/group-03.json
            runtime/r41a/group-03.json
          retention-days: 90
          if-no-files-found: error
      - name: Paired frozen pruning group 04 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41a_pruning.py group 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41a-progress-group-04
          path: |
            runtime/r41a/progress/group-04.json
            runtime/r41a/group-04.json
          retention-days: 90
