name: JANUS SETI R8 prospective new spectrum search
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-new-spectra-r8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned archive reader
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Select target sessions using metadata only
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/seti/r8_new_spectrum_search.py freeze
      - name: Preserve frozen manifest before intensity access
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r8-frozen-manifest
          path: runtime/r8/
          retention-days: 90
      - name: Search fixed frequency and drift windows; compare controls
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/seti/r8_new_spectrum_search.py scan
      - name: Preserve real data and search receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r8-spectrum-search
          path: runtime/r8/
          retention-days: 90
