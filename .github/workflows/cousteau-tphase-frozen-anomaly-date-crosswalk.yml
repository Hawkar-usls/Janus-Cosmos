name: Cousteau T-phase Frozen Anomaly Date Crosswalk
on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-tphase-frozen-anomaly-date-crosswalk.yml"
      - "workspace/cousteau_tphase_frozen_anomaly_date_crosswalk.py"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 lxml numpy pandas scikit-learn
      - name: Run date crosswalk
        run: |
          python workspace/cousteau_tphase_frozen_anomaly_date_crosswalk.py \
            --output data/cousteau/JANUS-ECHO-COUSTEAU-FROZEN-ANOMALY-DATE-CROSSWALK-RUN-001-2026-08-21-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-frozen-anomaly-date-crosswalk-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-FROZEN-ANOMALY-DATE-CROSSWALK-RUN-001-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-FROZEN-ANOMALY-DATE-CROSSWALK-RUN-001-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze frozen anomaly date crosswalk ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
