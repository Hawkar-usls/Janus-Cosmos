name: JANUS SETI JUXTAPOSE R18A eight-pivot exact spectral ordering
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-juxtapose-r18a.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned reader
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Exact tournament and paired real spectral benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m py_compile research/seti/juxtapose_r18a.py
          python research/seti/juxtapose_r18a.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-juxtapose-r18a
          path: runtime/juxtapose-r18a/
          retention-days: 90
      - name: Verify exact equality and no promotion
        run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/juxtapose-r18a/result.json"))
          assert d["decision_mismatches"]==0 and d["lock"]["orders_replayed"]==40320
          assert d["test_samples"]==1024 and not d["production_adoption"]
          PY
