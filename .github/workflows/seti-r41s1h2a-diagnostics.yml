name: JANUS R41S1H2A descriptive ROC and residual morphology
on:
  push:
    branches: [research/seti-r41s1h2a-diagnostics-20261120]
    paths: ['.github/workflows/seti-r41s1h2a-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 requests==2.32.3 scikit-learn==1.6.1
      - name: Compute descriptive ROC DET only and classify historical profile preferences
        run: |
          python -m py_compile research/seti/r41s1h2a_diagnostics.py
          PYTHONPATH=research/seti python -c 'import r41s1h2a_diagnostics as m; m.main()'
          test -s runtime/r41s1h2a/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41s1h2a-diagnostics
          path: runtime/r41s1h2a/
          if-no-files-found: error
          retention-days: 90
