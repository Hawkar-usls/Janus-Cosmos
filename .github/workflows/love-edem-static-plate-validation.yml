name: LOVE EDEM Static Plate Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workspace/love_edem_static_plate_validation.py"
      - ".github/workflows/love-edem-static-plate-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GPlates tooling
        run: python -m pip install --disable-pip-version-check gplately pygplates
      - name: Run static plate validation
        run: python workspace/love_edem_static_plate_validation.py
      - name: Validate frozen point
        run: |
          python - <<'PY'
          import json
          p='data/love/JANUS-LOVE-EDEM-STATIC-PLATE-ID-VALIDATION-RUN-001-RECEIPT.json'
          r=json.load(open(p))
          assert r['frozen_point']['no_recenter'] is True
          assert r['status'] in ('STATIC_PLATE_ID_RESOLVED','STATIC_PLATE_ID_UNRESOLVED')
          PY
      - name: Persist receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/JANUS-LOVE-EDEM-STATIC-PLATE-ID-VALIDATION-RUN-001-RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "cosmos: freeze LOVE EDEM static plate validation run 1"
          git pull --rebase origin main
          git push
