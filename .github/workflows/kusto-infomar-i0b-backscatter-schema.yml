name: KUSTO INFOMAR I0B Backscatter Query Schema

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_infomar_i0b_backscatter_schema.py'
      - '.github/workflows/kusto-infomar-i0b-backscatter-schema.yml'
  workflow_dispatch:

jobs:
  i0b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Diagnose INFOMAR backscatter catalog query forms
        run: python workspace/kusto_infomar_i0b_backscatter_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-infomar-i0b-backscatter-schema-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INFOMAR-I0B-BACKSCATTER-QUERY-SCHEMA-DIAGNOSTIC-2026-09-24-v1.0.json
          retention-days: 30
