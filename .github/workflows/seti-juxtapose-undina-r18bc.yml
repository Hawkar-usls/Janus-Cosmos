name: JANUS SETI R18B R18C Undina native gate and Markov pilot
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-juxtapose-undina-r18bc.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned spectral dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze metadata-only target manifest
        run: |
          python -m py_compile research/seti/juxtapose_undina_r18bc.py
          python research/seti/juxtapose_undina_r18bc.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r18bc-manifest
          path: runtime/r18bc/manifest.json
      - name: Frozen paired pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/juxtapose_undina_r18bc.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r18bc-result
          path: runtime/r18bc/
          retention-days: 90
      - name: Verify correctness only
        run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r18bc/result.json"))
          assert d["decision_mismatches"] == 0 and d["samples"] == 1024
          assert len(d["totals"]) == 10 and not d["production_adoption"]
          PY
