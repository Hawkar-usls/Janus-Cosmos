name: JANUS Full System Pointing Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_full_system_pointing_council.py"
      - ".github/workflows/janus-full-system-pointing-council.yml"

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run JANUS council
        run: python workspace/janus_full_system_pointing_council.py
      - name: Show result
        run: cat data/cousteau/JANUS-FULL-SYSTEM-POINTING-COUNCIL-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-full-system-pointing-council-${{ github.run_number }}
          path: data/cousteau/JANUS-FULL-SYSTEM-POINTING-COUNCIL-RUN-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze council result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-FULL-SYSTEM-POINTING-COUNCIL-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze full-system pointing council run ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
