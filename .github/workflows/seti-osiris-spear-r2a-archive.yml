name: JANUS COSMOS OSIRIS SPEAR R2A · beam-qualified original archive sources
on:
  push:
    branches: [research/seti-osiris-spear-r2-real-radio-20261121]
    paths:
      - '.github/workflows/seti-osiris-spear-r2a-archive.yml'
      - 'research/seti/osiris_spear_r2_protocol.json'
      - 'research/seti/osiris_spear_r2_archive_search.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: osiris-r2a-real-archive
  cancel-in-progress: false
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate frozen R2 protocol
        run: |
          python -m py_compile research/seti/osiris_spear_r2_archive_search.py research/seti/osiris_spear_radio_coverage.py
          python -m json.tool research/seti/osiris_spear_r2_protocol.json > /dev/null
          python -m pip install requests==2.32.3 beautifulsoup4==4.13.4
      - name: Inspect authentic BL GBT/Parkes archive HDF5, filterbank, baseband over frozen sky directions and controls
        run: |
          python research/seti/osiris_spear_r2_archive_search.py
          test -s runtime/osiris_spear_r2a/expanded_public_radio_inventory.json
          test -s runtime/osiris_spear_r2a/beam_screened_candidates.json
          test -s runtime/osiris_spear_r2a/r2a_gate_report.json
      - name: Keep all matches and negative archive searches for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-osiris-spear-r2a-real-radio-beam-archive-preflight
          path: runtime/osiris_spear_r2a/
          retention-days: 90
          if-no-files-found: warn
