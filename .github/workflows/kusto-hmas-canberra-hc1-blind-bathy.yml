name: KUSTO HMAS Canberra HC1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_hmas_canberra_hc1_blind_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-HMAS-CANBERRA-HC0-KNOWN-WRECK-RECOVERY-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-hmas-canberra-hc1-blind-bathy.yml'
  workflow_dispatch:

jobs:
  hc1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio
      - name: Run hidden-truth blind bathymetry
        run: python workspace/kusto_hmas_canberra_hc1_blind_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-hmas-canberra-hc1-blind-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-HMAS-CANBERRA-HC1-BLIND-BATHYMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
