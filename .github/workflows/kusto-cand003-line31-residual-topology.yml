name: KUSTO CAND003 Line31 Residual Topology

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_line31_residual_topology.py'
      - '.github/workflows/kusto-cand003-line31-residual-topology.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy shapely requests
      - name: Run frozen CAND003 residual-topology diagnostic
        run: python workspace/kusto_cand003_line31_residual_topology.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-line31-residual-topology-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-LINE31-LOCAL-RESIDUAL-TOPOLOGY-RUN-2026-09-23-v1.0.json
          retention-days: 30
