name: JANUS R41S1H1 physical profile synthetic qualification
on:
  push:
    branches: [research/seti-r41s1h1-physical-profile-20261120]
    paths: ['.github/workflows/seti-r41s1h1-physical-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r41s1h1-profile
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Run predeclared physical model and disjoint synthetic stress
        run: |
          python -m py_compile research/seti/r41s1h1_physical_profile.py
          PYTHONPATH=research/seti python -c 'import r41s1h1_physical_profile as m; m.main()'
          test -s runtime/r41s1h1/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r41s1h1-physical-profile
          path: runtime/r41s1h1/
          if-no-files-found: error
          retention-days: 90
