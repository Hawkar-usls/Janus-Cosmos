name: LOVE EDEM Source Classification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/love-edem-source-classify.yml"
      - "workspace/love_edem_source_classify.py"
      - "data/love/LOVE-EDEM-SOURCE-CLASSIFICATION-GATE-v1.json"

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install astronomy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astropy>=7.0" "astroquery>=0.4.11"

      - name: Query catalogs and classify frozen source groups
        run: |
          python workspace/love_edem_source_classify.py \
            --output data/love/LOVE-EDEM-SOURCE-CLASSIFICATION-v1-LATEST-RECEIPT.json

      - name: Show classification receipt
        run: cat data/love/LOVE-EDEM-SOURCE-CLASSIFICATION-v1-LATEST-RECEIPT.json

      - name: Upload classification receipt
        uses: actions/upload-artifact@v4
        with:
          name: love-edem-source-classification-${{ github.run_number }}
          path: data/love/LOVE-EDEM-SOURCE-CLASSIFICATION-v1-LATEST-RECEIPT.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist receipt to Janus-Cosmos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/LOVE-EDEM-SOURCE-CLASSIFICATION-v1-LATEST-RECEIPT.json
          git commit -m "cosmos: freeze LOVE EDEM source classification run ${{ github.run_number }}"
          git push
