name: KUSTO CAND003 Raw EM12 Depth Stage B

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_raw_depth_stageb.py'
      - '.github/workflows/kusto-cand003-raw-depth-stageb.yml'
  workflow_dispatch:

jobs:
  stageb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen raw-depth Stage B
        run: python workspace/kusto_cand003_raw_depth_stageb.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-raw-depth-stageb-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-DOMINANT-CELLS-RAW-DEPTH-STAGEB-RUN-2026-09-23-v1.0.json
          retention-days: 30
