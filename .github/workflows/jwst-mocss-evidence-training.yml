name: JANUS COSMOS JWST MOCSS Evidence-Training Check

on:
  pull_request:
    paths:
      - 'domains/space/JWST_MOCSS_HUDF_SINGLE_LINE_COSMOS_2026-10-16.json'
      - 'domains/space/JWST_MOCSS_HUDF_MAST_INDEPENDENT_RECEIPT_2026-10-16.json'
      - 'domains/space/JWST_MOCSS_HUDF_ORIGIN_SPATIAL_TEST_2026-10-16.json'
      - 'tools/verify_jwst_mocss_hudf_single_line.py'
      - 'tools/verify_jwst_mocss_archive_receipt.py'
      - 'tools/fetch_jwst_mocss_mast_subset.py'
      - 'tools/replay_jwst_mocss_mast_subset.py'
      - '.github/workflows/jwst-mocss-evidence-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JSON syntax
        run: |
          python -m json.tool domains/space/JWST_MOCSS_HUDF_SINGLE_LINE_COSMOS_2026-10-16.json > /dev/null
          python -m json.tool domains/space/JWST_MOCSS_HUDF_MAST_INDEPENDENT_RECEIPT_2026-10-16.json > /dev/null
          python -m json.tool domains/space/JWST_MOCSS_HUDF_ORIGIN_SPATIAL_TEST_2026-10-16.json > /dev/null
      - name: Python replay scripts compile
        run: |
          python -m py_compile tools/fetch_jwst_mocss_mast_subset.py
          python -m py_compile tools/replay_jwst_mocss_mast_subset.py
      - name: Published-source arithmetic and epistemic gates
        run: python tools/verify_jwst_mocss_hudf_single_line.py
      - name: Independent MAST receipt and spatial-origin gates
        run: python tools/verify_jwst_mocss_archive_receipt.py
      - name: Explicit scientific ceiling
        run: |
          echo 'MAST_ARCHIVE_METADATA=CHECKED'
          echo 'TWO_NIRSPEC_DETECTOR_RATES=INSPECTED'
          echo 'THREE_NIRCAM_EPOCHS=DIAGNOSTIC_APERTURE_ONLY'
          echo 'MOCSS_SKY_WAVELENGTH_REEXTRACTION=NOT_EXECUTED'
          echo 'PHYSICAL_IDENTITY=UNRESOLVED'
          echo 'SPATIAL_EXTENT=UNRESOLVED'
          echo 'MODEL_WEIGHTS_UNCHANGED=true'
