name: KUSTO Cross Sound CS1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_cross_sound_cs1_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-ALASKA-UNSEEN-DUALCHANNEL-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-CS0-SOURCE-BINDING-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-CS1-IMPLEMENTATION-ADDENDUM-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-cross-sound-cs1-bathy.yml'
  workflow_dispatch:

jobs:
  cs1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run Cross Sound unseen blind bathymetry
        run: python workspace/kusto_cross_sound_cs1_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cross-sound-cs1-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-CROSS-SOUND-CS1-BLIND-BATHYMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
