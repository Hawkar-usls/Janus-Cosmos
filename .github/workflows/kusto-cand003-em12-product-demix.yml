name: KUSTO CAND003 EM12 Product Demix

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_em12_product_demix.py'
      - '.github/workflows/kusto-cand003-em12-product-demix.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests
      - name: Run frozen processed-product demix diagnostic
        run: python workspace/kusto_cand003_em12_product_demix.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-em12-product-demix-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-CD169-EM12-PRODUCT-DEMIX-RUN-2026-09-22-v1.0.json
          retention-days: 30
