name: KUSTO GMRT JC169 Independence Probe
on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_gmrt_jc169_independence_probe.py'
      - '.github/workflows/kusto-gmrt-jc169-independence-probe.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - run: python workspace/kusto_gmrt_jc169_independence_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-gmrt-jc169-independence-probe-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-GMRT-JC169-INDEPENDENCE-AUDIT-PROBE-2026-09-22-v1.0.json
          retention-days: 30
