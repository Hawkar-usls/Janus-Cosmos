name: JANUS COSMOS x TACHYON R5F — Frozen Mirror Provenance Sidecar
on:
  push:
    branches:
      - research/cosmos-tachyon-r5f-mirror-provenance-20261122
    paths:
      - '.github/workflows/cosmos-tachyon-r5f-bridge.yml'
      - 'research/seti/cosmos_tachyon_r5f_bridge.py'
      - 'research/seti/test_cosmos_tachyon_r5f_bridge.py'
      - 'research/seti/cosmos_tachyon_r5f_bridge_protocol.json'
      - 'research/seti/cosmos_tachyon_r5f_bridge_result.json'
  pull_request:
    paths:
      - '.github/workflows/cosmos-tachyon-r5f-bridge.yml'
      - 'research/seti/cosmos_tachyon_r5f_bridge.py'
      - 'research/seti/test_cosmos_tachyon_r5f_bridge.py'
      - 'research/seti/cosmos_tachyon_r5f_bridge_protocol.json'
      - 'research/seti/cosmos_tachyon_r5f_bridge_result.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mirror-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout frozen research COSMOS input and new sidecar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned actual DemiHead mirror implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/Demi_Head
          ref: 91ef855a6f7119a733990c8f3adeb478e79beb05
          path: _tachyon
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate research source hashes and immutable protocol
        run: |
          set -euo pipefail
          test "$(git hash-object research/seti/r42a8_ood_stress.py)" = "4f11b407e5271a058c38b3186c9f5c8192130655"
          test "$(git -C _tachyon rev-parse HEAD)" = "91ef855a6f7119a733990c8f3adeb478e79beb05"
          test "$(git -C _tachyon hash-object tools/tachyon_r5f_stock_mirror_audit.py)" = "819936767bdf637adc2d9e24cc26176e060e8bfd"
          python -m json.tool research/seti/cosmos_tachyon_r5f_bridge_protocol.json > /dev/null
          python -m py_compile research/seti/cosmos_tachyon_r5f_bridge.py
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 requests==2.32.3
      - name: Check actual mirror and COSMOS bridge against eight metadata scenarios
        run: python -m unittest discover -s research/seti -p 'test_cosmos_tachyon_r5f_bridge.py' -v
      - name: Run frozen COSMOS native pipeline and TACHYON mirror sidecar on 1024 examples
        run: |
          set -euo pipefail
          python research/seti/cosmos_tachyon_r5f_bridge.py --audit
          test -s runtime/cosmos_tachyon_r5f/cosmos_tachyon_r5f_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("runtime/cosmos_tachyon_r5f/cosmos_tachyon_r5f_result.json").read_text())
          a=r["arms"]["C_TACHYON_MIRROR_FORWARD_REPLAY"]
          b=r["arms"]["D_STRONG_DIRECT_PROVENANCE"]
          assert r["test_cases"]==1024
          assert r["original_synthetic_positive_count"]==512
          assert r["original_synthetic_control_count"]==512
          assert len(r["native_regimes"])==2
          assert all(x["rows"]==512 for x in r["native_regimes"])
          assert r["mirror_plus_replay_detects_all_injected_bad_metadata"]
          assert r["mirror_plus_replay_retains_all_intact"]
          assert r["mirror_plus_replay_equivalent_to_strong_direct"]
          assert a["intact_accepted"]==b["intact_accepted"]==128
          assert a["corrupt_accepted"]==b["corrupt_accepted"]==0
          assert a["corrupt_rejected"]==b["corrupt_rejected"]==896
          assert r["production_decisions_changed"]==0
          assert not r["historical_318_localized_69_weak_tested"]
          assert not r["real_telescope_evidence"]
          assert not r["trained_model_modified"]
          assert not r["physical_time_reversal"]
          print("COSMOS_X_TACHYON_N_RADIO_SYNTHETIC=1024")
          print("COSMOS_X_TACHYON_R5F_PROVENANCE_INTACT="+str(a["intact_accepted"]))
          print("COSMOS_X_TACHYON_R5F_PROVENANCE_CORRUPT_REJECTED="+str(a["corrupt_rejected"]))
          print("COSMOS_X_TACHYON_R5F_GAIN_VS_STRONG_DIRECT="+str(r["algorithmic_gain_over_strong_direct"]))
          print("COSMOS_X_TACHYON_ENGINEERING_INTEGRATION_PASS__SCIENCE_HOLD")
          PY
      - name: Preserve complete provenance and native score receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cosmos-tachyon-r5f-mirror-frozen-provenance
          path: |
            runtime/cosmos_tachyon_r5f/cosmos_tachyon_r5f_result.json
            runtime/r42a8/model_lock_verification.json
          if-no-files-found: warn
          retention-days: 90
