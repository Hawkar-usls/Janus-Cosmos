name: Janus Cosmos Expanded Morphology Blind Test

on:
  workflow_dispatch:
    inputs:
      nulls:
        description: 'Nulls per model'
        required: true
        type: choice
        options: ['2048', '4096']
        default: '2048'
      seeds:
        description: 'Comma-separated deterministic seeds'
        required: true
        type: string
        default: '20260810,20260811,20260812'
      target_limit:
        description: 'Maximum discovered targets to score'
        required: true
        type: choice
        options: ['7', '22']
        default: '22'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  expanded-morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy astropy astroquery

      - name: Discover live MAST products
        env:
          TARGET_LIMIT: ${{ inputs.target_limit }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.hst import discover_mast_galaxy_products as d
          targets = d.DEFAULT_TARGETS[:int(__import__('os').environ['TARGET_LIMIT'])]
          import sys
          sys.argv = ['discover', '--out', 'data/hst_expanded_live_manifest.json', '--targets', *targets]
          d.main()
          data = json.loads(Path('data/hst_expanded_live_manifest.json').read_text())
          assert data['selected_targets'] >= 2
          print('LIVE MAST DISCOVERY PASS')
          print('selected_targets =', data['selected_targets'])
          print('selected_products =', data['selected_products'])
          PY

      - name: Run expanded morphology test
        env:
          NULLS: ${{ inputs.nulls }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          python experiments/hst/run_expanded_morphology.py \
            --manifest data/hst_expanded_live_manifest.json \
            --backend mast_api \
            --nulls "$NULLS" \
            --seeds "$SEEDS" \
            --output-dir results/expanded_morphology

      - name: Validate expanded receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/expanded_morphology/janus-cosmos-expanded-morphology-receipt.json')
          d = json.loads(p.read_text())
          assert d['target_count'] >= 2
          assert d['nulls_per_null_model'] >= 2048
          assert len(d['seeds']) >= 3
          assert d['blind_gate']['semantic_analysis'] is False
          assert d['blind_gate']['ocr'] is False
          assert d['blind_gate']['face_search'] is False
          assert d['blind_gate']['cipher_search'] is False
          assert d['blind_gate']['post_hoc_tuning'] is False
          print('JANUS COSMOS EXPANDED MORPHOLOGY PASS')
          print('target_count =', d['target_count'])
          print('consensus_candidate_count =', d['consensus_candidate_count'])
          for row in d['consensus']:
              if row['consensus_cross_band_candidate']:
                  print('CONSENSUS CANDIDATE:', row['target'], row['consensus_passing_filters'])
          PY

      - name: Create CI receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          NULLS: ${{ inputs.nulls }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path('results/expanded_morphology/janus-cosmos-expanded-morphology-receipt.json')
          d = json.loads(p.read_text())
          out = {
            'schema': 'janus.cosmos.expanded_morphology_ci_receipt.v0.1',
            'status': 'PASS',
            'run_id': int(os.environ['RUN_ID']),
            'run_attempt': int(os.environ['RUN_ATTEMPT']),
            'commit_sha': os.environ['SHA'],
            'run_url': f"{os.environ['SERVER_URL']}/Hawkar-usls/Janus-Cosmos/actions/runs/{os.environ['RUN_ID']}",
            'nulls_per_null_model': int(os.environ['NULLS']),
            'seeds': [int(x) for x in os.environ['SEEDS'].split(',')],
            'target_count': d['target_count'],
            'filter_count': d['filter_count'],
            'familywise_alpha': d['familywise_alpha'],
            'consensus_candidate_count': d['consensus_candidate_count'],
            'consensus_candidates': [x for x in d['consensus'] if x['consensus_cross_band_candidate']],
            'manifest_sha256': d['manifest_sha256'],
            'receipt_sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
            'claim_ceiling': d['claim_ceiling'],
          }
          Path('results/expanded_morphology/janus-cosmos-expanded-morphology-ci-receipt.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Upload machine-readable results
        uses: actions/upload-artifact@v6
        with:
          name: janus-cosmos-expanded-morphology-receipt
          path: |
            results/expanded_morphology/
            data/hst_expanded_live_manifest.json

      - name: Publish runtime receipts
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p data/runtime/expanded_morphology
          cp results/expanded_morphology/janus-cosmos-expanded-morphology-receipt.json data/runtime/expanded_morphology/latest.json
          cp results/expanded_morphology/janus-cosmos-expanded-morphology-ci-receipt.json "data/runtime/expanded_morphology/run-${RUN_ID}.json"
          cp data/hst_expanded_live_manifest.json "data/runtime/expanded_morphology/manifest-${RUN_ID}.json"
          git config user.name 'janus-cosmos[bot]'
          git config user.email 'janus-cosmos[bot]@users.noreply.github.com'
          git add data/runtime/expanded_morphology
          git diff --cached --quiet && exit 0
          git commit -m "Persist expanded Janus Cosmos morphology run ${RUN_ID}"
          git push origin main
