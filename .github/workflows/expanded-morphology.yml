name: Janus Cosmos Expanded Morphology v1 (manual)

on:
  workflow_dispatch:
    inputs:
      nulls:
        description: 'Primary test nulls per model'
        required: true
        type: choice
        options: ['4096', '8192']
        default: '4096'
      target_limit:
        description: 'Number of discovery targets to consider'
        required: true
        type: choice
        options: ['7', '22']
        default: '22'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  expanded:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test canonical code
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python -m pytest -q
          python -m py_compile janus_cosmos/*.py
      - name: Discover live MAST products
        env:
          TARGET_LIMIT: ${{ inputs.target_limit }}
        run: |
          mkdir -p results/expanded
          python - <<'PY'
          import os
          from janus_cosmos.discovery import DEFAULT_TARGETS, build_manifest, write_manifest
          n=int(os.environ['TARGET_LIMIT'])
          m=build_manifest(DEFAULT_TARGETS[:n])
          write_manifest('results/expanded/manifest.json',m)
          print('selected_targets =',m['selected_targets'])
          print('selected_products =',m['selected_products'])
          if m['selected_targets']==0:
              raise SystemExit('No live MAST targets discovered')
          PY
      - name: Verify empirical-p resolution
        env:
          NULLS: ${{ inputs.nulls }}
        run: |
          python - <<'PY'
          import json, os
          from janus_cosmos.core import bonferroni_alpha, minimum_test_nulls
          m=json.load(open('results/expanded/manifest.json'))
          filters=sum(len(t['filters']) for t in m['targets'])
          alpha=bonferroni_alpha(0.05,filters,2)
          required=minimum_test_nulls(alpha)
          supplied=int(os.environ['NULLS'])
          print('filters =',filters,'alpha =',alpha,'minimum_nulls =',required,'supplied =',supplied)
          if supplied < required:
              raise SystemExit(f'Underpowered: need at least {required} test nulls/model')
          PY
      - name: Run canonical expanded pipeline
        run: |
          python -u -m janus_cosmos.pipeline \
            --manifest results/expanded/manifest.json \
            --nulls "${{ inputs.nulls }}" \
            --seeds 20260810,20260811,20260812 \
            --output-dir results/expanded/run
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: janus-cosmos-expanded-v1
          if-no-files-found: warn
          path: results/expanded/
