name: KUSTO CAND003 Local Extreme Outer-Beam Tail

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_local_extreme_outer_beam_tail.py'
      - '.github/workflows/kusto-cand003-local-extreme-outer-beam-tail.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific stack
        run: pip install --disable-pip-version-check numpy
      - name: Run frozen local outer-beam tail diagnostic
        run: python workspace/kusto_cand003_local_extreme_outer_beam_tail.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-local-extreme-outer-beam-tail-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-LOCAL-EXTREME-OUTER-BEAM-TAIL-RUN-2026-09-23-v1.0.json
          retention-days: 30
