name: KUSTO Solitary Islands SI5A Truth Inventory

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_solitary_islands_si5a_truth_inventory.py'
      - 'data/cousteau/JANUS-KUSTO-SOLITARY-ISLANDS-SI5-POSTRESULT-GROUNDTRUTH-CHARACTERIZATION-PREREG-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-solitary-islands-si5a-truth-inventory.yml'
  workflow_dispatch:

jobs:
  si5a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Inventory post-result truth package
        run: python workspace/kusto_solitary_islands_si5a_truth_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-solitary-islands-si5a-truth-inventory-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOLITARY-ISLANDS-SI5A-TRUTH-PACKAGE-INVENTORY-2026-09-24-v1.0.json
          retention-days: 30
