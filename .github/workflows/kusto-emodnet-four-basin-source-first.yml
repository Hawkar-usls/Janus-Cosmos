name: KUSTO EMODnet Four Basin Source First

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_emodnet_four_basin_source_first.py'
      - 'data/cousteau/JANUS-KUSTO-EMODNET-FOUR-BASIN-SOURCE-FIRST-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-emodnet-four-basin-source-first.yml'
  workflow_dispatch:

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Query EMODnet source metadata only
        run: python workspace/kusto_emodnet_four_basin_source_first.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-emodnet-four-basin-source-first-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-EMODNET-FOUR-BASIN-SOURCE-FIRST-RUN-2026-09-23-v1.0.json
          retention-days: 30
