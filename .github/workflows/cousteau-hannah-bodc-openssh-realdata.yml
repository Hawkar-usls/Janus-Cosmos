name: Cousteau Hannah BODC OpenSSH Realdata

on:
  push:
    branches:
      - janus-echo-cousteau
    paths:
      - 'workspace/hannah_bodc_local_edge_run.py'
      - '.github/workflows/cousteau-hannah-bodc-openssh-realdata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check paramiko==3.5.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Prepare anonymous BODC SFTP credential
        shell: bash
        run: |
          set +x
          AUTHOR_EMAIL="$(git log -1 --pretty=%ae)"
          if [ -z "$AUTHOR_EMAIL" ]; then
            echo 'Unable to derive anonymous SFTP password email from commit metadata' >&2
            exit 1
          fi
          echo "SSHPASS=$AUTHOR_EMAIL" >> "$GITHUB_ENV"

      - name: Acquire BODCREQ-9408 to ephemeral runner
        shell: bash
        run: |
          set +x
          mkdir -p /tmp/bodc9408
          cat > /tmp/bodc9408.batch <<'EOF'
          cd /bodc/bodc/data/BODCREQ-9408
          lcd /tmp/bodc9408
          get -r .
          bye
          EOF
          sshpass -e sftp \
            -oBatchMode=no \
            -oPreferredAuthentications=keyboard-interactive,password \
            -oStrictHostKeyChecking=accept-new \
            -oUserKnownHostsFile=/tmp/bodc_known_hosts \
            -P 22 anonymous@livftp.noc.ac.uk < /tmp/bodc9408.batch
          find /tmp/bodc9408 -type f -printf '%P\t%s bytes\n' | sort

      - name: Run frozen Synesthetic Memory Core on real EM122 edges
        run: |
          python workspace/hannah_bodc_local_edge_run.py \
            --root /tmp/bodc9408 \
            --output out/JANUS-HANNAH-BODC-REAL-EM122-EDGE-MNEMONICS.json

      - name: Upload derived JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hannah-bodc-real-em122-edge-mnemonics
          path: out/JANUS-HANNAH-BODC-REAL-EM122-EDGE-MNEMONICS.json
          if-no-files-found: warn
          retention-days: 7
