name: KUSTO Global Stage2 Heldout Replay

on:
  push:
    branches:
      - feature/kusto-global-blind-anomaly-hunt-v1
    paths:
      - 'workspace/kusto_global_stage2_heldout_replay.py'
      - '.github/workflows/kusto-global-stage2-heldout-replay.yml'
      - 'data/cousteau/JANUS-KUSTO-GLOBAL-STAGE2-HELDOUT-CROSSSURVEY-REPLAY-PREREG-2026-09-23-v1.0.json'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests shapely
      - name: Run frozen held-out cross-survey replay
        run: python workspace/kusto_global_stage2_heldout_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-global-stage2-heldout-replay-v1
          path: workspace/kusto_global_anomaly_out/JANUS-KUSTO-GLOBAL-STAGE2-HELDOUT-CROSSSURVEY-REPLAY-RUN-2026-09-23-v1.0.json
          retention-days: 30
