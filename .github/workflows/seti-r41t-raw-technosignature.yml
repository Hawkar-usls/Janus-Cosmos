name: JANUS R41T bounded raw technosignature replay
on:
  push:
    branches: [research/seti-r41t-raw-technosignature-20261120]
    paths: ['.github/workflows/seti-r41t-raw-technosignature.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r41t-raw-technosignature
  cancel-in-progress: false
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile raw replay
        run: python -m py_compile research/seti/r41t_raw_technosignature.py
      - name: Authenticate R41B and freeze five viewed archive groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41t_raw_technosignature.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41t-progress-00-prepare
          path: |
            runtime/r41t/progress/00-prepare.json
            runtime/r41t/plan.json
          retention-days: 90
          if-no-files-found: error
      - name: Uninjected four-role archive replay 01 of 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41t_raw_technosignature.py group 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41t-progress-group-01
          path: |
            runtime/r41t/progress/group-01.json
            runtime/r41t/group-01.json
            runtime/r41t/group-01/*.npz
          retention-days: 90
          if-no-files-found: error
      - name: Uninjected four-role archive replay 02 of 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41t_raw_technosignature.py group 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41t-progress-group-02
          path: |
            runtime/r41t/progress/group-02.json
            runtime/r41t/group-02.json
            runtime/r41t/group-02/*.npz
          retention-days: 90
          if-no-files-found: error
      - name: Uninjected four-role archive replay 03 of 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41t_raw_technosignature.py group 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41t-progress-group-03
          path: |
            runtime/r41t/progress/group-03.json
            runtime/r41t/group-03.json
            runtime/r41t/group-03/*.npz
          retention-days: 90
          if-no-files-found: error
      - name: Uninjected four-role archive replay 04 of 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41t_raw_technosignature.py group 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41t-progress-group-04
          path: |
            runtime/r41t/progress/group-04.json
            runtime/r41t/group-04.json
            runtime/r41t/group-04/*.npz
          retention-days: 90
          if-no-files-found: error
      - name: Uninjected four-role archive replay 05 of 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41t_raw_technosignature.py group 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41t-progress-group-05
          path: |
            runtime/r41t/progress/group-05.json
            runtime/r41t/group-05.json
            runtime/r41t/group-05/*.npz
          retention-days: 90
          if-no-files-found: error
      - name: Summarize candidate evidence without origin claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41t_raw_technosignature.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41t-progress-99-summary
          path: |
            runtime/r41t/progress/99-summary.json
            runtime/r41t/result.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41t-raw-technosignature
          path: |
            runtime/r41t/*.json
            runtime/r41t/progress/*.json
            runtime/r41t/group-*/*.npz
          retention-days: 90
          if-no-files-found: warn
