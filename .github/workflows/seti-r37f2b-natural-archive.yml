name: JANUS R37F2B independent natural controls
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f2b-natural-archive.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r37f2b-natural-archive
  cancel-in-progress: false
jobs:
  natural:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 astropy==7.1.0 requests==2.32.3
      - name: Qualify public W3OH frequency switching and spatial OFF catalogue
        run: |
          # R37F2B1 bounded same-authority redirects; retain original result.
          python -m py_compile research/seti/r37f2b_natural_archive.py
          python research/seti/r37f2b_natural_archive.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f2b-natural-archive
          path: runtime/r37f2b/result.json
          if-no-files-found: warn
