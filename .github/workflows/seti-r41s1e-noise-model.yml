name: JANUS R41S1E noise model diagnostic
on:
  push:
    branches: [research/seti-r41s1e-noise-model-20261120]
    paths: ['.github/workflows/seti-r41s1e-noise-model.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r41s1e-noise-model
  cancel-in-progress: false
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.3 scikit-learn==1.6.1
      - name: Compile archived noise diagnostics
        run: python -m py_compile research/seti/r41s1e_noise_model.py
      - name: Test 448 synthetic traces and 891 archived candidate cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41s1e_noise_model.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41s1e-noise-model
          path: runtime/r41s1e/
          retention-days: 90
          if-no-files-found: warn
