name: LOVE EDEM Gaia Mirror Source Clustering

on:
  push:
    branches:
      - research/love-g1-007-multieye-v2
    paths:
      - 'data/love/LOVE_EDEM_GAIA_MIRROR_CLUSTER_PREREG.json'
      - 'janus_cosmos/love_edem_gaia_mirror_cluster.py'
      - '.github/workflows/love-edem-gaia-mirror-cluster.yml'
      - 'requirements.txt'
  pull_request:
    branches:
      - research/luci-only-v1
    paths:
      - 'data/love/LOVE_EDEM_GAIA_MIRROR_CLUSTER_PREREG.json'
      - 'janus_cosmos/love_edem_gaia_mirror_cluster.py'
      - '.github/workflows/love-edem-gaia-mirror-cluster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaia-mirror-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install astronomy stack
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Gaia mirror clustering pass
        run: python -m py_compile janus_cosmos/love_edem_gaia_mirror_cluster.py
      - name: Resolve Gaia mirror and source groups
        run: >-
          python -u -m janus_cosmos.love_edem_gaia_mirror_cluster
          --prereg data/love/LOVE_EDEM_GAIA_MIRROR_CLUSTER_PREREG.json
          --output-dir results/love_edem_gaia_mirror_cluster
      - name: Enforce no-anomaly mode
        run: |
          python - <<'PY'
          import json
          p='results/love_edem_gaia_mirror_cluster/gaia-mirror-cluster-result.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['mode'] == 'WHAT_IS_AT_THESE_COORDINATES'
          assert d['anomaly_scoring_used'] is False
          assert d['firewall']['anomaly_gate_required'] is False
          assert d['firewall']['catalog_proximity_is_not_identity'] is True
          for label,t in d['targets'].items():
              print('\n###', label, t['semantic_alias'])
              print('Gaia mirror:', t['gaia_vizier']['status'], t['gaia_vizier']['count'])
              print('detections:', t['total_catalog_detections'])
              print('clusters:', t['cluster_count'], 'multi=', t['multi_catalog_cluster_count'])
              print('nearest:', json.dumps(t['nearest_cluster'], indent=2, default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: love-edem-gaia-mirror-cluster
          path: results/love_edem_gaia_mirror_cluster/
          if-no-files-found: error
          retention-days: 14
