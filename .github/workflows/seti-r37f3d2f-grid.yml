name: JANUS R37F3D2F physical frequency metadata
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f3d2f-grid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check dysh==1.0.1 requests==2.32.3 numpy==2.2.6 pandas==2.2.3 astropy==7.1.0 specutils==2.1.0 scipy==1.15.3
      - run: |
          python -m py_compile research/seti/r37f3d2f_grid_meta.py
          python research/seti/r37f3d2f_grid_meta.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f3d2f-grid
          path: runtime/r37f3d2f/result.json
          retention-days: 90
          if-no-files-found: warn
