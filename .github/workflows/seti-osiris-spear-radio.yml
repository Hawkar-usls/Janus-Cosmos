name: JANUS COSMOS · OSIRIS SPEAR verified sky-radio coverage
on:
  push:
    branches: [research/seti-osiris-spear-radio-audit-20261121]
    paths:
      - '.github/workflows/seti-osiris-spear-radio.yml'
      - 'research/seti/osiris_spear_radio_protocol.json'
      - 'research/seti/osiris_spear_radio_coverage.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-osiris-spear-radio-r1
  cancel-in-progress: false
jobs:
  official-archive-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pre-frozen target and mirror protocol
        run: |
          python -m py_compile research/seti/osiris_spear_radio_coverage.py
          python -m json.tool research/seti/osiris_spear_radio_protocol.json > /dev/null
          python -m pip install requests==2.32.3
      - name: Query authentic NRAO GBT ObsCore per-scan metadata for OSIRIS directions and controls
        run: |
          python research/seti/osiris_spear_radio_coverage.py
          test -s runtime/osiris_spear_radio_r1/gate_report.json
          test -s runtime/osiris_spear_radio_r1/radio_coverage_inventory.json
          test -s runtime/osiris_spear_radio_r1/mirror_and_control_coverage.json
      - name: Preserve both positive coverage and negative/unavailable results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-osiris-spear-official-radio-archive-coverage
          path: runtime/osiris_spear_radio_r1/
          if-no-files-found: warn
          retention-days: 90
