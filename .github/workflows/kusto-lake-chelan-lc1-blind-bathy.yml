name: KUSTO Lake Chelan LC1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_lake_chelan_lc1_blind_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-LAKE-CHELAN-UNSEEN-DUALCHANNEL-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-LAKE-CHELAN-LC0-SOURCE-RESOLVER-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-LAKE-CHELAN-LC1-RASTER-VALIDITY-ADDENDUM-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-lake-chelan-lc1-blind-bathy.yml'
  workflow_dispatch:

jobs:
  lc1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run unseen blind bathymetry candidate generation
        run: python workspace/kusto_lake_chelan_lc1_blind_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-lake-chelan-lc1-blind-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-LAKE-CHELAN-LC1-BLIND-BATHYMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
