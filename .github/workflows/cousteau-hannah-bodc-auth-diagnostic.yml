name: Cousteau Hannah BODC Auth Diagnostic

on:
  push:
    branches:
      - janus-echo-cousteau
    paths:
      - 'workspace/hannah_bodc_auth_diagnostic.py'
      - '.github/workflows/cousteau-hannah-bodc-auth-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Diagnose BODC archive transports without requester credentials
        run: |
          python workspace/hannah_bodc_auth_diagnostic.py \
            --output out/JANUS-HANNAH-BODC-AUTH-DIAGNOSTIC.json
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-bodc-auth-diagnostic
          path: out/JANUS-HANNAH-BODC-AUTH-DIAGNOSTIC.json
          retention-days: 7
