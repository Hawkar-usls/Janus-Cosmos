name: JANUS Cousteau Argo Geographic and Temporal Stress Gates
on:
  push:
    branches:
      - experiment/cousteau-southern-ocean-20261109
    paths:
      - workspace/cousteau_argo_external_holdout.py
      - .github/workflows/cousteau-argo-stress-holdout.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: cousteau-argo-stress-holdout
  cancel-in-progress: false
jobs:
  scientific-stress-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned linear algebra runtime
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Synthetic provenance and holdout self-test
        run: python workspace/cousteau_argo_external_holdout.py --self-test
      - name: Real Argo-90 blocked heldout evaluations
        run: |
          python workspace/cousteau_argo_external_holdout.py \
            --observations data/cousteau/southern_ocean/argo_observations/argo_core_D_QC1_run-42585534673.json \
            --receipt data/cousteau/southern_ocean/argo_runs/run-42585534673.json \
            --out data/cousteau/southern_ocean/argo_holdout_stress/argo-90-external-holdout-42585534673.json
      - name: Independently preserve stress-gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-argo-stress-${{ github.run_id }}
          path: data/cousteau/southern_ocean/argo_holdout_stress/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Append evaluated report with bounded compare-and-rebase
        shell: bash
        run: |
          set -euo pipefail
          f=data/cousteau/southern_ocean/argo_holdout_stress/argo-90-external-holdout-42585534673.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cousteau: archive float-disjoint Argo temporal/geographic stress gates [skip ci]"
          for retry in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "Non-fast-forward race on attempt $retry"
          done
          exit 1
