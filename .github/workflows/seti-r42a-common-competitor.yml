name: JANUS R42A common R41 competitor exam
on:
  push:
    branches: [research/seti-r42-common-competitor-20261120]
    paths: ['.github/workflows/seti-r42a-common-competitor.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r42a-common-competitor
  cancel-in-progress: false
jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      inputs_id: ${{ steps.inputs.outputs.artifact-id }}
      inputs_digest: ${{ steps.inputs.outputs.artifact-digest }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and authenticate frozen R41 archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r42a_common_export.py research/seti/r42a_native_competitor.py
          python research/seti/r42a_common_export.py prepare
      - name: Export common native group 01 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-01
          path: runtime/r42a/export-01.json
          retention-days: 90
      - name: Export common native group 02 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-02
          path: runtime/r42a/export-02.json
          retention-days: 90
      - name: Export common native group 03 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-03
          path: runtime/r42a/export-03.json
          retention-days: 90
      - name: Export common native group 04 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-04
          path: runtime/r42a/export-04.json
          retention-days: 90
      - name: Export common native group 05 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-05
          path: runtime/r42a/export-05.json
          retention-days: 90
      - name: Export common native group 06 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-06
          path: runtime/r42a/export-06.json
          retention-days: 90
      - name: Export common native group 07 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-07
          path: runtime/r42a/export-07.json
          retention-days: 90
      - name: Export common native group 08 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-08
          path: runtime/r42a/export-08.json
          retention-days: 90
      - name: Export common native group 09 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-09
          path: runtime/r42a/export-09.json
          retention-days: 90
      - name: Export common native group 10 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 9
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-10
          path: runtime/r42a/export-10.json
          retention-days: 90
      - name: Export common native group 11 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r42a_common_export.py group 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a-progress-11
          path: runtime/r42a/export-11.json
          retention-days: 90
      - name: Verify common row parity and historical NOISE masks
        run: python research/seti/r42a_common_export.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: inputs
        with:
          name: janus-r42a-common-inputs
          path: |
            runtime/r42a/inputs/*.npz
            runtime/r42a/receipt.json
          retention-days: 90
  native:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        mode: [bliss, fastdd, turbo]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned BLISS
        if: matrix.mode == 'bliss'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libhdf5-dev libfftw3-dev liblz4-dev pkg-config
          python -m pip install numpy==2.2.6 h5py==3.13.0 requests==2.32.3 matplotlib==3.10.1
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps 'git+https://github.com/UCBerkeleySETI/bliss.git@2b98afe960f13ee7e467aca499576d87ee7502f5'
      - name: Install fastDD build dependencies
        if: matrix.mode == 'fastdd'
        run: python -m pip install numpy==2.2.6 requests==2.32.3
      - name: Install pinned turboSETI
        if: matrix.mode == 'turbo'
        run: |
          python -m pip install numpy==1.26.4 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 numba==0.61.2
          python -m pip install 'git+https://github.com/UCBerkeleySETI/turbo_seti.git@7d9b4fde9bc98d834dc11cfc0acd2380e6676f0e'
      - name: Compare native CPU method on identical arrays
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ID: ${{ needs.common.outputs.inputs_id }}
          INPUT_DIGEST: ${{ needs.common.outputs.inputs_digest }}
          MODE: ${{ matrix.mode }}
        run: |
          lscpu
          python research/seti/r42a_native_competitor.py "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r42a-native-${{ matrix.mode }}
          path: |
            runtime/r42a-native/${{ matrix.mode }}/*.json
            runtime/r42a-native/${{ matrix.mode }}/*.npz
          if-no-files-found: warn
