name: KUSTO CAND003 Raw Line18-vs-Line32 SVP Ancillary

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_raw_line18_line32_svp_ancillary.py'
      - '.github/workflows/kusto-cand003-raw-line18-line32-svp-ancillary.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen raw SVP and ancillary diagnostic
        run: python workspace/kusto_cand003_raw_line18_line32_svp_ancillary.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-raw-line18-line32-svp-ancillary-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-RAW-LINE18-VS-LINE32-SVP-ANCILLARY-RUN-2026-09-23-v1.0.json
          retention-days: 30
