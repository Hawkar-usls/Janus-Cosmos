name: JANUS R39B expanded real archive survey
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r39b-expanded.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r39b-expanded
  cancel-in-progress: false
jobs:
  survey:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [LHS138, LHS288, GJ682, GJ845A, DEN1048]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned R28 dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Search frozen uninjected spectra
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          python -m py_compile research/seti/r39b_expanded.py
          /usr/bin/time -v python research/seti/r39b_expanded.py "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r39b-expanded-${{ matrix.target }}
          path: runtime/r39b_expanded/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 90

# Retry after restoring frozen acquisition parameters; no detector changes.
