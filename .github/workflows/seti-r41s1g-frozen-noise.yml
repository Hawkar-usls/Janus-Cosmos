name: JANUS R41S1G frozen Noise Model qualification
on:
  push:
    branches: [research/seti-r41s1g-frozen-noise-20261120]
    paths: ['.github/workflows/seti-r41s1g-frozen-noise.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 requests==2.32.3
      - name: Verify locked rescue score and prior qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41s1g_frozen_noise.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41s1g-frozen-noise
          path: runtime/r41s1g/
          if-no-files-found: warn
          retention-days: 90
