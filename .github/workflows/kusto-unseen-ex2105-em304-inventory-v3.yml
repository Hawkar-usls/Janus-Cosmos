name: KUSTO Unseen EX2105 EM304 Raw Inventory V3

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_unseen_ex2105_em304_inventory_v3.py'
      - '.github/workflows/kusto-unseen-ex2105-em304-inventory-v3.yml'
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Inventory EX2105 EM304 raw routes without depth
        run: python workspace/kusto_unseen_ex2105_em304_inventory_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-unseen-ex2105-em304-inventory-v3
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-UNSEEN-EX2105-EM304-RAW-INVENTORY-V3-2026-09-23-v1.0.json
          retention-days: 30
