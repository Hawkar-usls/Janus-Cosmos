name: JANUS R41S1G1 Parkes metadata recovery
on:
  push:
    branches: [research/seti-r41s1g1-parkes-metadata-20261120]
    paths: ['.github/workflows/seti-r41s1g1-parkes-metadata.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r41s1g1-parkes
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Authenticate N10C original 80 rejections
        run: |
          python -m py_compile research/seti/r41s1g1_parkes_metadata.py
          PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.prepare()'
          test -s runtime/r41s1g1/plan.json
      - name: Metadata-only cadence 1
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(0)'
      - name: Metadata-only cadence 2
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(1)'
      - name: Metadata-only cadence 3
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(2)'
      - name: Metadata-only cadence 4
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(3)'
      - name: Metadata-only cadence 5
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(4)'
      - name: Metadata-only cadence 6
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(5)'
      - name: Metadata-only cadence 7
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(6)'
      - name: Metadata-only cadence 8
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(7)'
      - name: Metadata-only cadence 9
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(8)'
      - name: Metadata-only cadence 10
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(9)'
      - name: Metadata-only cadence 11
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(10)'
      - name: Metadata-only cadence 12
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(11)'
      - name: Metadata-only cadence 13
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(12)'
      - name: Metadata-only cadence 14
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(13)'
      - name: Metadata-only cadence 15
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(14)'
      - name: Metadata-only cadence 16
        run: PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.group(15)'
      - name: Summarize qualified metadata without promoting candidates
        run: |
          PYTHONPATH=research/seti python -c 'import r41s1g1_parkes_metadata as m; m.summary()'
          test -s runtime/r41s1g1/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41s1g1-parkes-metadata
          path: runtime/r41s1g1/
          if-no-files-found: error
          retention-days: 90
