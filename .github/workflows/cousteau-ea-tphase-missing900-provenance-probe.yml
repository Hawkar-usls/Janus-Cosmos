name: Cousteau EA T-phase Missing-900 Provenance Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ea-tphase-missing900-provenance-probe.yml"
      - "workspace/cousteau_ea_tphase_missing900_provenance_probe.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-MISSING-900-PROVENANCE-PROBE-2026-08-21-v1.1.json"
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ea-tphase-missing900-provenance-probe.yml"
      - "workspace/cousteau_ea_tphase_missing900_provenance_probe.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-MISSING-900-PROVENANCE-PROBE-2026-08-21-v1.1.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify frozen v1.1 provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          canonical="data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-MISSING-900-PROVENANCE-PROBE-2026-08-21-v1.1.json"
          test "$(git hash-object "$canonical")" = "96e6f53e88e1cf724fe5a571b06a0f3726ae2b6e"
          echo "MISSING900_V1_1_RECEIPT_IMMUTABLE=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install direct dependency
        run: python -m pip install "requests==2.34.2"

      - name: Replay provenance probe outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cousteau-missing900-provenance
          (
            cd "$RUNNER_TEMP"
            python "$GITHUB_WORKSPACE/workspace/cousteau_ea_tphase_missing900_provenance_probe.py"
          )
          result="$RUNNER_TEMP/data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-MISSING-900-PROVENANCE-PROBE-2026-08-21-v1.1.json"
          test -f "$result"
          cp "$result" "artifacts/cousteau-missing900-provenance/replay-${GITHUB_RUN_ID}.json"

      - name: Validate provenance gate remains non-promotional
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('artifacts/cousteau-missing900-provenance').glob('replay-*.json'))
          r=json.loads(p.read_text(encoding='utf-8'))
          k=r['known_contract']
          assert k['paper_reported_events']==6843
          assert k['deposited_rows']==5943
          assert k['difference']==900
          assert r['status']=='PROBE_COMPLETE__WAYBACK_QUERY_REPAIRED__PROVENANCE_GATE_REMAINS_OPEN'
          statuses={row['id']:row['status'] for row in r['candidate_explanations']}
          assert 'VERIFIED' not in set(statuses.values())
          print('MISSING900_PROVENANCE_GATE=OPEN')
          print('SOURCE_WRITEBACK=FALSE')
          PY
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-MISSING-900-PROVENANCE-PROBE-2026-08-21-v1.1.json)" = "96e6f53e88e1cf724fe5a571b06a0f3726ae2b6e"
          test -z "$(git status --porcelain -- data/cousteau)"

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-ea-tphase-missing900-provenance-${{ github.run_id }}
          path: artifacts/cousteau-missing900-provenance/
          if-no-files-found: error
          retention-days: 90
