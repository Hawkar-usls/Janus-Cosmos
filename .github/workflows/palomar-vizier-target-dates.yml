name: Palomar VizieR Target Dates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/palomar-vizier-target-dates.yml"
      - "workspace/palomar_vizier_target_dates.py"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "astropy>=7.0" "astroquery>=0.4.10"
      - name: Run
        run: python workspace/palomar_vizier_target_dates.py
      - name: Show
        if: always()
        run: cat data/love/LOVE-EDEM-STARGATE-PALOMAR-VIZIER-DATES-v1-LATEST-RECEIPT.json || true
      - name: Persist
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/LOVE-EDEM-STARGATE-PALOMAR-VIZIER-DATES-v1-LATEST-RECEIPT.json
          git commit -m "cosmos: freeze Palomar VizieR target dates run ${{ github.run_number }}"
          git pull --rebase origin main
          git push
