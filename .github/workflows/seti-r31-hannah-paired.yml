name: JANUS SETI R31 HANNAH fresh paired exam
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r31-hannah-paired.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-seti-r31-hannah
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and verify frozen parent
        run: |
          python -m py_compile research/seti/r31_hannah_paired.py research/seti/hannah_observation_hook.py
          python - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('research/seti/memory/hannah_library_v0002.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='95f90afbb07e1bca4d73fb28d1da64e778f59d019782587ef1ec7a868ddebc1e'
          PY
      - name: Freeze new target and days
        run: python research/seti/r31_hannah_paired.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: manifest
        with:
          name: janus-seti-r31-manifest
          path: runtime/r31/manifest.json
      - name: Evaluate frozen memory and stage measured observations
        env:
          HANNAH_MANIFEST_ARTIFACT_ID: ${{ steps.manifest.outputs.artifact-id }}
          HANNAH_MANIFEST_ARTIFACT_SHA256: ${{ steps.manifest.outputs.artifact-digest }}
        run: python research/seti/r31_hannah_paired.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r31-hannah-result
          path: runtime/r31/*.json
          if-no-files-found: warn
      - name: Verify receipt and memory lineage without treating HOLD as a failure
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('runtime/r31')
          d=json.loads((p/'result.json').read_text());h=json.loads((p/'hook_result.json').read_text())
          l=json.loads((p/'library.json').read_text())
          old=json.loads(pathlib.Path('research/seti/memory/hannah_library_v0002.json').read_text())
          assert len(d['targets'])==6 and len({q['day'] for q in d['targets']})==6
          assert all(v['positives']==512 and v['controls']==512 for v in d['modes'].values())
          assert all(v['positives']==128 for v in d['leak_challenge'].values())
          assert d['gate']==('PASS_DEVELOPMENT' if all(d['gate_checks'].values()) else 'HOLD')
          assert h['observations']==96 and h['replay']['added']==0 and h['verified_rfi']==1
          assert l['entries'][:66]==old['entries'] and len(l['entries'])==66+h['delta']['added']
          assert h['library_sha256']==hashlib.sha256((p/'library.json').read_bytes()).hexdigest()
          assert not d['production_adoption'] and not h['production_adoption']
          PY
