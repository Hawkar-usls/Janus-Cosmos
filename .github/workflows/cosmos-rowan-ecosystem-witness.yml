name: JANUS Cosmos Rowan TOPA AURA Demiurge Witness
on:
  workflow_run:
    workflows: ['JANUS Cosmos Observer Pages', 'JANUS Beetle Memory Receiver']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/rowan_cosmos_bridge.py'
      - 'tests/test_rowan_cosmos_bridge.py'
      - '.github/workflows/cosmos-rowan-ecosystem-witness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/rowan_cosmos_bridge.py'
      - 'tests/test_rowan_cosmos_bridge.py'
      - '.github/workflows/cosmos-rowan-ecosystem-witness.yml'

permissions:
  contents: read

concurrency:
  group: janus-cosmos-rowan-evidence-witness
  cancel-in-progress: false

jobs:
  validate-and-witness:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source and authority adversarial tests
        run: |
          python -m py_compile tools/rowan_cosmos_bridge.py tests/test_rowan_cosmos_bridge.py
          python -m unittest discover -v -s tests -p 'test_rowan_cosmos_bridge.py'
      - name: Independently validate exact public source bindings; no Rowan API or credits
        run: python tools/rowan_cosmos_bridge.py --out "$RUNNER_TEMP/rowan-cosmos-witness.json"
      - name: Preserve no-secret scientific witness artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-rowan-witness-${{ github.run_id }}
          path: ${{ runner.temp }}/rowan-cosmos-witness.json
          retention-days: 14
          if-no-files-found: error

  archive:
    if: github.event_name != 'pull_request'
    needs: validate-and-witness
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revalidate sources and create deterministic immutable Cosmos archive
        run: python tools/rowan_cosmos_bridge.py --persist-root .
      - name: Publish source-bound receipt; fail closed on divergent upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JANUS Cosmos Evidence Witness'
          git config user.email 'actions@users.noreply.github.com'
          git add data/integrations/rowan/
          if git diff --cached --quiet; then
            echo 'COSMOS_ROWAN_ARCHIVE=IDEMPOTENT_NO_CHANGE'
            exit 0
          fi
          git commit -m 'Cosmos: archive source-bound Rowan scientific witness'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'COSMOS_ROWAN_ARCHIVE=CONFLICT_HOLD'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'COSMOS_ROWAN_ARCHIVE=PERSISTED'
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'COSMOS_ROWAN_ARCHIVE=PUSH_FAILED'
          exit 1
