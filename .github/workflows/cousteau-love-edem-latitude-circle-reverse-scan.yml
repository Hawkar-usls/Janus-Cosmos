name: Cousteau Love-Edem Latitude Circle Reverse Scan

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/cousteau_love_edem_latitude_circle_reverse_scan.py"
      - ".github/workflows/cousteau-love-edem-latitude-circle-reverse-scan.yml"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-LOVE-EDEM-LATITUDE-CIRCLE-SIDEREAL-PHASE-REVERSE-SCAN-PREREG-2026-08-21-v1.0.json"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests numpy
      - name: Run preregistered 360-degree reverse scan
        run: python workspace/cousteau_love_edem_latitude_circle_reverse_scan.py
      - name: Show summary
        run: |
          python - <<'PY'
          import json
          p='data/cousteau/JANUS-ECHO-COUSTEAU-LOVE-EDEM-LATITUDE-CIRCLE-SIDEREAL-PHASE-REVERSE-SCAN-RUN-001-2026-08-21-v1.0.json'
          d=json.load(open(p,encoding='utf-8'))
          print(json.dumps({'primary':d['primary_af_sa_scan'],'secondary':d['secondary_blind_cluster_center_scan'],'interpretation':d['interpretation']},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-love-edem-latitude-circle-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-LOVE-EDEM-LATITUDE-CIRCLE-SIDEREAL-PHASE-REVERSE-SCAN-RUN-001-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-LOVE-EDEM-LATITUDE-CIRCLE-SIDEREAL-PHASE-REVERSE-SCAN-RUN-001-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze Love-Edem latitude-circle reverse scan ${{ github.run_number }}" || true
          git pull --rebase origin janus-echo-cousteau || true
          git push origin HEAD:janus-echo-cousteau
