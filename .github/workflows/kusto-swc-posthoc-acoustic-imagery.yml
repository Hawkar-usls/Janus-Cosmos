name: KUSTO SWC Posthoc Acoustic Imagery Intersection

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_southwest_corner_posthoc_supported_vs_imagery.py'
      - '.github/workflows/kusto-swc-posthoc-acoustic-imagery.yml'
  workflow_dispatch:

jobs:
  swcpost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Intersect already-frozen acoustic support and imagery coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_southwest_corner_posthoc_supported_vs_imagery.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-swc-posthoc-acoustic-imagery-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOUTHWEST-CORNER-POSTHOC-SWC2-SUPPORTED-VS-IMAGERY-COVERAGE-2026-09-24-v1.0.json
          retention-days: 30
