name: KUSTO NGDR SM222 Fast Boundary
on:
  push:
    branches: [feature/kusto-global-groundtruth-calibration-v1]
    paths:
      - 'workspace/kusto_ngdr_sm222_fast_boundary.py'
      - '.github/workflows/kusto-ngdr-sm222-fast-boundary.yml'
  workflow_dispatch:
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check requests
      - run: python workspace/kusto_ngdr_sm222_fast_boundary.py
