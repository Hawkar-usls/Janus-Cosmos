name: KUSTO HMAS Canberra HC2 Truth Score

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_hmas_canberra_hc2_truth_score.py'
      - 'data/cousteau/JANUS-KUSTO-HMAS-CANBERRA-HC0-KNOWN-WRECK-RECOVERY-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-HMAS-CANBERRA-HC1-BLIND-BATHYMETRY-RECEIPT-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-hmas-canberra-hc2-truth-score.yml'
  workflow_dispatch:

jobs:
  hc2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests pyproj
      - name: Unlock official dive-site anchor and score frozen candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_hmas_canberra_hc2_truth_score.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-hmas-canberra-hc2-truth-score-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-HMAS-CANBERRA-HC2-TRUTH-UNLOCK-RECOVERY-SCORE-2026-09-23-v1.0.json
          retention-days: 30
