name: JANUS R42A5 combined JANUS NOISE historical audit
on:
  push:
    branches: [research/seti-r42a5-combined-score-20261121]
    paths:
      - '.github/workflows/seti-r42a5-combined-score.yml'
      - 'research/seti/r42a5_combined_score.py'
      - 'research/seti/r42a5_combined_score_protocol.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r42a5-combined-score
  cancel-in-progress: false
jobs:
  fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate protocol and install pinned dependencies
        run: |
          python -m py_compile research/seti/r42a5_combined_score.py
          python -m json.tool research/seti/r42a5_combined_score_protocol.json >/dev/null
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 requests==2.32.3
      - name: Authenticate four frozen archives, calibrate on fit groups and audit paired signal preservation
        run: |
          python research/seti/r42a5_combined_score.py
          test -s runtime/r42a5/fit_lock.json
          test -s runtime/r42a5/result.json
          test -s runtime/r42a5/all_scores.npz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r42a5-combined-score-audit
          path: runtime/r42a5/
          if-no-files-found: warn
          retention-days: 90
