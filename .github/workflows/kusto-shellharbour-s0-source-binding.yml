name: KUSTO Shellharbour S0 Source Binding

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_shellharbour_s0_source_binding.py'
      - 'data/cousteau/JANUS-KUSTO-SHELLHARBOUR-S0-SOURCE-BINDING-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-shellharbour-s0-source-binding.yml'
  workflow_dispatch:

jobs:
  s0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve Shellharbour AusSeabed survey layers without raster values
        run: python workspace/kusto_shellharbour_s0_source_binding.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-shellharbour-s0-source-binding-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SHELLHARBOUR-S0-SOURCE-BINDING-RUN-2026-09-23-v1.0.json
          retention-days: 30
