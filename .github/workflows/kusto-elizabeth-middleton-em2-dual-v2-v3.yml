name: KUSTO Elizabeth Middleton EM2 Dual V2 V3

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_elizabeth_middleton_em2_dual_v2_v3.py'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0B-ARCHIVE-MEMBER-RECEIPT-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0C-DUAL-METHOD-FREEZE-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0E-PAIRED-DOMAIN-REPROJECTION-FREEZE-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM1-BLIND-BATHYMETRY-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-elizabeth-middleton-em2-dual-v2-v3.yml'
  workflow_dispatch:

jobs:
  em2:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run frozen v2 comparator and v3 MAD-guard successor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_elizabeth_middleton_em2_dual_v2_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-elizabeth-middleton-em2-dual-v2-v3
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM2-DUAL-V2-V3-UNSEEN-BACKSCATTER-RUN-2026-09-24-v1.0.json
          retention-days: 30
