name: EDEM Giza Reverse Spear Resolver

on:
  push:
    branches:
      - research/love-g1-007-multieye-v2
    paths:
      - 'data/love/EDEM_GIZA_REVERSE_SPEAR_PREREG.json'
      - 'janus_cosmos/edem_giza_resolver.py'
      - '.github/workflows/edem-giza-reverse-spear.yml'
      - 'requirements.txt'
  pull_request:
    branches:
      - research/luci-only-v1
    paths:
      - 'data/love/EDEM_GIZA_REVERSE_SPEAR_PREREG.json'
      - 'janus_cosmos/edem_giza_resolver.py'
      - '.github/workflows/edem-giza-reverse-spear.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  resolve-edem-from-giza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install astronomy stack
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile resolver
        run: python -m py_compile janus_cosmos/edem_giza_resolver.py
      - name: Run Giza anchored reverse spear
        run: >-
          python -u -m janus_cosmos.edem_giza_resolver
          --prereg data/love/EDEM_GIZA_REVERSE_SPEAR_PREREG.json
          --output results/edem_giza_reverse_spear/edem-giza-result.json
      - name: Enforce Giza observer firewall
        run: |
          python - <<'PY'
          import json
          p='results/edem_giza_reverse_spear/edem-giza-result.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['frame_policy']['all_reflection_geometry_observer']=='GIZA_GREAT_PYRAMID_APPROX_CENTER'
          assert d['frame_policy']['telescope_locations_used_for_geometry'] is False
          assert d['frame_policy']['love_projected_topocentrically_at_finite_distance'] is True
          assert d['edem_identity_confirmed'] is False
          print('EDEM GIZA FRAME FIREWALL PASS')
          print('gate =', d['gate_status'])
          print('face =', d['refined_best']['face'])
          print('time =', d['refined_best']['time_utc'])
          print('error_deg =', d['refined_best']['angular_error_to_moon_deg'])
          print('EDEM_DIRECTION_ICRS =', d['edem_geometry_direction_candidate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edem-giza-reverse-spear-result
          path: results/edem_giza_reverse_spear/
          if-no-files-found: error
          retention-days: 14
