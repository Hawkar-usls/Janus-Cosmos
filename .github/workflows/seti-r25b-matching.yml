name: JANUS SETI R25B Fundamentum conflict matching
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r25b-matching.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 requests==2.32.3
      - name: Exact matching and component factoring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r25b_conflict_matching.py
          python research/seti/r25b_conflict_matching.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r25b-result
          path: runtime/r25b/*.json
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r25b/result.json"))
          assert d["selftests"]["brute_force_cases"]==64
          assert d["objective_mismatches"]==0
          assert d["synthetic"]["cases"]==96
          assert not d["production_adoption"]
          PY
