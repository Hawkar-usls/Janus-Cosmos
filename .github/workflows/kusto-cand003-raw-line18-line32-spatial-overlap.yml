name: KUSTO CAND003 Raw Line18-vs-Line32 Spatial Overlap

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_raw_line18_line32_spatial_overlap.py'
      - '.github/workflows/kusto-cand003-raw-line18-line32-spatial-overlap.yml'
  workflow_dispatch:

jobs:
  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests
      - name: Run frozen raw spatial-overlap gate
        run: python workspace/kusto_cand003_raw_line18_line32_spatial_overlap.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-raw-line18-line32-spatial-overlap-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-RAW-LINE18-VS-LINE32-SPATIAL-OVERLAP-RUN-2026-09-23-v1.0.json
          retention-days: 30
