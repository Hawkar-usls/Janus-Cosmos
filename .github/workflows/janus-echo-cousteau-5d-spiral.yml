name: JANUS Echo Cousteau 5D Spiral

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/cousteau_5d_spiral_tranception_reverse.py"
      - ".github/workflows/janus-echo-cousteau-5d-spiral.yml"

permissions:
  contents: write

jobs:
  spiral:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 5D spiral engine
        run: |
          python workspace/cousteau_5d_spiral_tranception_reverse.py

      - name: Show summary
        run: |
          cat data/cousteau/JANUS-ECHO-COUSTEAU-5D-SPIRAL-TRANCEPTION-REVERSE-RUN-001-2026-08-21-v1.0-SUMMARY.json

      - name: Persist spiral receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-5D-SPIRAL-TRANCEPTION-REVERSE-RUN-001-2026-08-21-v1.0.json
          git add data/cousteau/JANUS-ECHO-COUSTEAU-5D-SPIRAL-TRANCEPTION-REVERSE-RUN-001-2026-08-21-v1.0-SUMMARY.json
          git add data/cousteau/5d_spiral_stream/run-001
          git commit -m "Cousteau: freeze 5D spiral run 1" || exit 0
          git push
