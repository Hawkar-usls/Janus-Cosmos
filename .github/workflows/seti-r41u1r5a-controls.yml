name: JANUS R41U1R5A matched natural controls
on:
  push:
    branches: [research/seti-r41u1r5-controls-20261120]
    paths: ['.github/workflows/seti-r41u1r5a-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r41u1r5a-controls
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.3 astropy==7.0.2 astroquery==0.4.10
      - name: Verify R4 archive and compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r41u1r5a_controls.py
          python research/seti/r41u1r5a_controls.py prepare
      - name: Select Gaia control group A without infrared pixels
        run: python research/seti/r41u1r5a_controls.py bounded-select A
      - name: Select Gaia control group B without infrared pixels
        run: python research/seti/r41u1r5a_controls.py bounded-select B
      - name: Select Gaia control group C without infrared pixels
        run: python research/seti/r41u1r5a_controls.py bounded-select C
      - name: Select Gaia control group D without infrared pixels
        run: python research/seti/r41u1r5a_controls.py bounded-select D
      - name: Select Gaia control group E without infrared pixels
        run: python research/seti/r41u1r5a_controls.py bounded-select E
      - name: Select Gaia control group F without infrared pixels
        run: python research/seti/r41u1r5a_controls.py bounded-select F
      - name: Select Gaia control group G without infrared pixels
        run: python research/seti/r41u1r5a_controls.py bounded-select G
      - name: Freeze all selections before control infrared retrieval
        run: python research/seti/r41u1r5a_controls.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-selection-lock
          path: |
            runtime/r41u1r5a/selection_lock.json
            runtime/r41u1r5a/select-*.json
            runtime/r41u1r5a/*-cone.csv
          retention-days: 90
      - name: Measure native control group A
        run: python research/seti/r41u1r5a_controls.py bounded-measure A
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-control-A
          path: |
            runtime/r41u1r5a/measure-A.json
            runtime/r41u1r5a/A-*.fits
          retention-days: 90
      - name: Measure native control group B
        run: python research/seti/r41u1r5a_controls.py bounded-measure B
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-control-B
          path: |
            runtime/r41u1r5a/measure-B.json
            runtime/r41u1r5a/B-*.fits
          retention-days: 90
      - name: Measure native control group C
        run: python research/seti/r41u1r5a_controls.py bounded-measure C
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-control-C
          path: |
            runtime/r41u1r5a/measure-C.json
            runtime/r41u1r5a/C-*.fits
          retention-days: 90
      - name: Measure native control group D
        run: python research/seti/r41u1r5a_controls.py bounded-measure D
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-control-D
          path: |
            runtime/r41u1r5a/measure-D.json
            runtime/r41u1r5a/D-*.fits
          retention-days: 90
      - name: Measure native control group E
        run: python research/seti/r41u1r5a_controls.py bounded-measure E
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-control-E
          path: |
            runtime/r41u1r5a/measure-E.json
            runtime/r41u1r5a/E-*.fits
          retention-days: 90
      - name: Measure native control group F
        run: python research/seti/r41u1r5a_controls.py bounded-measure F
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-control-F
          path: |
            runtime/r41u1r5a/measure-F.json
            runtime/r41u1r5a/F-*.fits
          retention-days: 90
      - name: Measure native control group G
        run: python research/seti/r41u1r5a_controls.py bounded-measure G
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1r5a-control-G
          path: |
            runtime/r41u1r5a/measure-G.json
            runtime/r41u1r5a/G-*.fits
          retention-days: 90
      - name: Summarize descriptive control measurements
        run: python research/seti/r41u1r5a_controls.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41u1r5a-controls
          path: runtime/r41u1r5a/
          retention-days: 90
          if-no-files-found: warn
