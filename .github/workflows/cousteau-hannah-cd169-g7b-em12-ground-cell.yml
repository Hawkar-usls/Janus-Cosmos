name: Cousteau Hannah CD169 G7B EM12 Ground Cell
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_cd169_em12_ground_cell_probe.py'
      - 'data/cousteau/JANUS-HANNAH-CD169-G7B-EM12-COVERAGE-CONTRACT-2026-08-26-v1.0.json'
      - '.github/workflows/cousteau-hannah-cd169-g7b-em12-ground-cell.yml'
permissions:
  contents: read
jobs:
  em12:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile workspace/hannah_cd169_em12_ground_cell_probe.py
      - name: Phase A XY-only coverage then conditional Phase B bathymetry
        id: probe
        continue-on-error: true
        run: |
          python workspace/hannah_cd169_em12_ground_cell_probe.py \
            --output out/JANUS-HANNAH-CD169-G7B-EM12-GROUND-CELL-RUN-001.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hannah-cd169-g7b-em12-ground-cell
          path: out/JANUS-HANNAH-CD169-G7B-EM12-GROUND-CELL-RUN-001.json
          if-no-files-found: error
          retention-days: 7
      - name: Propagate execution failure after receipt preservation
        if: steps.probe.outcome == 'failure'
        run: exit 1
