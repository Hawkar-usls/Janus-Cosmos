name: KUSTO Independent Photo Coverage Audit

on:
  push:
    branches:
      - feature/kusto-global-blind-anomaly-hunt-v1
    paths:
      - 'workspace/kusto_global_20_independent_photo_coverage.py'
      - 'data/cousteau/JANUS-KUSTO-GLOBAL-20-INDEPENDENT-PHOTO-COVERAGE-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-independent-photo-coverage.yml'
  workflow_dispatch:

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Query independent georeferenced image archive
        run: python workspace/kusto_global_20_independent_photo_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-independent-photo-coverage-v1
          path: workspace/kusto_global_anomaly_out/JANUS-KUSTO-GLOBAL-20-INDEPENDENT-PHOTO-COVERAGE-RUN-2026-09-23-v1.0.json
          retention-days: 30
