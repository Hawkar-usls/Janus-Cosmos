name: JANUS SETI R21E weak signal neural development
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r21e-weak-neural.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train freeze and compare on development-only target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r21e_weak_neural.py
          python research/seti/r21e_weak_neural.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r21e-neural-development
          path: runtime/r21e/*.json
      - run: |
          python - <<'PY'
          import hashlib,json
          d=json.load(open("runtime/r21e/result.json"))
          assert d["train_samples"]==768 and d["calibration_samples"]==512 and d["development_samples"]==256
          assert hashlib.sha256(open("runtime/r21e/weights.json","rb").read()).hexdigest()==d["weights_sha256"]
          assert d["status"]=="DEVELOPMENT_ONLY" and not d["production_adoption"]
          PY
