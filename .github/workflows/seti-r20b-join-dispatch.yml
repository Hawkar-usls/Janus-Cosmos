name: JANUS SETI R20B adaptive exact join dispatch
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r20b-join-dispatch.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 requests==2.32.3
      - name: Frozen adaptive join paired exam
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r20b_join_dispatch.py
          python research/seti/r20b_join_dispatch.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r20b-result
          path: runtime/r20b/*.json
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r20b/result.json"))
          assert d["mismatches"]==0 and d["holdout"]["cases"]==64
          assert not d["production_adoption"]
          PY
