name: JANUS COSMOS OSIRIS SPEAR R2F · public DAP original FITS header probe
on:
  push:
    branches: [research/seti-osiris-spear-r2f-dap-psrfits-20261121]
    paths:
      - '.github/workflows/seti-osiris-spear-r2f-dap.yml'
      - 'research/seti/osiris_spear_r2f_dap.py'
      - 'research/seti/osiris_spear_r2f_dap_protocol.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-osiris-r2f-dap-public
  cancel-in-progress: false
jobs:
  file-access-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile research/seti/osiris_spear_r2f_dap.py
          python -m json.tool research/seti/osiris_spear_r2f_dap_protocol.json > /dev/null
          python -m pip install requests==2.32.3
      - name: Check official public CSIRO DAP file API without full spectral download
        run: |
          python research/seti/osiris_spear_r2f_dap.py
          test -s runtime/osiris_spear_r2f/dap_file_access.json
          test -s runtime/osiris_spear_r2f/r2f_gate_report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-osiris-r2f-CSIRO-DAP-public-original-header-check
          path: runtime/osiris_spear_r2f/
          retention-days: 90
          if-no-files-found: warn
