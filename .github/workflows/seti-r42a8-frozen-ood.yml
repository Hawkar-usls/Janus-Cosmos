name: JANUS COSMOS R42A8A — frozen shadow OOD stress, no production veto
on:
  push:
    branches: [research/seti-r42a8-frozen-ood-stress-20261121]
    paths:
      - '.github/workflows/seti-r42a8-frozen-ood.yml'
      - 'research/seti/r42a8_ood_stress.py'
      - 'research/seti/r42a8_ood_stress_protocol.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r42a8-frozen-ood-stress
  cancel-in-progress: false
jobs:
  frozen-generalization-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate preregistration and freeze dependencies
        run: |
          python -m py_compile research/seti/r42a8_ood_stress.py
          python -m json.tool research/seti/r42a8_ood_stress_protocol.json > /dev/null
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 requests==2.32.3
      - name: Retrieve authenticated frozen R42A7 model and assess two unfamiliar synthetic spectra regimes
        run: |
          python research/seti/r42a8_ood_stress.py
          test -s runtime/r42a8/model_lock_verification.json
          test -s runtime/r42a8/result.json
          test -s runtime/r42a8/invariance_probe.json
          test -s runtime/r42a8/r42a8_scores.npz
      - name: Preserve full synthetic stress receipts, including negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r42a8-frozen-model-new-synthetic-stress
          path: runtime/r42a8/
          retention-days: 90
          if-no-files-found: warn
