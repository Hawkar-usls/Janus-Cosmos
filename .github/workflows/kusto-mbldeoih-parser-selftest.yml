name: KUSTO MBLDEOIH Parser Selftest
on:
  push:
    branches: [feature/kusto-cross-survey-validation-v1]
    paths:
      - 'workspace/kusto_mbldeoih_reader.py'
      - 'workspace/kusto_mbldeoih_parser_selftest.py'
      - '.github/workflows/kusto-mbldeoih-parser-selftest.yml'
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check requests
      - name: Run source-exact MBLDEOIH parser selftest
        run: PYTHONPATH=workspace python workspace/kusto_mbldeoih_parser_selftest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kusto-mbldeoih-parser-selftest-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-MBLDEOIH-V1-V5-PARSER-SELFTEST-2026-09-23-v1.0.json
          retention-days: 30
