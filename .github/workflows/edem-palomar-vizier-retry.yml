name: EDEM Palomar VizieR Retry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edem-palomar-vizier-retry.yml"
      - "workspace/edem_palomar_vizier_retry.py"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python workspace/edem_palomar_vizier_retry.py
      - if: always()
        run: |
          test -f data/love/EDEM-PALOMAR-VIZIER-RETRY-v1-LATEST-RECEIPT.json || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/EDEM-PALOMAR-VIZIER-RETRY-v1-LATEST-RECEIPT.json
          git commit -m "cosmos: freeze EDEM Palomar VizieR retry ${{ github.run_number }}"
          git pull --rebase origin main
          git push
