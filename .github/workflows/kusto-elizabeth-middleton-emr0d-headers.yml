name: KUSTO Elizabeth Middleton EMR0D Header Audit

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_elizabeth_middleton_emr0d_headers.py'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EMR0C-EXACT-SOURCE-SELECTION-FREEZE-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-elizabeth-middleton-emr0d-headers.yml'
  workflow_dispatch:

jobs:
  emr0d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests rasterio
      - name: Read GA4848 raster headers only
        run: python workspace/kusto_elizabeth_middleton_emr0d_headers.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-elizabeth-middleton-emr0d-headers-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ELIZABETH-MIDDLETON-EMR0D-RASTER-HEADER-AUDIT-2026-09-24-v1.0.json
          retention-days: 30
