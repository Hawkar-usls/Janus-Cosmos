name: Cousteau MGDS Accept Probe

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-mgds-accept-probe.yml"
      - "workspace/cousteau_mgds_accept_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Probe MGDS accept endpoint
        run: python workspace/cousteau_mgds_accept_probe.py
      - name: Show compact endpoint result
        run: |
          python - <<'PY'
          import json
          p='data/cousteau/JANUS-ECHO-COUSTEAU-MGDS-DOWNLOAD-ACCEPT-PROBE-2026-08-21-v1.0.json'
          d=json.load(open(p,encoding='utf-8'))
          for x in d['steps'][-2:]:
              print(x['stage'], x['status'], x['bytes'], x['headers'], x['magic_hex'])
              if x.get('body_prefix'): print(x['body_prefix'][:2000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-mgds-accept-probe-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-MGDS-DOWNLOAD-ACCEPT-PROBE-2026-08-21-v1.0.json
          retention-days: 30
      - name: Freeze diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-MGDS-DOWNLOAD-ACCEPT-PROBE-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze MGDS accept response probe ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
