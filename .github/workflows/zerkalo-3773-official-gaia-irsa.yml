name: JANUS COSMOS — точка 3773 official Gaia IRSA
on:
  push:
    branches: [research/zerkalo-janusa-collapse-r2-20261121]
    paths: ['.github/workflows/zerkalo-3773-official-gaia-irsa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-zerkalo-3773-official-gaia-irsa
  cancel-in-progress: false
jobs:
  verify-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare direct TAP client
        run: |
          python -m py_compile research/numeric_sky/direct_gaia_irsa_3773.py
          python -m pip install requests==2.32.3
      - name: Verify frozen SIMBAD result and query ESA Gaia plus NASA AllWISE from primary archives
        run: |
          python research/numeric_sky/direct_gaia_irsa_3773.py
          test -s runtime/numeric_sky/singularity/3773_direct_gaia_allwise.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-zerkalo-3773-official-gaia-irsa
          path: runtime/numeric_sky/singularity/
          if-no-files-found: warn
          retention-days: 90
