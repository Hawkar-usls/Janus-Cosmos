name: JANUS Hannah CD169 Measurement Audit
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/janus_hannah_cd169_measurement_audit.py'
      - 'data/cousteau/JANUS-HANNAH-BODC-MEASUREMENT-RECEIPT-001-REAL-CD169-TOBI-SENSORY-PASSPORTS-2026-08-25-v1.0.json'
      - '.github/workflows/janus-hannah-cd169-measurement-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python workspace/janus_hannah_cd169_measurement_audit.py \
            data/cousteau/JANUS-HANNAH-BODC-MEASUREMENT-RECEIPT-001-REAL-CD169-TOBI-SENSORY-PASSPORTS-2026-08-25-v1.0.json \
            --output out/JANUS-HANNAH-CD169-MEASUREMENT-AUDIT-RUN-001-2026-08-25-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-hannah-cd169-measurement-audit
          path: out/JANUS-HANNAH-CD169-MEASUREMENT-AUDIT-RUN-001-2026-08-25-v1.0.json
          retention-days: 7
