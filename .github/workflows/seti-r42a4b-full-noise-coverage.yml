      - name: Replay group 09 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(8)'
          test -s runtime/r42a4b/group-09.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
