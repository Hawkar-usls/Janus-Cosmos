      - name: Replay group 10 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(9)'
          test -s runtime/r42a4b/group-10.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a4b-progress-10
          path: runtime/r42a4b/group-10.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 11 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(10)'
          test -s runtime/r42a4b/group-11.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a4b-progress-11
          path: runtime/r42a4b/group-11.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify all frozen features and summarize 3168 rows
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.summary()'
          test -s runtime/r42a4b/result.json
          test "$(find runtime/r42a4b -name '*-noise-all.npz' -type f | wc -l)" -eq 22
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r42a4b-full-noise-coverage
          path: runtime/r42a4b/
          if-no-files-found: warn
          retention-days: 90
