name: JANUS R42A4B full frozen NOISE coverage
on:
  push:
    branches: [research/seti-r42a4b-full-noise-coverage-20261120]
    paths: ['.github/workflows/seti-r42a4b-full-noise-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r42a4b-noise-coverage
  cancel-in-progress: false
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify authenticated R42A4A and reuse pilot groups 01 and 07
        run: |
          python -m py_compile research/seti/r42a4a_noise_coverage.py research/seti/r42a4b_full_noise_coverage.py
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.prepare()'
          test -s runtime/r42a4b/pilot-receipt.json
          test -s runtime/r42a4b/group-01.json
          test -s runtime/r42a4b/group-07.json
      - name: Replay group 02 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(1)'
          test -s runtime/r42a4b/group-02.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a4b-progress-02
          path: runtime/r42a4b/group-02.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 03 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(2)'
          test -s runtime/r42a4b/group-03.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a4b-progress-03
          path: runtime/r42a4b/group-03.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 04 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(3)'
          test -s runtime/r42a4b/group-04.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a4b-progress-04
          path: runtime/r42a4b/group-04.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 05 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(4)'
          test -s runtime/r42a4b/group-05.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a4b-progress-05
          path: runtime/r42a4b/group-05.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 06 of 11 with frozen NOISE model
        run: |
          PYTHONPATH=research/seti python -c 'import r42a4b_full_noise_coverage as m; m.group(5)'
          test -s runtime/r42a4b/group-06.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a4b-progress-06
          path: runtime/r42a4b/group-06.json
