name: KUSTO CD169 EM12 Provenance Inventory

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cd169_em12_provenance_inventory.py'
      - '.github/workflows/kusto-cd169-em12-provenance-inventory.yml'
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory CD169 EM12 archive products
        run: mkdir -p workspace/kusto_cross_survey_out && python workspace/kusto_cd169_em12_provenance_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cd169-em12-provenance-inventory-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CD169-EM12-PRODUCT-PROVENANCE-INVENTORY-2026-09-22-v1.0.json
          retention-days: 30
