name: Janus Cosmos Canonical v1

on:
  push:
    paths:
      - 'janus_cosmos/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'data/hst_blind_corpus.json'
      - 'run_janus_cosmos_windows.bat'
      - '.github/workflows/canonical-v1.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options: [smoke-focus, powered-fixed7, discover-expanded]
        default: smoke-focus
      nulls:
        description: 'Primary test nulls/model'
        required: true
        type: choice
        options: ['64', '1024', '4096']
        default: '1024'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m py_compile janus_cosmos/*.py
      - run: python -m pytest -q

  fixed-focus-smoke:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke-focus')
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: End-to-end fixed-HLSP focus smoke
        run: |
          python -u -m janus_cosmos.pipeline \
            --manifest data/hst_blind_corpus.json \
            --targets NGC1425,NGC1637 \
            --nulls 64 --seeds 20260810 --allow-underpowered \
            --output-dir results/focus_smoke
      - name: Validate smoke boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results/focus_smoke/janus-cosmos-receipt.json'))
          assert d['status']=='SMOKE_ONLY', d['status']
          assert d['powered_for_corrected_gate'] is False
          assert d['candidate_count']==0
          assert not d['errors'], d['errors']
          print('CANONICAL FOCUS SMOKE PASS')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: janus-cosmos-canonical-focus-smoke
          if-no-files-found: warn
          path: results/focus_smoke/

  powered-fixed7:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'powered-fixed7'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Powered fixed-seven run
        run: |
          python -u -m janus_cosmos.pipeline \
            --manifest data/hst_blind_corpus.json \
            --nulls "${{ inputs.nulls }}" \
            --seeds 20260810,20260811,20260812 \
            --output-dir results/powered_fixed7
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: janus-cosmos-powered-fixed7
          if-no-files-found: warn
          path: results/powered_fixed7/

  discover-expanded:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover-expanded'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build live MAST manifest
        run: |
          mkdir -p results
          python - <<'PY'
          from janus_cosmos.discovery import DEFAULT_TARGETS, build_manifest, write_manifest
          m=build_manifest(DEFAULT_TARGETS)
          write_manifest('results/expanded_manifest.json',m)
          print('selected_targets =',m['selected_targets'],'selected_products =',m['selected_products'])
          if m['selected_targets']==0: raise SystemExit('No live MAST targets discovered')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: janus-cosmos-expanded-manifest-v1
          if-no-files-found: warn
          path: results/expanded_manifest.json
