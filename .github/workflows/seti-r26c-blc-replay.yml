name: JANUS SETI R26C BLC1 control-role replay
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r26c-blc-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  blc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: SHA verified known BLC1 recovery
        run: python research/seti/r26c_reference_alignment.py blc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r26c-blc
          path: runtime/r26c/blc_result.json
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r26c/blc_result.json"))
          assert len(d["rows"])==15
          assert d["anchor_raw_recovered"],"Known raw anchor not recovered"
          PY
