name: KUSTO INFOMAR I0L Unchanged V2 Replay

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_infomar_i0l_support_domain_v2.py'
      - 'data/cousteau/JANUS-KUSTO-INFOMAR-I0L-UNCHANGED-V2-IMPLEMENTATION-FREEZE-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-infomar-i0l-support-domain-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  i0l:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests rasterio numpy scipy pyproj
      - name: Run frozen INFOMAR paired-support-domain v2 replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workspace/kusto_infomar_i0l_support_domain_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-infomar-i0l-support-domain-v2-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INFOMAR-I0L-CB13_02-UNSEEN-BACKSCATTER-V2-RUN-2026-09-24-v1.0.json
          retention-days: 30
