name: JANUS TACHYON STAR T3A TESS Cadence Prepoint

on:
  push:
    branches: [research/luci-only-v1]
    paths:
      - 'experiments/luci/run_tachyon_star_t3a_tess.py'
      - 'tests/test_tachyon_star_t3a_tess.py'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T3A-TESS-PREREG.json'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T3A-TESS-SECTOR-MANIFEST.csv'
      - '.github/workflows/tachyon-star-t3a-tess.yml'
  pull_request:
    paths:
      - 'experiments/luci/run_tachyon_star_t3a_tess.py'
      - 'tests/test_tachyon_star_t3a_tess.py'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T3A-TESS-PREREG.json'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T3A-TESS-SECTOR-MANIFEST.csv'
      - '.github/workflows/tachyon-star-t3a-tess.yml'
  workflow_dispatch:

jobs:
  prepoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify frozen TESS sector manifest before any TESSCut retrieval
        shell: bash
        run: |
          set -euo pipefail
          echo '9c2fade3139a194fb14b1971817520f6531fff94aebe0243a10103bcf386a849  data/tachyon_star/JANUS-TACHYON-STAR-T3A-TESS-SECTOR-MANIFEST.csv' | sha256sum -c -
          test -s data/tachyon_star/JANUS-TACHYON-STAR-T3A-TESS-PREREG.json
      - name: Run T3A strict unit tests
        run: python -m unittest tests/test_tachyon_star_t3a_tess.py -v
      - name: Download fixed-sector cutouts and freeze TIME-QUALITY cadence triplets without FLUX inspection
        shell: bash
        run: |
          mkdir -p results/tachyon_star_t3a_tess
          set +e
          python -m experiments.luci.run_tachyon_star_t3a_tess \
            --output-dir results/tachyon_star_t3a_tess \
            --cache-dir .cache/tachyon_star_t3a_tess
          rc=$?
          set -e
          echo "$rc" > results/tachyon_star_t3a_tess/scientific_runner_exit_code.txt
          test -s results/tachyon_star_t3a_tess/receipt.json
          test -s results/tachyon_star_t3a_tess/tess_prepointed_cadence_manifest.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-tachyon-star-t3a-tess
          path: results/tachyon_star_t3a_tess/
          if-no-files-found: error
          compression-level: 6
