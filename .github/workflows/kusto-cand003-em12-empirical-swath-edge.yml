name: KUSTO CAND003 EM12 Empirical Swath Edge

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_em12_empirical_swath_edge.py'
      - '.github/workflows/kusto-cand003-em12-empirical-swath-edge.yml'
  workflow_dispatch:

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy shapely
      - name: Run frozen geometry-only swath-edge diagnostic
        run: python workspace/kusto_cand003_em12_empirical_swath_edge.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-em12-empirical-swath-edge-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-CD169-EM12-EMPIRICAL-SWATH-EDGE-DIAGNOSTIC-RUN-2026-09-22-v1.0.json
          retention-days: 30
