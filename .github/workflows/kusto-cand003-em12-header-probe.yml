name: KUSTO CAND003 EM12 Header Probe

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_em12_header_probe.py'
      - '.github/workflows/kusto-cand003-em12-header-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python workspace/kusto_cand003_em12_header_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-em12-header-probe-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-CONFLICTING-EM12-PRODUCT-HEADER-PROBE-2026-09-22-v1.0.json
          retention-days: 30
