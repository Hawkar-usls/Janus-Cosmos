name: Cousteau video intake oMPHmMnS0Mc
on:
  push:
    branches: [experiment/cousteau-southern-ocean-20261109]
    paths:
      - 'workspace/cousteau_video_evidence.py'
      - '.github/workflows/cousteau-video-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 yt-dlp youtube-transcript-api
      - name: Retrieve metadata and captions without downloading full video
        run: python workspace/cousteau_video_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cousteau-youtube-oMPHmMnS0Mc-evidence-${{ github.run_id }}
          path: data/cousteau/video_intake/*.json
          retention-days: 30
          if-no-files-found: warn
