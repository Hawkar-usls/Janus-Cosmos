name: KUSTO Unseen PF0501 x RB1202 FNV Overlap
on:
  push:
    branches: [feature/kusto-cross-survey-validation-v1]
    paths:
      - 'workspace/kusto_unseen_pf0501_rb1202_fnv_overlap.py'
      - '.github/workflows/kusto-unseen-pf0501-rb1202-fnv-overlap.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check requests shapely
      - run: python workspace/kusto_unseen_pf0501_rb1202_fnv_overlap.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-unseen-pf0501-rb1202-fnv-overlap-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-UNSEEN-PF0501-X-RB1202-FNV-OVERLAP-RUN-2026-09-23-v1.0.json
          retention-days: 30
