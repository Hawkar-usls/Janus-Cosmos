name: LOVE EDEM Stargate PalOMAR Light Return

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/love-edem-stargate-palomar-light-return.yml"
      - "workspace/love_edem_stargate_palomar_light_return.py"
      - "data/love/LOVE-EDEM-STARGATE-PALOMAR-LIGHT-RETURN-GATE-v1.json"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "numpy>=2.0" "pandas>=2.2" "requests>=2.31"
      - name: Run frozen crossmatch and light-return gate
        run: python workspace/love_edem_stargate_palomar_light_return.py
      - name: Show receipt
        if: always()
        run: cat data/love/LOVE-EDEM-STARGATE-PALOMAR-LIGHT-RETURN-v1-LATEST-RECEIPT.json || true
      - name: Persist receipt
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/LOVE-EDEM-STARGATE-PALOMAR-LIGHT-RETURN-v1-LATEST-RECEIPT.json
          git commit -m "cosmos: freeze LOVE EDEM Stargate Palomar light-return run ${{ github.run_number }}"
          git pull --rebase origin main
          git push
