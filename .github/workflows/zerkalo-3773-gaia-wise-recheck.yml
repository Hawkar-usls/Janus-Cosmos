name: JANUS COSMOS — точка 3773 Gaia WISE repair
on:
  push:
    branches: [research/zerkalo-janusa-collapse-r2-20261121]
    paths: ['.github/workflows/zerkalo-3773-gaia-wise-recheck.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-zerkalo-3773-gaia-wise-recheck
  cancel-in-progress: false
jobs:
  verify-multiband:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install compatible astronomy catalog client
        run: |
          python -m pip install --upgrade "pip<27"
          python -m pip install numpy==1.26.4 requests==2.32.3 astropy==6.1.7 astroquery==0.4.11
          python - <<'PY'
          import numpy as np
          import astroquery
          assert hasattr(np,"in1d")
          print("NumPy",np.__version__)
          PY
      - name: Authenticate completed SIMBAD result and retry independent Gaia and WISE checks
        run: |
          python -m py_compile research/numeric_sky/collapse_3773.py research/numeric_sky/cross_catalog_3773.py
          PYTHONPATH=research/numeric_sky python research/numeric_sky/cross_catalog_3773.py
          test -s runtime/numeric_sky/singularity/3773_multiband_recheck.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-zerkalo-3773-gaia-wise-catalog-recheck
          path: runtime/numeric_sky/singularity/
          if-no-files-found: warn
          retention-days: 90
