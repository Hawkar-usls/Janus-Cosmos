name: KUSTO CD169 EM12 Raw All66 Time Coverage Audit

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cd169_em12raw_all66_time_coverage.py'
      - '.github/workflows/kusto-cd169-em12raw-all66-time-coverage.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan timestamp coverage of all 66 preserved raw EM12 files
        run: python workspace/kusto_cd169_em12raw_all66_time_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cd169-em12raw-all66-time-coverage-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CD169-EM12RAW-ALL66-TIME-COVERAGE-AUDIT-RUN-2026-09-23-v1.0.json
          retention-days: 30
