name: JANUS COSMOS R42A7B2 — verified external GBT ON/OFF native spectra
on:
  push:
    branches: [research/seti-r42a7b-independent-onoff-20261121]
    paths: ['.github/workflows/seti-r42a7b2-raw-pair.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r42a7b2-frozen-raw-pair
  cancel-in-progress: false
jobs:
  raw-integrity-and-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile frozen ON/OFF provenance verifier
        run: |
          python -m py_compile research/seti/r42a7b2_verify_raw_pair.py
          python -m json.tool research/seti/r42a7b2_frozen_raw_pair.json >/dev/null
          python -m pip install numpy==2.2.6 h5py==3.12.1 hdf5plugin==5.1.0 requests==2.32.3
      - name: Download two fixed GBT HDF5 ON/OFF sources, compare exact MD5/size and read native headers
        run: |
          python research/seti/r42a7b2_verify_raw_pair.py
          test -s runtime/r42a7b2/gate_report.json
          test -s runtime/r42a7b2/raw_download_receipt.json
          test -s runtime/r42a7b2/native_header_audit.json
      - name: Retain only checksum receipts, header provenance and fixed spectral cutouts, never bulk original HDF5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r42a7b2-original-GBT-onoff-verification
          path: |
            runtime/r42a7b2/*.json
            runtime/r42a7b2/*.npy
          if-no-files-found: warn
          retention-days: 90
