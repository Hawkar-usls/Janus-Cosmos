name: JANUS R42A3A frozen score contract pilot
on:
  push:
    branches: [research/seti-r42a3-score-contract-20261120]
    paths: ['.github/workflows/seti-r42a3-score-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r42a3-score-contract
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Authenticate R41 R42A and replay one frozen fit group
        run: |
          python -m py_compile research/seti/r42a3_score_contract.py
          PYTHONPATH=research/seti python -c 'import r42a3_score_contract as m; m.run()'
          test -s runtime/r42a3/result.json
          test "$(find runtime/r42a3 -name '*-scores.npz' -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r42a3-score-contract-pilot
          path: runtime/r42a3/
          if-no-files-found: error
          retention-days: 90
