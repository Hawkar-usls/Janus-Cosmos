name: JANUS Numeric Sky — diagnose missing repo source coverage
on:
  push:
    branches: [research/numeric-sky-audit-r0-mirror-20261121]
    paths: ['.github/workflows/janus-numeric-sky-source-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce source read errors for two public JANUS repositories
        env:
          PYTHONUNBUFFERED: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python - <<'PY'
          import sys,json,gzip,pathlib
          sys.path.insert(0,"research/numeric_sky")
          from scan_numeric_sources import scan_repository
          base=pathlib.Path("runtime/numeric_sky/diagnostic")
          base.mkdir(parents=True,exist_ok=True)
          for r in ("Hawkar-usls/Janus-HELIOS","Hawkar-usls/TOPA"):
              with gzip.open(base/("numbers_"+r.split("/")[-1]+".jsonl.gz"),"wb") as out:
                  info,_=scan_repository(r,base,out)
              print("NUMSKY_DIAG",json.dumps({"repo":r,"status":info["status"],"errors":info["errors"][:4],"skipped":info["skipped"],"selected_files":info["selected_files"]}),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: numsky-source-diagnostic
          path: runtime/numeric_sky/diagnostic/
          if-no-files-found: warn
          retention-days: 30
