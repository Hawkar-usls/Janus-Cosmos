name: KUSTO INFOMAR I1I CB13_05 Blind Bathymetry

on:
  push:
    branches: [feature/kusto-global-groundtruth-calibration-v1]
    paths:
      - 'workspace/kusto_infomar_i1i_cb1305_blind_bathymetry.py'
      - 'data/cousteau/JANUS-KUSTO-INFOMAR-I1E-PER-SURVEY-NATIVE-CELL-BLIND-FREEZE-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-infomar-i1i-cb1305-blind-bathymetry.yml'
  workflow_dispatch:

jobs:
  i1i:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio pyproj shapely
      - run: python workspace/kusto_infomar_i1i_cb1305_blind_bathymetry.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-infomar-i1i-cb1305-blind-bathymetry-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INFOMAR-I1I-CB13_05-BLIND-BATHYMETRY-RUN-2026-09-25-v1.0.json
          retention-days: 30
