name: JANUS R37F2D3 natural methanol science
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f2d3-methanol.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r37f2d3-methanol
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.3 beautifulsoup4==4.13.4 numpy==2.2.6 astropy==7.1.0 h5py==3.13.0 hdf5plugin==5.0.0
      - name: Verify complete archives and reduce natural methanol spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r37f2d3_methanol.py
          python research/seti/r37f2d3_methanol.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f2d3-methanol
          path: |
            runtime/r37f2d3/*.json
            runtime/r37f2d3/*.npz
          if-no-files-found: warn
