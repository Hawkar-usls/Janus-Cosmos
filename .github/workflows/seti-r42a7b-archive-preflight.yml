name: JANUS COSMOS R42A7B1 — public raw ON/OFF archive qualification
on:
  push:
    branches: [research/seti-r42a7b-independent-onoff-20261121]
    paths:
      - '.github/workflows/seti-r42a7b-archive-preflight.yml'
      - 'research/seti/r42a7b_archive_discovery.py'
      - 'research/seti/r42a7b_independent_onoff_protocol.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r42a7b-independent-onoff-preflight
  cancel-in-progress: false
jobs:
  external-archive-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate frozen scientific gates
        run: |
          python -m py_compile research/seti/r42a7b_archive_discovery.py
          python -m json.tool research/seti/r42a7b_independent_onoff_protocol.json >/dev/null
          python -m pip install requests==2.32.3 beautifulsoup4==4.13.4
      - name: Discover independent telescope source metadata and provisional ON/OFF pairs
        run: |
          python research/seti/r42a7b_archive_discovery.py
          test -s runtime/r42a7b/archive_inventory.json
          test -s runtime/r42a7b/provisional_onoff_pairs.json
          test -s runtime/r42a7b/gate_report.json
      - name: Retain source page hashes, pair selections and all gate failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r42a7b-independent-onoff-archive-preflight
          path: runtime/r42a7b/
          retention-days: 90
          if-no-files-found: warn
