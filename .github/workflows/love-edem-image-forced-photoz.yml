name: LOVE EDEM Image Forced Photometry PhotoZ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/love-edem-image-forced-photoz.yml"
      - "workspace/love_edem_image_forced_photoz.py"
      - "data/love/IMAGE_LEVEL_FORCED_PHOTOMETRY_AND_EDEM_GALAXY_PHOTOZ-GATE-v1.json"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install astronomy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "astropy>=7.0" "astroquery>=0.4.11"

      - name: Run frozen image-level forced photometry and photo-z gate
        run: |
          python workspace/love_edem_image_forced_photoz.py

      - name: Show receipt
        if: always()
        run: |
          cat data/love/IMAGE_LEVEL_FORCED_PHOTOMETRY_AND_EDEM_GALAXY_PHOTOZ-v1-LATEST-RECEIPT.json || true

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: love-edem-image-forced-photoz-${{ github.run_number }}
          path: data/love/IMAGE_LEVEL_FORCED_PHOTOMETRY_AND_EDEM_GALAXY_PHOTOZ-v1-LATEST-RECEIPT.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist receipt to Janus-Cosmos
        if: success()
        run: |
          set -euo pipefail
          RECEIPT="data/love/IMAGE_LEVEL_FORCED_PHOTOMETRY_AND_EDEM_GALAXY_PHOTOZ-v1-LATEST-RECEIPT.json"
          cp "$RECEIPT" /tmp/janus-image-photoz-receipt.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/janus-image-photoz-receipt.json "$RECEIPT"
            git add "$RECEIPT"
            git commit -m "cosmos: freeze image-level forced photometry photo-z run ${{ github.run_number }}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push race on attempt $attempt; retrying against latest main"
          done
          exit 1
