name: KUSTO Shark Rock Measured Support

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_sharkrock_measured_support.py'
      - 'data/cousteau/JANUS-KUSTO-SHARK-ROCK-MEASURED-SUPPORT-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-sharkrock-measured-support.yml'
  workflow_dispatch:

jobs:
  measured-support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Run frozen FNV measured-support gate
        run: python workspace/kusto_sharkrock_measured_support.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-sharkrock-measured-support-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SHARK-ROCK-MEASURED-SUPPORT-RUN-2026-09-23-v1.0.json
          retention-days: 30
