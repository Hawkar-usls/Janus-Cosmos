name: KUSTO Cross Sound CS2 Unseen Backscatter

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_cross_sound_cs2_backscatter.py'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-ALASKA-UNSEEN-DUALCHANNEL-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-CS0-SOURCE-BINDING-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-CS1-BLIND-BATHYMETRY-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-CS2-BACKSCATTER-IMPLEMENTATION-ADDENDUM-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-cross-sound-cs2-backscatter.yml'
  workflow_dispatch:

jobs:
  cs2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run Cross Sound preregistered unseen backscatter replay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_cross_sound_cs2_backscatter.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cross-sound-cs2-unseen-backscatter-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-CROSS-SOUND-CS2-UNSEEN-BACKSCATTER-REPLAY-RUN-2026-09-23-v1.0.json
          retention-days: 30
