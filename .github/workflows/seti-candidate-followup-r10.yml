name: JANUS SETI R10 frozen candidate control and barycentric follow-up
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-candidate-followup-r10.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned spectral and astronomy libraries
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 astropy==7.0.2
      - name: Verify prior archive artifact and extract safe files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,os,pathlib,re,zipfile,requests
          u="https://api.github.com/repos/Hawkar-usls/Janus-Cosmos/actions/artifacts/14317465678/zip"
          buf=bytearray()
          with requests.get(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"},stream=True,timeout=(15,60)) as r:
              r.raise_for_status()
              for chunk in r.iter_content(1048576):
                  buf.extend(chunk)
                  assert len(buf)<=128*1024*1024
          assert hashlib.sha256(buf).hexdigest()=="2d22f8b1c0ea7ca892ae38ca90eac3ed12ffd608273ecb4dc3b179f576592ba9"
          root=pathlib.Path("prior-r9");root.mkdir()
          with zipfile.ZipFile(io.BytesIO(buf)) as z:
              assert sum(i.file_size for i in z.infolist())<=200*1024*1024
              for i in z.infolist():
                  name=pathlib.PurePosixPath(i.filename).name
                  if name=="r9-result.json" or re.fullmatch(r"[0-9a-f]{24}\.npy",name):
                      assert not (root/name).exists()
                      (root/name).write_bytes(z.read(i))
          print("R9_ARTIFACT_SHA256_PASS")
          PY
      - name: Check frozen R9 candidate across controls and independent dates
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m py_compile research/seti/r10_candidate_followup.py
          python research/seti/r10_candidate_followup.py
      - name: Preserve follow-up spectra and scientific HOLD
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r10-falsification
          path: runtime/r10/
          retention-days: 90
