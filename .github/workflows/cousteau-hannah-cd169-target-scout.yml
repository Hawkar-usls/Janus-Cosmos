name: Cousteau Hannah CD169 Target Scout
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_bodc_9406_target_scout.py'
      - '.github/workflows/cousteau-hannah-cd169-target-scout.yml'
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python workspace/hannah_bodc_9406_target_scout.py --output out/CD169-TARGET-SCOUT.json
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-cd169-target-scout
          path: out/CD169-TARGET-SCOUT.json
          retention-days: 7
