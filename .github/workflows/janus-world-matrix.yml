name: janus-world-matrix

on:
  push:
    paths:
      - 'workspace/janus_world_matrix.py'
      - 'workspace/JANUS_COSMOS_WORLD_MATRIX_CONTRACT_v1.json'
      - '.github/workflows/janus-world-matrix.yml'
  pull_request:
    paths:
      - 'workspace/janus_world_matrix.py'
      - 'workspace/JANUS_COSMOS_WORLD_MATRIX_CONTRACT_v1.json'
      - '.github/workflows/janus-world-matrix.yml'

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run neutral world-matrix self-test
        run: python workspace/janus_world_matrix.py --self-test
      - name: Smoke test sky preset
        run: python workspace/janus_world_matrix.py --preset sky --samples 32 --seed 424242 --output /tmp/janus-sky-worlds.json
      - name: Smoke test planet preset
        run: python workspace/janus_world_matrix.py --preset planet --samples 32 --seed 424242 --output /tmp/janus-planet-worlds.json
