name: Cousteau MGDS File Provenance Detail Probe

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-mgds-file-provenance-detail-probe.yml"
      - "workspace/cousteau_mgds_file_provenance_detail_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python workspace/cousteau_mgds_file_provenance_detail_probe.py
      - name: Show result
        if: always()
        run: cat data/cousteau/JANUS-ECHO-COUSTEAU-MGDS-FILE-2504732-PROVENANCE-DETAIL-PROBE-2026-08-21-v1.0.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cousteau-mgds-file-provenance-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-MGDS-FILE-2504732-PROVENANCE-DETAIL-PROBE-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-MGDS-FILE-2504732-PROVENANCE-DETAIL-PROBE-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze MGDS file provenance detail ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
