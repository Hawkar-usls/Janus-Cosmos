name: JANUS COSMOS · OSIRIS BL official sky-query interface
on:
  push:
    branches: [research/seti-osiris-spear-radio-audit-20261121]
    paths:
      - '.github/workflows/seti-osiris-bl-form-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile research/seti/osiris_bl_form_probe.py
          python -m pip install requests==2.32.3 beautifulsoup4==4.13.4
      - name: Recover exact official BL sky-coordinate form fields without any radio bytes
        run: python research/seti/osiris_bl_form_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-osiris-bl-public-query-form
          path: runtime/osiris_bl_form_probe/
          if-no-files-found: warn
          retention-days: 90
