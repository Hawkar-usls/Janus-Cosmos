name: KUSTO Shellharbour S0B WCS Resolver

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_shellharbour_s0b_wcs_resolver.py'
      - 'data/cousteau/JANUS-KUSTO-SHELLHARBOUR-S0B-WCS-COVERAGE-RESOLUTION-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-shellharbour-s0b-wcs-resolver.yml'
  workflow_dispatch:

jobs:
  s0b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve Shellharbour WCS coverage IDs without raster values
        run: python workspace/kusto_shellharbour_s0b_wcs_resolver.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-shellharbour-s0b-wcs-resolver-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SHELLHARBOUR-S0B-WCS-COVERAGE-RESOLUTION-RUN-2026-09-23-v1.1.json
          retention-days: 30
