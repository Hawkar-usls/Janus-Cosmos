name: KUSTO First Unseen Residual Transfer Validation
on:
  push:
    branches: [feature/kusto-cross-survey-validation-v1]
    paths:
      - 'workspace/kusto_first_unseen_residual_transfer_validation.py'
      - '.github/workflows/kusto-first-unseen-residual-transfer-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check numpy scipy requests shapely pyproj
      - name: Execute frozen first unseen transfer validation
        run: python workspace/kusto_first_unseen_residual_transfer_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-first-unseen-residual-transfer-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-FIRST-UNSEEN-ACROSS-TRACK-RESIDUAL-TRANSFER-RUN-2026-09-23-v1.0.json
          retention-days: 30
