name: JANUS SIT2E-D - Parkes Polarization and 806 MHz Forensics
on:
  push:
    branches:
      - research/janus-sit2ed-polarization-806-forensics-20261123
    paths:
      - 'research/seti/janus_sit2ed_polarization_806_witness.py'
      - '.github/workflows/janus-sit2ed-806-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-power-polarization-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout research code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verified radio decoder dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.1.0 requests==2.32.3 beautifulsoup4==4.12.3 scikit-learn==1.6.1
      - name: Enforce July/September only, no October, immutable SIT2E-B threshold contract
        run: |
          python -m py_compile research/seti/janus_sit2ed_polarization_806_witness.py
          python - <<'PY'
          import ast,json,pathlib
          p=pathlib.Path('research/seti/janus_sit2ed_polarization_806_witness.py')
          tree=ast.parse(p.read_text())
          d={}
          for node in tree.body:
              if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id=='DATES':
                  d['dates']=ast.literal_eval(node.value)
          assert d['dates']==('2025-07-31','2025-09-12')
          q=json.loads(pathlib.Path('research/seti/janus_sit2eb_july_september_calibration_receipt.json').read_text())
          assert q['inference_limits']['allow_october_one_shot_exam'] is False
          assert q['numeric_thresholds']=={'JANUS_NATIVE_RIDGE':2.834103476282684,'DIRECT_672_MATCHED':2.834103476282684,'DIRECT_672_SIDEBAND':3.3193816056219645}
          print('SIT2ED_LOCKED_DATES_AND_THRESHOLDS_PASS')
          PY
      - name: Verify original July/September bytes and test fixed polarization hypotheses and 806 MHz Source Reference coincidence
        run: python research/seti/janus_sit2ed_polarization_806_witness.py --audit
      - name: Retain evidence JSON only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-sit2ed-polarization-806-witness
          path: runtime/sit2ed/sit2ed_forensics.json
          if-no-files-found: warn
          retention-days: 90
