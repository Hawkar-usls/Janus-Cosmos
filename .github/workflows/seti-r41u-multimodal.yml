name: JANUS R41U multimodal technosignature pilots
on:
  push:
    branches: [research/seti-r41u-multimodal-20261120]
    paths: ['.github/workflows/seti-r41u-multimodal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r41u-multimodal
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.3 astropy==7.0.2 astroquery==0.4.10
      - name: Compile and test spatial alternative models; retrieve Gaia
        run: |
          python -m py_compile research/seti/r41u_multimodal.py
          python research/seti/r41u_multimodal.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-preparation
          path: runtime/r41u/
          retention-days: 90
          if-no-files-found: error
      - name: JPL catalog and natural controls
        run: python research/seti/r41u_multimodal.py orbit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-orbit
          path: |
            runtime/r41u/orbit_catalog.json
            runtime/r41u/jpl-*.json
          retention-days: 90
          if-no-files-found: error
      - name: WISE fixed vs rival source A
        run: python research/seti/r41u_multimodal.py ir A
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-ir-A
          path: |
            runtime/r41u/ir-A.json
            runtime/r41u/A-*.fits
          retention-days: 90
          if-no-files-found: error
      - name: WISE fixed vs rival source B
        run: python research/seti/r41u_multimodal.py ir B
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-ir-B
          path: |
            runtime/r41u/ir-B.json
            runtime/r41u/B-*.fits
          retention-days: 90
          if-no-files-found: error
      - name: WISE fixed vs rival source C
        run: python research/seti/r41u_multimodal.py ir C
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-ir-C
          path: |
            runtime/r41u/ir-C.json
            runtime/r41u/C-*.fits
          retention-days: 90
          if-no-files-found: error
      - name: WISE fixed vs rival source D
        run: python research/seti/r41u_multimodal.py ir D
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-ir-D
          path: |
            runtime/r41u/ir-D.json
            runtime/r41u/D-*.fits
          retention-days: 90
          if-no-files-found: error
      - name: WISE fixed vs rival source E
        run: python research/seti/r41u_multimodal.py ir E
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-ir-E
          path: |
            runtime/r41u/ir-E.json
            runtime/r41u/E-*.fits
          retention-days: 90
          if-no-files-found: error
      - name: WISE fixed vs rival source F
        run: python research/seti/r41u_multimodal.py ir F
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-ir-F
          path: |
            runtime/r41u/ir-F.json
            runtime/r41u/F-*.fits
          retention-days: 90
          if-no-files-found: error
      - name: WISE fixed vs rival source G
        run: python research/seti/r41u_multimodal.py ir G
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u-ir-G
          path: |
            runtime/r41u/ir-G.json
            runtime/r41u/G-*.fits
          retention-days: 90
          if-no-files-found: error
      - name: Report separate evidence and qualification gates
        run: python research/seti/r41u_multimodal.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41u-multimodal
          path: runtime/r41u/
          retention-days: 90
          if-no-files-found: warn
