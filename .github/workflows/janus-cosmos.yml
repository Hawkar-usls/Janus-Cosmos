name: Janus Cosmos FractalGPT

on:
  push:
    paths:
      - 'experiments/**'
      - 'data/**'
      - 'schemas/**'
      - '.github/workflows/janus-cosmos.yml'
  workflow_dispatch:

jobs:
  real-hst-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy astropy
      - name: Run real HST image-level FractalGPT pilot
        run: python experiments/hst/run_real_pilot.py | tee janus-cosmos-real-hst-receipt.json
      - name: Validate claim boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('janus-cosmos-real-hst-receipt.json'))
          assert r['status'] == 'REAL_HST_IMAGE_PILOT'
          assert r['astronomical_discovery'] is False
          assert r['blind_gate']['semantic_analysis'] is False
          assert r['blind_gate']['face_search'] is False
          assert r['blind_gate']['ocr'] is False
          assert r['blind_gate']['cipher_search'] is False
          assert r['blind_gate']['nulls'] == 256
          assert len(r['source_products']) == 3
          print('JANUS COSMOS REAL HST PILOT PASS')
          print('cross_band_candidate =', r['cross_band_candidate'])
          print('passing_filters =', r['passing_filters'])
          PY
      - name: Upload real HST receipt
        uses: actions/upload-artifact@v4
        with:
          name: janus-cosmos-real-hst-receipt
          path: janus-cosmos-real-hst-receipt.json
