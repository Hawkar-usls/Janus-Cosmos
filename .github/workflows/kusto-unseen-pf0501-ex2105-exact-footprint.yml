name: KUSTO Unseen PF0501 x EX2105 Exact Footprint

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_unseen_pf0501_ex2105_exact_footprint.py'
      - '.github/workflows/kusto-unseen-pf0501-ex2105-exact-footprint.yml'
  workflow_dispatch:

jobs:
  footprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests shapely
      - name: Query exact NCEI footprint overlap without depth
        run: python workspace/kusto_unseen_pf0501_ex2105_exact_footprint.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-unseen-pf0501-ex2105-exact-footprint-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-UNSEEN-PF0501-X-EX2105-EXACT-FOOTPRINT-OVERLAP-2026-09-23-v1.0.json
          retention-days: 30
