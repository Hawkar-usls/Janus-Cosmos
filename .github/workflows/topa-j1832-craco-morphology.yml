name: TOPA J1832 CRACO Morphology

on:
  workflow_dispatch:
  push:
    branches: [janus-tesla-sweep]
    paths:
      - ".github/workflows/topa-j1832-craco-morphology.yml"
      - "workspace/tesla_sweep/topa_j1832_craco_morphology_v1.py"
      - "data/tesla-sweep/results/TOPA-HUNT-005C3-J1832-CRACO-NUMERIC-MORPHOLOGY-PREREG-2026-08-23-v1.0.json"

permissions:
  contents: write

jobs:
  morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-tesla-sweep
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numeric dependencies
        run: python -m pip install --upgrade numpy scipy requests

      - name: Run frozen safe morphology and DM replay
        id: morphology
        continue-on-error: true
        run: python workspace/tesla_sweep/topa_j1832_craco_morphology_v1.py

      - name: Show receipt
        if: always()
        run: |
          test -f data/tesla-sweep/results/TOPA-HUNT-005C3-J1832-CRACO-NUMERIC-MORPHOLOGY-RUN-001.json
          cat data/tesla-sweep/results/TOPA-HUNT-005C3-J1832-CRACO-NUMERIC-MORPHOLOGY-RUN-001.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topa-j1832-craco-morphology-${{ github.run_number }}
          path: data/tesla-sweep/results/TOPA-HUNT-005C3-J1832-CRACO-NUMERIC-MORPHOLOGY-RUN-001.json
          if-no-files-found: error
          retention-days: 90

      - name: Freeze result including fail-closed state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tesla-sweep/results/TOPA-HUNT-005C3-J1832-CRACO-NUMERIC-MORPHOLOGY-RUN-001.json
          git commit -m "TOPA: freeze J1832 CRACO morphology ${{ github.run_number }}" || true
          for i in 1 2 3; do
            git pull --rebase origin janus-tesla-sweep || true
            git push origin HEAD:janus-tesla-sweep && exit 0
            sleep 3
          done
          exit 1
