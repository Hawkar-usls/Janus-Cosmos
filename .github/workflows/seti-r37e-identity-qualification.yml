name: JANUS R37E laboratory source identity qualification
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37e-identity-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r37e-identity-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 requests==2.32.3
      - name: Check power observability and qualify public lab acquisition units
        run: |
          python -m py_compile research/seti/r37e_identity_qualification.py
          python research/seti/r37e_identity_qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37e-lab-source-qualification
          path: runtime/r37e/*.json
          if-no-files-found: warn
