name: LOVE EDEM Physical Source Identification

on:
  push:
    branches:
      - research/love-g1-007-multieye-v2
    paths:
      - 'data/love/LOVE_EDEM_PHYSICAL_SOURCE_IDENTIFICATION_PREREG.json'
      - 'janus_cosmos/love_edem_physical_source_identification.py'
      - '.github/workflows/love-edem-physical-source-identification.yml'
      - 'janus_cosmos/love_edem_center_object_probe.py'
      - 'janus_cosmos/love_edem_gaia_mirror_cluster.py'
  pull_request:
    branches:
      - research/luci-only-v1
    paths:
      - 'data/love/LOVE_EDEM_PHYSICAL_SOURCE_IDENTIFICATION_PREREG.json'
      - 'janus_cosmos/love_edem_physical_source_identification.py'
      - '.github/workflows/love-edem-physical-source-identification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-source-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install astronomy stack
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile physical identification pass
        run: python -m py_compile janus_cosmos/love_edem_physical_source_identification.py
      - name: Identify physical nature of frozen source groups
        run: >-
          python -u -m janus_cosmos.love_edem_physical_source_identification
          --prereg data/love/LOVE_EDEM_PHYSICAL_SOURCE_IDENTIFICATION_PREREG.json
          --output-dir results/love_edem_physical_source_identification
      - name: Enforce coordinate-first and no-anomaly firewall
        run: |
          python - <<'PY'
          import json
          p='results/love_edem_physical_source_identification/physical-source-identification-result.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['mode'] == 'WHAT_IS_AT_THESE_COORDINATES'
          assert d['anomaly_scoring_used'] is False
          assert d['anomaly_gate_required'] is False
          assert d['firewall']['edem_identity_confirmed'] is False
          assert d['firewall']['absence_of_counterpart_is_not_anomaly'] is True
          assert d['firewall']['no_exotic_object_label_without_independent_evidence'] is True
          print(json.dumps(d, indent=2, default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: love-edem-physical-source-identification
          path: results/love_edem_physical_source_identification/
          if-no-files-found: error
          retention-days: 14
