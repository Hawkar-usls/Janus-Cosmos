name: KUSTO USGS Natural Controls Source Gate

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_usgs_natural_controls_source_gate.py'
      - '.github/workflows/kusto-usgs-natural-controls-source-gate.yml'
  workflow_dispatch:

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Inventory USGS natural-control source files
        run: python workspace/kusto_usgs_natural_controls_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-usgs-natural-controls-source-gate-v1-2
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-USGS-NATURAL-CONTROLS-SOURCE-GATE-RUN-2026-09-23-v1.2.json
          retention-days: 30
