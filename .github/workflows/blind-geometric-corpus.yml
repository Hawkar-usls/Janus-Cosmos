name: Janus Cosmos Blind Geometric Corpus

on:
  push:
    paths:
      - 'data/hst_blind_corpus.json'
      - 'experiments/hst/run_blind_corpus.py'
      - 'experiments/hst/blind_gate_config.json'
      - 'experiments/hst/geometric_anomaly_targets.json'
      - '.github/workflows/blind-geometric-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  blind-geometric-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy astropy

      - name: Run blind geometric corpus
        run: python experiments/hst/run_blind_corpus.py > janus-cosmos-blind-run.log

      - name: Validate machine receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = Path('janus-cosmos-blind-corpus-receipt.json')
          data = json.loads(receipt.read_text(encoding='utf-8'))
          gate = data['blind_gate']
          assert gate['semantic_analysis'] is False
          assert gate['ocr'] is False
          assert gate['face_search'] is False
          assert gate['cipher_search'] is False
          assert gate['post_hoc_tuning'] is False
          assert gate['cross_filter_required'] is True
          assert len(data['targets']) == 7
          for target in data['targets']:
              assert 'filters' in target
              assert 'passing_filters' in target
              assert 'cross_band_candidate' in target
          anomaly_manifest = json.loads(Path('experiments/hst/geometric_anomaly_targets.json').read_text(encoding='utf-8'))
          assert anomaly_manifest['semantic_analysis'] is False
          assert anomaly_manifest['human_label_inference'] is False
          print('JANUS COSMOS BLIND GEOMETRIC CORPUS PASS')
          print('candidate_count =', data['candidate_count'])
          PY

      - name: Create CI machine receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          receipt = json.loads(Path('janus-cosmos-blind-corpus-receipt.json').read_text(encoding='utf-8'))
          out = {
              'schema': 'janus.cosmos.ci_receipt.v0.2',
              'status': 'PASS',
              'project': 'Janus Cosmos',
              'experiment': 'blind_geometric_hst_corpus',
              'repository': 'Hawkar-usls/Janus-Cosmos',
              'workflow': os.environ['WORKFLOW'],
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'commit_sha': os.environ['SHA'],
              'ref': os.environ['REF_NAME'],
              'run_url': f"{os.environ['SERVER_URL']}/Hawkar-usls/Janus-Cosmos/actions/runs/{os.environ['RUN_ID']}",
              'result': {
                  'candidate_count': receipt['candidate_count'],
                  'target_count': len(receipt['targets']),
                  'passing_target_count': sum(1 for t in receipt['targets'] if t['cross_band_candidate']),
              },
              'blind_gate': receipt['blind_gate'],
              'claim_ceiling': receipt['claim_ceiling'],
              'artifacts': {
                  'receipt_sha256': sha256('janus-cosmos-blind-corpus-receipt.json'),
                  'events_sha256': sha256('janus-cosmos-blind-events.jsonl'),
                  'run_log_sha256': sha256('janus-cosmos-blind-run.log'),
              },
          }
          Path('janus-cosmos-blind-ci-receipt.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Upload machine-readable receipt
        id: upload-receipt
        uses: actions/upload-artifact@v6
        with:
          name: janus-cosmos-blind-geometric-receipt
          path: |
            janus-cosmos-blind-corpus-receipt.json
            janus-cosmos-blind-ci-receipt.json
            janus-cosmos-blind-events.jsonl
            janus-cosmos-blind-run.log
            data/hst_blind_corpus.json
            experiments/hst/blind_gate_config.json
            experiments/hst/geometric_anomaly_targets.json

      - name: Sync immutable receipt to Janus meta-registry
        env:
          JANUS_META_REGISTRY_TOKEN: ${{ secrets.JANUS_META_REGISTRY_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${JANUS_META_REGISTRY_TOKEN:-}" ]; then
            echo 'JANUS_META_REGISTRY_TOKEN is not configured; receipt remains available as a CI artifact.'
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${JANUS_META_REGISTRY_TOKEN}@github.com/Hawkar-usls/janus-meta-registry.git" meta-registry
          mkdir -p meta-registry/data/cosmos
          cp janus-cosmos-blind-ci-receipt.json "meta-registry/data/cosmos/JANUS-COSMOS-BLIND-GEOMETRIC-CORPUS-RUN-${RUN_ID}.json"
          cd meta-registry
          git config user.name 'janus-cosmos[bot]'
          git config user.email 'janus-cosmos[bot]@users.noreply.github.com'
          git add "data/cosmos/JANUS-COSMOS-BLIND-GEOMETRIC-CORPUS-RUN-${RUN_ID}.json"
          git diff --cached --quiet && exit 0
          git commit -m "Register Janus Cosmos blind corpus run ${RUN_ID}"
          git push origin main
