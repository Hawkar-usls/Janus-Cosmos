name: Cousteau HA10 Confirmatory Audit Replay

on:
  workflow_dispatch:
  pull_request:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ha10-confirmatory-audit.yml"
      - "workspace/cousteau_ha10_confirmatory_audit.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-CONFIRMATORY-AUDIT-2026-08-22-v1.0.json"
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ha10-confirmatory-audit.yml"
      - "workspace/cousteau_ha10_confirmatory_audit.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-CONFIRMATORY-AUDIT-2026-08-22-v1.0.json"

permissions:
  contents: read

jobs:
  audit-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify frozen source and audit receipts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json)" = "eb8b48fb7f043160c057f9df6264a781412ed854"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-CONFIRMATORY-AUDIT-2026-08-22-v1.0.json)" = "196e8002be4f15f025dfc415c50ab4292bac091a"
          echo "HA10_FROZEN_SOURCE_AND_AUDIT_BINDING=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recompute audit into non-authoritative artifact
        shell: bash
        run: |
          set -euo pipefail
          canonical="data/cousteau/JANUS-ECHO-COUSTEAU-HA10-CONFIRMATORY-AUDIT-2026-08-22-v1.0.json"
          mkdir -p artifacts/ha10-confirmatory-audit-replay
          cp "$canonical" artifacts/ha10-confirmatory-audit-replay/canonical-audit-before.json
          python workspace/cousteau_ha10_confirmatory_audit.py
          cp "$canonical" "artifacts/ha10-confirmatory-audit-replay/replay-${GITHUB_RUN_ID}.json"
          git checkout -- "$canonical"
          test "$(git hash-object "$canonical")" = "196e8002be4f15f025dfc415c50ab4292bac091a"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json)" = "eb8b48fb7f043160c057f9df6264a781412ed854"

      - name: Validate replay remains audit-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('artifacts/ha10-confirmatory-audit-replay').glob('replay-*.json'))
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['analysis_scope']=='POSTRUN_AGGREGATION_ONLY__NO_REPROCESSING__NO_NEW_BANDS__NO_THRESHOLD_CHANGES'
          assert r['scientific_interpretation']=='NEGATIVE_CONFIRMATORY_RESULT_REMAINS__AUDIT_ONLY_IDENTIFIES_WHICH_PREDECLARED_GATES_FAILED'
          assert r['target_identity']=='UNCONFIRMED'
          assert r['target_evidence']=='NOT_INCREASED'
          assert 'NEGATIVE_RESULT_IMMUTABLE' in r['hard_rules']
          print('HA10_AUDIT_REPLAY_AUTHORITY_DELTA=0')
          print('SOURCE_WRITEBACK=FALSE')
          PY
          test -z "$(git status --porcelain -- data/cousteau)"

      - name: Upload audit replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-ha10-confirmatory-audit-replay-${{ github.run_id }}
          path: artifacts/ha10-confirmatory-audit-replay/
          if-no-files-found: error
          retention-days: 30
