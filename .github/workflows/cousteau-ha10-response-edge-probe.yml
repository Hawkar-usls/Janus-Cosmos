name: Cousteau HA10 Response Edge Probe

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ha10-response-edge-probe.yml"
      - "workspace/cousteau_ha10_response_edge_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests obspy
      - name: Evaluate StationXML response only
        run: python workspace/cousteau_ha10_response_edge_probe.py
      - name: Show result
        if: always()
        run: cat data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-EDGE-CALIBRATION-PROBE-2026-08-21-v1.0.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cousteau-ha10-response-edge-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-EDGE-CALIBRATION-PROBE-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-EDGE-CALIBRATION-PROBE-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze HA10 response-edge probe ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
