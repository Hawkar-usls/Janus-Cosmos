name: KUSTO CAND003 EM12 Line Attribution

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_em12_line_attribution.py'
      - '.github/workflows/kusto-cand003-em12-line-attribution.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests
      - name: Run frozen geometry-only line attribution diagnostic
        run: python workspace/kusto_cand003_em12_line_attribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-em12-line-attribution-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-CD169-EM12-LINE-ATTRIBUTION-RUN-2026-09-22-v1.0.json
          retention-days: 30
