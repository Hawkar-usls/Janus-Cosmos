name: KUSTO Solitary Islands SI0C Current Route

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_solitary_islands_si0c_current_route.py'
      - 'data/cousteau/JANUS-KUSTO-SOLITARY-ISLANDS-SI0-UNCHANGED-V2-PREREG-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-SOLITARY-ISLANDS-SI0-SOURCE-BINDING-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-solitary-islands-si0c-current-route.yml'
  workflow_dispatch:

jobs:
  si0c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve current Solitary Islands data routes without reading bodies
        run: python workspace/kusto_solitary_islands_si0c_current_route.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-solitary-islands-si0c-current-route-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOLITARY-ISLANDS-SI0C-CURRENT-ROUTE-RUN-2026-09-24-v1.0.json
          retention-days: 30
