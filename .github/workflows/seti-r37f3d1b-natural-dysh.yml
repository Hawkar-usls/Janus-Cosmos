name: JANUS R37F3D1B natural dysh calibration
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f3d1b-natural-dysh.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r37f3d1b-natural-dysh
  cancel-in-progress: false
jobs:
  natural:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check dysh==1.0.1 requests==2.32.3 numpy==2.2.6 pandas==2.2.3 astropy==7.1.0 specutils==2.1.0 scipy==1.15.3
      - name: Calibrate historical natural galaxy position switch
        run: |
          python -m py_compile research/seti/r37f3d1b_natural_dysh.py
          python research/seti/r37f3d1b_natural_dysh.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f3d1b-natural-dysh
          path: |
            runtime/r37f3d1b/result.json
            runtime/r37f3d1b/pip-freeze.txt
          if-no-files-found: warn
