name: Cousteau HA10 Response Corrected Confirmatory Run

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ha10-response-corrected-confirmatory-run.yml"
      - "workspace/cousteau_ha10_response_corrected_confirmatory_run.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-CONFIRMATORY-WINDOW-FREEZE-2026-08-22-v1.0.json"

permissions:
  contents: write

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific stack
        run: python -m pip install numpy scipy requests obspy
      - name: Run frozen confirmatory spectral gate
        id: run
        continue-on-error: true
        run: python workspace/cousteau_ha10_response_corrected_confirmatory_run.py
      - name: Show result
        if: always()
        run: cat data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json
      - name: Freeze result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json
          git commit -m "Cousteau: freeze HA10 response-corrected confirmatory run ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
      - name: Enforce execution
        if: steps.run.outcome != 'success'
        run: exit 1
