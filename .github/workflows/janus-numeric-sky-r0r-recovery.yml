name: JANUS Numeric Sky R0R — repair failed source repositories
on:
  push:
    branches: [research/numeric-sky-audit-r0-recovery-20261121]
    paths: ['.github/workflows/janus-numeric-sky-r0r-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-numsky-r0r
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile source recovery
        run: |
          python -m py_compile research/numeric_sky/recover_failed_repos.py research/numeric_sky/scan_numeric_sources.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 44833839206
          github-token: ${{ github.token }}
          pattern: numsky-shard-*
          path: runtime/numeric_sky/collected
          merge-multiple: false
      - name: Repair missing original sources without changing their exact revision
        run: |
          PYTHONPATH=research/numeric_sky python research/numeric_sky/recover_failed_repos.py --shard ${{ matrix.shard }}
          test -s runtime/numeric_sky/repair-0${{ matrix.shard }}/inventory.json
          test -s runtime/numeric_sky/repair-0${{ matrix.shard }}/numbers.jsonl.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: numsky-repaired-${{ matrix.shard }}
          path: runtime/numeric_sky/repair-0${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 90
