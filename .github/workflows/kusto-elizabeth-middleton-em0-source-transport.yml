name: KUSTO Elizabeth Middleton EM0 Source Transport

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_elizabeth_middleton_em0_source_transport.py'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0-UNCHANGED-V2-PREREG-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-elizabeth-middleton-em0-source-transport.yml'
  workflow_dispatch:

jobs:
  em0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve Elizabeth Middleton current source routes without reading bodies
        run: python workspace/kusto_elizabeth_middleton_em0_source_transport.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-elizabeth-middleton-em0-source-transport-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0-SOURCE-TRANSPORT-RUN-2026-09-24-v1.0.json
          retention-days: 30
