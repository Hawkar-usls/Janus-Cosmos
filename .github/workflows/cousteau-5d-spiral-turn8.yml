name: Cousteau 5D Spiral Turn 8

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-5d-spiral-turn8.yml"
      - "workspace/cousteau_5d_spiral_turn8.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-EARTHSCOPE-FDSN-RESPONSE-AND-TINY-WAVEFORM-PROBE-2026-08-21-v1.0.json"

permissions:
  contents: write

jobs:
  turn8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute Turn 8
        run: python workspace/cousteau_5d_spiral_turn8.py
      - name: Show summary
        run: cat data/cousteau/JANUS-ECHO-COUSTEAU-5D-SPIRAL-TURN-008-2026-08-21-v1.0-SUMMARY.json
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-5d-turn8-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-ECHO-COUSTEAU-5D-SPIRAL-TURN-008-2026-08-21-v1.0.json
            data/cousteau/JANUS-ECHO-COUSTEAU-5D-SPIRAL-TURN-008-2026-08-21-v1.0-SUMMARY.json
          retention-days: 90
      - name: Freeze Turn 8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-5D-SPIRAL-TURN-008-2026-08-21-v1.0*.json
          git commit -m "Cousteau: freeze 5D spiral Turn 8 ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
