name: JANUS R37F1BC historical and natural metadata
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f1bc-metadata.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r37f1bc-metadata
  cancel-in-progress: false
jobs:
  cassini:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.3
      - run: |
          python -m py_compile research/seti/r37f1bc_metadata.py
          python research/seti/r37f1bc_metadata.py cassini
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f1b-cassini
          path: runtime/r37f1bc/cassini.json
          if-no-files-found: warn
  natural:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - run: |
          python -m py_compile research/seti/r37f1bc_metadata.py
          python research/seti/r37f1bc_metadata.py natural
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f1c-natural
          path: runtime/r37f1bc/natural.json
          if-no-files-found: warn
