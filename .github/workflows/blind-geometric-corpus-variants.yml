name: Janus Cosmos Blind Geometric Corpus Variants

on:
  push:
    paths:
      - 'experiments/hst/run_blind_corpus_variant.py'
      - '.github/workflows/blind-geometric-corpus-variants.yml'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Downloader backend'
        required: true
        type: choice
        options:
          - both
          - direct
          - mast_api
        default: both

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  direct:
    if: ${{ github.event_name == 'push' || inputs.backend == 'both' || inputs.backend == 'direct' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy astropy
      - name: Run direct archive variant
        run: python experiments/hst/run_blind_corpus_variant.py --backend direct --output-dir results/direct
      - name: Validate direct receipt
        run: |
          python - <<'PY'
          import json
          p='results/direct/janus-cosmos-blind-corpus-receipt.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['backend']=='direct'
          assert len(d['targets'])==7
          assert d['blind_gate']['semantic_analysis'] is False
          assert d['blind_gate']['ocr'] is False
          assert d['blind_gate']['face_search'] is False
          assert d['blind_gate']['post_hoc_tuning'] is False
          print('DIRECT PASS candidate_count=', d['candidate_count'])
          PY
      - name: Upload direct receipt
        uses: actions/upload-artifact@v6
        with:
          name: janus-cosmos-direct-receipt
          path: results/direct/
      - name: Persist direct receipt
        env:
          BACKEND: direct
        run: |
          mkdir -p data/runtime/blind_variants
          cp results/direct/janus-cosmos-blind-corpus-receipt.json "data/runtime/blind_variants/${BACKEND}-latest.json"
          cp results/direct/janus-cosmos-blind-events.jsonl "data/runtime/blind_variants/${BACKEND}-latest.events.jsonl"
          git config user.name 'janus-cosmos[bot]'
          git config user.email 'janus-cosmos[bot]@users.noreply.github.com'
          git add data/runtime/blind_variants/${BACKEND}-latest.json data/runtime/blind_variants/${BACKEND}-latest.events.jsonl
          git commit -m "Persist Janus Cosmos direct variant receipt" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            sleep $((i * 2))
          done

  mast-api:
    if: ${{ github.event_name == 'push' || inputs.backend == 'both' || inputs.backend == 'mast_api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy astropy
      - name: Run MAST API variant
        run: python experiments/hst/run_blind_corpus_variant.py --backend mast_api --output-dir results/mast_api
      - name: Validate MAST API receipt
        run: |
          python - <<'PY'
          import json
          p='results/mast_api/janus-cosmos-blind-corpus-receipt.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['backend']=='mast_api'
          assert len(d['targets'])==7
          assert d['blind_gate']['semantic_analysis'] is False
          assert d['blind_gate']['ocr'] is False
          assert d['blind_gate']['face_search'] is False
          assert d['blind_gate']['post_hoc_tuning'] is False
          print('MAST API PASS candidate_count=', d['candidate_count'])
          PY
      - name: Upload MAST API receipt
        uses: actions/upload-artifact@v6
        with:
          name: janus-cosmos-mast-api-receipt
          path: results/mast_api/
      - name: Persist MAST API receipt
        env:
          BACKEND: mast_api
        run: |
          mkdir -p data/runtime/blind_variants
          cp results/mast_api/janus-cosmos-blind-corpus-receipt.json "data/runtime/blind_variants/${BACKEND}-latest.json"
          cp results/mast_api/janus-cosmos-blind-events.jsonl "data/runtime/blind_variants/${BACKEND}-latest.events.jsonl"
          git config user.name 'janus-cosmos[bot]'
          git config user.email 'janus-cosmos[bot]@users.noreply.github.com'
          git add data/runtime/blind_variants/${BACKEND}-latest.json data/runtime/blind_variants/${BACKEND}-latest.events.jsonl
          git commit -m "Persist Janus Cosmos MAST API variant receipt" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            sleep $((i * 2))
          done
