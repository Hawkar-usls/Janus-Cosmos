name: JANUS R40N10 ArtMoney TURBO and repeat ON OFF
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r40n10-artmoney-turbo.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r40n10-artmoney-turbo
  cancel-in-progress: false
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile exact arithmetic and checkpoint driver
        run: python -m py_compile research/seti/r40n10_turbo.py research/seti/r40n10_artmoney_turbo.py
      - name: Prepare locked metadata and test full-bank numerical parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10_artmoney_turbo.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10-progress-00-prepare
          path: runtime/r40n10/progress/00-prepare.json
          retention-days: 90
          if-no-files-found: error
      - name: Development replay 01 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10_artmoney_turbo.py dev 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10-progress-dev-01
          path: runtime/r40n10/progress/dev-01.json
          retention-days: 90
          if-no-files-found: error
      - name: Development replay 02 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10_artmoney_turbo.py dev 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10-progress-dev-02
          path: runtime/r40n10/progress/dev-02.json
          retention-days: 90
          if-no-files-found: error
      - name: Development replay 03 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10_artmoney_turbo.py dev 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10-progress-dev-03
          path: runtime/r40n10/progress/dev-03.json
          retention-days: 90
          if-no-files-found: error
      - name: Development replay 04 of 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10_artmoney_turbo.py dev 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
