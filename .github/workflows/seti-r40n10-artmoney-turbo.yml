      - name: Aggregate exact speed and paired scientific results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10_artmoney_turbo.py summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10-progress-99-summary
          path: runtime/r40n10/progress/99-summary.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r40n10-artmoney-turbo
          path: |
            runtime/r40n10/*.json
            runtime/r40n10/*.npz
            runtime/r40n10/progress/*.json
          retention-days: 90
          if-no-files-found: warn
