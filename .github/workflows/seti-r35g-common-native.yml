name: JANUS R35G common native comparison
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r35g-common-native.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r35g-native-comparison
  cancel-in-progress: false
jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      inputs_id: ${{ steps.inputs.outputs.artifact-id }}
      inputs_digest: ${{ steps.inputs.outputs.artifact-digest }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Rebuild pinned manifest inputs and audit R32 overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r35g_common_replay.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: inputs
        with:
          name: janus-r35g-common-inputs
          path: |
            runtime/r35g/inputs/*.npz
            runtime/r35g/receipt.json
            runtime/r35g/lock.json
            runtime/r35g/manifest.json
  native:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        mode: [bliss, fastdd, turbo]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned BLISS
        if: matrix.mode == 'bliss'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libhdf5-dev libfftw3-dev liblz4-dev pkg-config
          python -m pip install numpy==2.2.6 h5py==3.13.0 requests==2.32.3 matplotlib==3.10.1
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps 'git+https://github.com/UCBerkeleySETI/bliss.git@2b98afe960f13ee7e467aca499576d87ee7502f5'
      - name: Install fastDD build dependencies
        if: matrix.mode == 'fastdd'
        run: python -m pip install numpy==2.2.6 requests==2.32.3
      - name: Install pinned turboSETI
        if: matrix.mode == 'turbo'
        run: |
          python -m pip install numpy==1.26.4 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 numba==0.61.2
          python -m pip install 'git+https://github.com/UCBerkeleySETI/turbo_seti.git@7d9b4fde9bc98d834dc11cfc0acd2380e6676f0e'
      - name: Compare native CPU method on identical arrays
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ID: ${{ needs.common.outputs.inputs_id }}
          INPUT_DIGEST: ${{ needs.common.outputs.inputs_digest }}
          MODE: ${{ matrix.mode }}
        run: |
          lscpu
          python research/seti/r35g_native_compare.py "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r35g-native-${{ matrix.mode }}
          path: |
            runtime/r35g_native/${{ matrix.mode }}/*.json
            runtime/r35g_native/${{ matrix.mode }}/*.npz
          if-no-files-found: warn
