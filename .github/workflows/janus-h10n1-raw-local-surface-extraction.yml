name: JANUS H10N1 Raw Local Surface Extraction

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_h10n1_raw_local_surface_extract.py"
      - ".github/workflows/janus-h10n1-raw-local-surface-extraction.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests numpy netCDF4
      - name: Extract raw unscored H10N1 windows
        run: python workspace/janus_h10n1_raw_local_surface_extract.py
      - name: Show extraction receipt
        run: cat data/cousteau/JANUS-H10N1-RAW-LOCAL-SURFACE-EXTRACTION-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-h10n1-raw-local-surface-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-H10N1-RAW-LOCAL-SURFACE-EXTRACTION-RUN-001-2026-08-22-v1.0.json
            workspace/h10n1_raw_surface/*.npz
          retention-days: 90
      - name: Freeze extraction receipt only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-H10N1-RAW-LOCAL-SURFACE-EXTRACTION-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze H10N1 raw local surface extraction ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
