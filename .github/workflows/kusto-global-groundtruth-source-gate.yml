name: KUSTO Global Groundtruth Source Gate

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_global_groundtruth_source_gate.py'
      - 'data/cousteau/JANUS-KUSTO-GLOBAL-GROUNDTRUTH-BENCHMARK-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-GLOBAL-GROUNDTRUTH-SOURCE-REGISTRY-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-global-groundtruth-source-gate.yml'
  workflow_dispatch:

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Run frozen G0 source and provenance gate
        run: python workspace/kusto_global_groundtruth_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-global-groundtruth-source-gate-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-GLOBAL-GROUNDTRUTH-SOURCE-GATE-RUN-2026-09-23-v1.0.json
          retention-days: 30
