name: Cousteau T-phase Celestial Spacetime Crossmatch

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-tphase-celestial-spacetime-crossmatch.yml"
      - "workspace/cousteau_tphase_celestial_spacetime_crossmatch.py"

permissions:
  contents: write

jobs:
  crossmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml numpy pandas scikit-learn
      - name: Execute 5943-event celestial spacetime crossmatch
        id: gate
        continue-on-error: true
        run: |
          python workspace/cousteau_tphase_celestial_spacetime_crossmatch.py \
            --output data/cousteau/JANUS-ECHO-COUSTEAU-TPHASE-CELESTIAL-SPACETIME-CROSSMATCH-RUN-001-2026-08-21-v1.0.json \
            --status-output data/cousteau/JANUS-ECHO-COUSTEAU-TPHASE-CELESTIAL-SPACETIME-CROSSMATCH-RUN-001-2026-08-21-v1.0-STATUS.json
      - name: Show result
        if: always()
        run: |
          cat data/cousteau/JANUS-ECHO-COUSTEAU-TPHASE-CELESTIAL-SPACETIME-CROSSMATCH-RUN-001-2026-08-21-v1.0-STATUS.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cousteau-tphase-celestial-spacetime-crossmatch-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-ECHO-COUSTEAU-TPHASE-CELESTIAL-SPACETIME-CROSSMATCH-RUN-001-2026-08-21-v1.0.json
            data/cousteau/JANUS-ECHO-COUSTEAU-TPHASE-CELESTIAL-SPACETIME-CROSSMATCH-RUN-001-2026-08-21-v1.0-STATUS.json
          if-no-files-found: warn
          retention-days: 90
      - name: Freeze result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-TPHASE-CELESTIAL-SPACETIME-CROSSMATCH-RUN-001-2026-08-21-v1.0*.json || true
          git commit -m "Cousteau: freeze T-phase celestial spacetime crossmatch ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
      - name: Enforce gate
        if: steps.gate.outcome != 'success'
        run: exit 1
