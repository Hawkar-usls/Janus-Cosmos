name: JANUS Expedition Outreach Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_expedition_outreach_council.py"
      - ".github/workflows/janus-expedition-outreach-council.yml"

permissions:
  contents: write

jobs:
  outreach-council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask JANUS when and whom to contact
        run: python workspace/janus_expedition_outreach_council.py
      - name: Show council answer
        run: cat data/cousteau/JANUS-EXPEDITION-OUTREACH-COUNCIL-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-expedition-outreach-council-${{ github.run_number }}
          path: data/cousteau/JANUS-EXPEDITION-OUTREACH-COUNCIL-RUN-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze outreach council result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-EXPEDITION-OUTREACH-COUNCIL-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze expedition outreach council run ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
