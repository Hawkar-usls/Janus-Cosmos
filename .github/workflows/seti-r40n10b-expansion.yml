name: JANUS R40N10B frozen expansion Parkes 10cm and UWL
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r40n10b-expansion.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r40n10b-expansion
  cancel-in-progress: false
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile frozen expansion
        run: python -m py_compile research/seti/r40n10b_expansion.py research/seti/r40n10_artmoney_turbo.py research/seti/r40n10_turbo.py
      - name: Authenticate frozen N10 and prior-data exclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-00-prepare
          path: |
            runtime/r40n10b/progress/00-prepare.json
            runtime/r40n10b/old_rejection.json
          retention-days: 90
          if-no-files-found: error
      - name: Audit old Parkes rejection gates and alternate alias queries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py select same_receiver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-01-same
          path: |
            runtime/r40n10b/progress/01-same_receiver.json
            runtime/r40n10b/same_receiver_manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Qualify separate UWL published archive subbands without reading power
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py select uwl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-01-uwl
          path: |
            runtime/r40n10b/progress/01-uwl.json
            runtime/r40n10b/uwl_manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Freeze both manifests before any power reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-02-freeze
          path: |
            runtime/r40n10b/progress/02-freeze.json
            runtime/r40n10b/manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 same_receiver group 01 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group same_receiver 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-same_receiver-01
          path: |
            runtime/r40n10b/progress/same_receiver-01.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 same_receiver group 02 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group same_receiver 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-same_receiver-02
          path: |
            runtime/r40n10b/progress/same_receiver-02.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 same_receiver group 03 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group same_receiver 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-same_receiver-03
          path: |
            runtime/r40n10b/progress/same_receiver-03.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 same_receiver group 04 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group same_receiver 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-same_receiver-04
          path: |
            runtime/r40n10b/progress/same_receiver-04.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 uwl group 01 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group uwl 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-uwl-01
          path: |
            runtime/r40n10b/progress/uwl-01.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 uwl group 02 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group uwl 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-uwl-02
          path: |
            runtime/r40n10b/progress/uwl-02.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 uwl group 03 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group uwl 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-uwl-03
          path: |
            runtime/r40n10b/progress/uwl-03.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure frozen N10 uwl group 04 of up to 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py group uwl 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-uwl-04
          path: |
            runtime/r40n10b/progress/uwl-04.json
          retention-days: 90
          if-no-files-found: error
      - name: Aggregate distinct receiver domains and exact paired loss
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r40n10b_expansion.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10b-progress-99-summary
          path: |
            runtime/r40n10b/progress/99-summary.json
            runtime/r40n10b/result.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r40n10b-expansion
          path: |
            runtime/r40n10b/*.json
            runtime/r40n10b/*.npz
            runtime/r40n10b/progress/*.json
          retention-days: 90
          if-no-files-found: warn
