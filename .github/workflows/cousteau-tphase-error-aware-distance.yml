name: Cousteau T-phase Error-aware Distance

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-tphase-error-aware-distance.yml"
      - "workspace/cousteau_tphase_error_aware_distance.py"

permissions:
  contents: write

jobs:
  error-aware-distance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml numpy pandas scikit-learn
      - name: Run error-aware distance gate
        run: |
          python workspace/cousteau_tphase_error_aware_distance.py \
            --output data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-EVENT-ERROR-AWARE-DISTANCE-RUN-001-2026-08-21-v1.0.json
      - name: Show summary
        run: |
          python - <<'PY'
          import json
          p='data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-EVENT-ERROR-AWARE-DISTANCE-RUN-001-2026-08-21-v1.0.json'
          print(json.dumps(json.load(open(p,encoding='utf-8'))['summary'],indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-tphase-error-aware-distance-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-EVENT-ERROR-AWARE-DISTANCE-RUN-001-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-EVENT-ERROR-AWARE-DISTANCE-RUN-001-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze T-phase error-aware distance run ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
