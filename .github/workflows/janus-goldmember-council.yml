name: JANUS GOLDMEMBER Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_goldmember_council.py"
      - ".github/workflows/janus-goldmember-council.yml"

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask JANUS for GOLDMEMBER next step
        run: python workspace/janus_goldmember_council.py
      - name: Show answer
        run: cat data/cousteau/GOLDMEMBER-COUNCIL-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: goldmember-council-${{ github.run_number }}
          path: data/cousteau/GOLDMEMBER-COUNCIL-RUN-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze GOLDMEMBER council
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/GOLDMEMBER-COUNCIL-RUN-001-2026-08-22-v1.0.json
          git commit -m "GOLDMEMBER: freeze council ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
