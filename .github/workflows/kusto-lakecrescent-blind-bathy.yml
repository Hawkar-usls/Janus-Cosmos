name: KUSTO Lake Crescent Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_lakecrescent_blind_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-LAKE-CRESCENT-3M-BLIND-BATHYMETRY-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-lakecrescent-blind-bathy.yml'
  workflow_dispatch:

jobs:
  blind-bathy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests
      - name: Run frozen blind bathymetry discovery
        run: python workspace/kusto_lakecrescent_blind_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-lakecrescent-blind-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-LAKE-CRESCENT-3M-BLIND-BATHYMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
