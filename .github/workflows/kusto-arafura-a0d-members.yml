name: KUSTO Arafura A0D Member Inventory

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_arafura_a0d_member_inventory.py'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0C-CURRENT-ROUTE-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-arafura-a0d-members.yml'
  workflow_dispatch:

jobs:
  a0d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Inventory Arafura archive members without pixel decode
        run: python workspace/kusto_arafura_a0d_member_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-arafura-a0d-members-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ARAFURA-A0D-ARCHIVE-MEMBER-INVENTORY-2026-09-24-v1.0.json
          retention-days: 30
