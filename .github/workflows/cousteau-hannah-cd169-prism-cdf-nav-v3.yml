name: Cousteau Hannah CD169 PRISM CDF Nav V3
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_cd169_prism_cdf_nav_metadata_probe_v3.py'
      - 'data/cousteau/JANUS-HANNAH-CD169-NATIVE-OR-CALIBRATED-VEH-NAV-RECOVERY-V3-CONTRACT-2026-08-26-v1.0.json'
      - '.github/workflows/cousteau-hannah-cd169-prism-cdf-nav-v3.yml'
permissions:
  contents: read
jobs:
  cdf-nav-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NetCDF reader
        run: python -m pip install --disable-pip-version-check netCDF4 numpy
      - name: Syntax check
        run: python -m py_compile workspace/hannah_cd169_prism_cdf_nav_metadata_probe_v3.py
      - name: Probe processed CDF navigation metadata only
        id: probe
        continue-on-error: true
        run: |
          python workspace/hannah_cd169_prism_cdf_nav_metadata_probe_v3.py \
            --output out/JANUS-HANNAH-CD169-PRISM-CDF-NAV-METADATA-V3-RUN-001.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hannah-cd169-prism-cdf-nav-v3
          path: out/JANUS-HANNAH-CD169-PRISM-CDF-NAV-METADATA-V3-RUN-001.json
          if-no-files-found: error
          retention-days: 7
      - name: Propagate probe execution failure after receipt preservation
        if: steps.probe.outcome == 'failure'
        run: exit 1
