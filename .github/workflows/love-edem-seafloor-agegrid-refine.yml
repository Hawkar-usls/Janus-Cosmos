name: LOVE EDEM Seafloor Agegrid Refine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workspace/love_edem_seafloor_agegrid_refine.py"
      - ".github/workflows/love-edem-seafloor-agegrid-refine.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests numpy netCDF4 pyshp shapely pyproj
      - name: Run refinement
        run: python workspace/love_edem_seafloor_agegrid_refine.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/love/JANUS-LOVE-EDEM-SEAFLOOR-AGEGRID-REFINEMENT-RUN-001-RECEIPT.json'
          r=json.load(open(p))
          assert r['frozen_point']['no_recenter'] is True
          assert r['status'] in ('REFINEMENT_COMPLETE','REFINEMENT_PARTIAL')
          PY
      - name: Persist receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/JANUS-LOVE-EDEM-SEAFLOOR-AGEGRID-REFINEMENT-RUN-001-RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "cosmos: freeze LOVE EDEM seafloor age-grid refinement run 1"
          git pull --rebase origin main
          git push
