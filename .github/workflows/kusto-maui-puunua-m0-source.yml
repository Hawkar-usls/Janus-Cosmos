name: KUSTO Maui Puunua M0 Source Binding

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_maui_puunua_m0_source.py'
      - 'data/cousteau/JANUS-KUSTO-MAUI-PUUNUA-UNSEEN-DUALCHANNEL-V2-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-maui-puunua-m0-source.yml'
  workflow_dispatch:

jobs:
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve frozen Puunua bathymetry/backscatter pair without raster values
        run: python workspace/kusto_maui_puunua_m0_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-maui-puunua-m0-source-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-MAUI-PUUNUA-M0-SOURCE-BINDING-RUN-2026-09-23-v1.0.json
          retention-days: 30
