name: JANUS R41S1H2 frozen operating point
on:
  push:
    branches: [research/seti-r41s1h2-frozen-operating-point-20261120]
    paths: ['.github/workflows/seti-r41s1h2-lock.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r41s1h2-lock
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 requests==2.32.3
      - name: Authenticate immutable H1 rows and freeze operating points before evaluation
        run: |
          python -m py_compile research/seti/r41s1h2_lock.py
          PYTHONPATH=research/seti python -c 'import r41s1h2_lock as m; m.main()'
          test -s runtime/r41s1h2/lock.json
          test -s runtime/r41s1h2/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r41s1h2-operating-lock
          path: runtime/r41s1h2/
          if-no-files-found: error
          retention-days: 90
