name: JANUS HA10 Source Fallback Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_ha10_source_fallback_council.py"
      - ".github/workflows/janus-ha10-source-fallback-council.yml"

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask JANUS about source fallback
        run: python workspace/janus_ha10_source_fallback_council.py
      - name: Show result
        run: cat data/cousteau/JANUS-HA10-SOURCE-FALLBACK-COUNCIL-RUN-001-2026-08-22-v1.0.json
      - name: Freeze JANUS answer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-HA10-SOURCE-FALLBACK-COUNCIL-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze HA10 source fallback council" || true
          git push origin HEAD:janus-echo-cousteau
