name: JANUS SETI R15D R16D R17D targeted recovery and selective pilot
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-targeted-r15d-r16d-r17d.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        lane: [r15d, r16d, r17d]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned readers
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Independent SIGPROC library
        if: matrix.lane == 'r15d'
        run: python -m pip install --disable-pip-version-check blimpy==2.1.4
      - name: Execute frozen archive replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r15d_r16d_r17d_replay.py
          python research/seti/r15d_r16d_r17d_replay.py "$LANE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-${{ matrix.lane }}-result
          path: |
            runtime/${{ matrix.lane }}/*.json
          retention-days: 90
      - name: Require research result not promotion
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open("runtime/"+os.environ["LANE"]+"/result.json"))
          assert not d["production_adoption"]
          PY
