name: KUSTO CAND003 Line31 Raw Provenance Recovery

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_line31_raw_provenance_recovery.py'
      - '.github/workflows/kusto-cand003-line31-raw-provenance-recovery.yml'
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan full accessible CD169 archive for raw EM12 provenance
        run: python workspace/kusto_cand003_line31_raw_provenance_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-line31-raw-provenance-recovery-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-LINE31-DOMINANT-CELLS-RAW-PROVENANCE-RECOVERY-RUN-2026-09-23-v1.0.json
          retention-days: 30
