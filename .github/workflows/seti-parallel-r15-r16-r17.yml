name: JANUS SETI R15 R16 R17 parallel archive pilots and RFI genome
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-parallel-r15-r16-r17.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [r15, r16]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned spectral reader
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Freeze metadata-only selection
        env:
          LANE: ${{ matrix.lane }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m py_compile research/seti/r15_r16_archive_pilots.py
          python research/seti/r15_r16_archive_pilots.py "$LANE" freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-${{ matrix.lane }}-manifest
          path: runtime/${{ matrix.lane }}/
          retention-days: 90
      - name: Perform bounded spectral analysis
        env:
          LANE: ${{ matrix.lane }}
          PYTHONUNBUFFERED: '1'
        run: python research/seti/r15_r16_archive_pilots.py "$LANE" scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-${{ matrix.lane }}-result
          path: runtime/${{ matrix.lane }}/
          retention-days: 90
      - name: Require nonempty archive results
        env:
          LANE: ${{ matrix.lane }}
        run: |
          python - <<'PY'
          import json,os
          lane=os.environ["LANE"]
          s=json.load(open("runtime/"+lane+"/result.json"))["summary"]
          assert s["selected"]>0, "No eligible archive products"
          if lane=="r15":
              assert s["read_anchor"]==s["selected"], "Incomplete anchor coverage"
          else:
              assert s["read"]==s["selected"]==6, "Incomplete ATLAS cadence"
          PY
  rfi-genome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train R9 only and compare held-out R11 against fixed baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m py_compile research/seti/r17_rfi_genome.py
          python research/seti/r17_rfi_genome.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r17-experimental-weights-and-library
          path: runtime/r17/
          retention-days: 90
