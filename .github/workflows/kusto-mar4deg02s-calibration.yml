name: KUSTO MAR 4deg02S Known-Positive Calibration
on:
  push:
    branches: [feature/kusto-cross-survey-validation-v1]
    paths:
      - 'workspace/kusto_mar4deg02s_calibration.py'
      - '.github/workflows/kusto-mar4deg02s-calibration.yml'
  workflow_dispatch:
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests
      - name: Run frozen known-positive calibration
        run: python workspace/kusto_mar4deg02s_calibration.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-mar4deg02s-known-positive-v1
          path: workspace/kusto_cross_survey_out/
          retention-days: 30
