name: KUSTO Elizabeth Middleton EM0D Header Geometry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_elizabeth_middleton_em0d_header_geometry.py'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0B-ARCHIVE-MEMBER-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-elizabeth-middleton-em0d-header-geometry.yml'
  workflow_dispatch:

jobs:
  em0d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests rasterio
      - name: Inspect raster headers without band reads
        run: python workspace/kusto_elizabeth_middleton_em0d_header_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-elizabeth-middleton-em0d-header-geometry-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ELIZABETH-MIDDLETON-EM0D-RASTER-HEADER-GEOMETRY-2026-09-24-v1.0.json
          retention-days: 30
