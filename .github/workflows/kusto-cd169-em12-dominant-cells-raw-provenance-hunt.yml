name: KUSTO CD169 EM12 Dominant Cells Raw Provenance Hunt

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cd169_em12_dominant_cells_raw_provenance_hunt.py'
      - '.github/workflows/kusto-cd169-em12-dominant-cells-raw-provenance-hunt.yml'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory accessible archive and bind dominant cells to line31 time
        run: python workspace/kusto_cd169_em12_dominant_cells_raw_provenance_hunt.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cd169-em12-dominant-cells-raw-provenance-hunt-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CD169-EM12-DOMINANT-CELLS-RAW-PROVENANCE-HUNT-RUN-2026-09-23-v1.0.json
          retention-days: 30
