name: LOVE G1-007 Real Sky Search

on:
  push:
    branches:
      - research/love-g1-007-v1
    paths:
      - 'data/love/**'
      - 'janus_cosmos/love_search.py'
      - '.github/workflows/love-g1-007-real-sky.yml'
      - 'requirements.txt'
  pull_request:
    branches:
      - legacy-cosmos-pre-osiris-2026-08-19
    paths:
      - 'data/love/**'
      - 'janus_cosmos/love_search.py'
      - '.github/workflows/love-g1-007-real-sky.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  real-sky-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install astronomy stack
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Resolve Lave into real sky
        run: |
          python -u -m janus_cosmos.love_search \
            --prereg data/love/LAVE_TO_LOVE_PREREG.json \
            --output results/love/love-real-sky-result.json
      - name: Enforce discovery firewall
        run: |
          python - <<'PY'
          import json
          p='results/love/love-real-sky-result.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['gaia']['status'] != 'ERROR', d['gaia']['error']
          assert d['love_gate']['candidate_activated'] is False
          assert d['claim_ceiling'].startswith('TARGETED_REAL_SKY_COUNTERPART_SEARCH_ONLY')
          print('LOVE resolver PASS')
          print('Gaia ranked:', d['gaia']['ranked_source_count'])
          print('K-like:', d['gaia']['k_like_count'])
          print('Known planets in control cone:', d['nasa_exoplanet_archive']['known_planet_count_in_cone_and_distance_slice'])
          print('TESS-ready:', d['mast_tess']['targeted_timeseries_available_count'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: love-g1-007-real-sky-result
          if-no-files-found: warn
          path: results/love/
