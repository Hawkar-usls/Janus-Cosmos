name: JANUS TACHYON STAR T2B ZTF Prepointed Pixel Replication
on:
  push:
    branches: [research/luci-only-v1]
    paths:
      - 'experiments/luci/run_tachyon_star_t2b_ztf.py'
      - 'tests/test_tachyon_star_t2b_ztf.py'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T2B-ZTF-PREPOINTED-MANIFEST.csv'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T2B-ZTF-PREREG.json'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T2B-ZTF-MANIFEST-DIGEST-AMENDMENT-001.json'
      - '.github/workflows/tachyon-star-t2b-ztf.yml'
permissions: {contents: read}
jobs:
  prepointed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Verify exact frozen Git blob and record SHA-256 before external pixel access
        shell: bash
        run: |
          p=data/tachyon_star/JANUS-TACHYON-STAR-T2B-ZTF-PREPOINTED-MANIFEST.csv
          echo "manifest_sha256_pre_pixel=$(sha256sum "$p" | awk '{print $1}')"
          test "$(git hash-object "$p")" = '902ac74624b8c30c365544555f5071c78ec4cae2'
          test "$(wc -l < "$p")" -eq 42
      - run: python -m unittest tests/test_tachyon_star_t2b_ztf.py -v
      - name: Execute prepointed ZTF pixel replication
        shell: bash
        run: |
          mkdir -p results/tachyon_star_t2b_ztf
          set +e
          python -m experiments.luci.run_tachyon_star_t2b_ztf --output-dir results/tachyon_star_t2b_ztf --cache-dir .cache/tachyon_star_t2b_ztf
          rc=$?
          set -e
          echo "$rc" > results/tachyon_star_t2b_ztf/scientific_runner_exit_code.txt
          test -s results/tachyon_star_t2b_ztf/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-tachyon-star-t2b-ztf
          path: results/tachyon_star_t2b_ztf/
          if-no-files-found: error
