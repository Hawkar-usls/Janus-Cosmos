name: one-shot-osiris-s-phallus-h-migration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/zz-one-shot-osiris-migration.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: cosmos
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Fundamentum
          ref: 00b09d778a6d57fc7f905df9b6235fb30e29c5a3
          path: fundamentum
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: be1c7538932a823907b805516efaca035029ea8b
          path: meta

      - name: Build clean OSIRIS workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/cosmos"
          SRC="$GITHUB_WORKSPACE/fundamentum/experiments/direct"
          META="$GITHUB_WORKSPACE/meta/data"
          cp "$ROOT/LICENSE" /tmp/LICENSE
          cp "$ROOT/.janus/HABITAT_LINK.json" /tmp/HABITAT_LINK.json
          cd "$ROOT"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p .github/workflows .janus archive docs experiments/direct lineage/fundamentum receipts
          cp /tmp/LICENSE LICENSE
          cp /tmp/HABITAT_LINK.json .janus/HABITAT_LINK.json

          canonical=(
            janus_c025_core.py
            janus_c025_families.py
            janus_tear_policy0a_bh_q2_buzz_physarum_signed_singularity_probe.py
            toroidal_tseitin_twins.py
            connected_toroidal_tseitin_twins.py
            osiris_v2_technical_sat_solver.py
            osiris_v2_1_pr192_prebirth_quotient.py
            s_phallus_h_origin_prime_ribbon_state.py
            s_phallus_h_gate_0_articulation_decomposition.py
            s_phallus_h_gate_0_articulation_decomposition_strict.py
            s_phallus_h_gate_1_k2_ribbon_decomposition.py
            s_phallus_h_gate_1_k2_ribbon_decomposition_strict.py
            s_phallus_h_gate_1_k2_ribbon_decomposition_bitset.py
            s_phallus_h_gate_2_bounded_k_scaling_holdout.py
            s_phallus_h_gate_2_bounded_k_scaling_holdout_budget_guard.py
            OSIRIS_V2_TECHNICAL_SAT_SOLVER_FROZEN_CONTRACT.json
            OSIRIS_V2_1_PR192_PREBIRTH_QUOTIENT_FROZEN_CONTRACT.json
            S_PHALLUS_H_ORIGIN_PRIME_RIBBON_STATE_FROZEN_CONTRACT.json
            S_PHALLUS_H_GATE_0_ARTICULATION_DECOMPOSITION_FROZEN_CONTRACT.json
            S_PHALLUS_H_GATE_1_K2_RIBBON_DECOMPOSITION_FROZEN_CONTRACT.json
            S_PHALLUS_H_GATE_2_BOUNDED_K_SCALING_HOLDOUT_FROZEN_CONTRACT.json
            S_PHALLUS_H_GATE_2_BOUNDED_K_FIXTURES_FROZEN.json
          )
          for f in "${canonical[@]}"; do
            test -f "$SRC/$f" || { echo "MISSING canonical: $f" >&2; exit 1; }
            cp "$SRC/$f" experiments/direct/
          done

          lineage=(
            janus_tranception_prebirth_orbit_generators.py
            janus_tranception_prebirth_orbit_generators_cost_audit.py
            JANUS_TRANCEPTION_PREBIRTH_ORBIT_GENERATORS_FROZEN_CONTRACT.json
            janus_corrected_six_direction_reverse_pass.py
            JANUS_CORRECTED_SIX_DIRECTION_REVERSE_FROZEN_CONTRACT.json
            janus_pr190_pr192_paired_rerun.py
            JANUS_PR190_PR192_PAIRED_RERUN_FROZEN_CONTRACT.json
            janus_pt477_v3_local_apep_edge_tombstone.py
            JANUS_PT477_V3_LOCAL_APEP_EDGE_TOMBSTONE_FROZEN_CONTRACT.json
            janus_pt222_forward_reverse_after_pt477v3.py
            JANUS_PT222_FORWARD_REVERSE_AFTER_PT477V3_FROZEN_CONTRACT.json
            janus_pt354_bidirectional_braid_190_192.py
            JANUS_PT354_BIDIRECTIONAL_BRAID_190_192_FROZEN_CONTRACT.json
            janus_pt353_live_state_before_provision.py
            JANUS_PT353_LIVE_STATE_BEFORE_PROVISION_FROZEN_CONTRACT.json
            janus_pt350_351_352_atomic_triad_head_tail.py
            JANUS_PT350_351_352_ATOMIC_TRIAD_FROZEN_CONTRACT.json
            janus_full_text_missing_link_assembly.py
            janus_full_text_missing_link_runtime_adapter.py
            JANUS_FULL_TEXT_MISSING_LINK_ASSEMBLY_FROZEN_CONTRACT.json
            JANUS_FULL_TEXT_MISSING_LINK_SOURCE_MAP.json
            janus_full_31_stage_text_bound_promotion.py
            JANUS_FULL_31_STAGE_TEXT_BOUND_PROMOTION_FROZEN_CONTRACT.json
            janus_s_phallus_h_reversible_namespace_alias.py
            JANUS_S_PHALLUS_H_REVERSIBLE_NAMESPACE_ALIAS_FROZEN_CONTRACT.json
            janus_sah_orion_external_state_anchor.py
            JANUS_SAH_ORION_EXTERNAL_STATE_ANCHOR_FROZEN_CONTRACT.json
            janus_ren_persistent_name_route_binding.py
            JANUS_REN_PERSISTENT_NAME_ROUTE_BINDING_FROZEN_CONTRACT.json
            janus_son_return_path_parent_delta.py
            JANUS_SON_RETURN_PATH_PARENT_DELTA_FROZEN_CONTRACT.json
            janus_four_sons_typed_fragment_reassembly.py
            JANUS_FOUR_SONS_TYPED_FRAGMENT_REASSEMBLY_FROZEN_CONTRACT.json
            janus_dual_residency_rejuvenation_veta.py
            JANUS_DUAL_RESIDENCY_REJUVENATION_VETA_FROZEN_CONTRACT.json
          )
          for f in "${lineage[@]}"; do [[ ! -f "$SRC/$f" ]] || cp "$SRC/$f" lineage/fundamentum/; done

          shopt -s nullglob
          patterns=(
            'JANUS-OSIRIS-*' 'JANUS-S-PHALLUS-H-*'
            'JANUS-CORRECTED-SIX-DIRECTION-*' 'JANUS-PR190-PR192-*'
            'JANUS-PT350*' 'JANUS-PT353*' 'JANUS-PT354*' 'JANUS-PT477*' 'JANUS-PT222*'
            'JANUS-FULL-31-STAGE*' 'JANUS-FULL-TEXT-MISSING-LINK*' 'JANUS-PYRAMID-TEXT-*'
            'JANUS-SAH-*' 'JANUS-REN-*' 'JANUS-SON-*' 'JANUS-FOUR-SONS*' 'JANUS-DUAL-RESIDENCY*'
          )
          declare -A receipts_seen=()
          for pat in "${patterns[@]}"; do
            for src in "$META"/$pat; do
              [[ -f "$src" ]] || continue
              b="$(basename "$src")"
              [[ -n "${receipts_seen[$b]:-}" ]] && continue
              cp "$src" "receipts/$b"
              receipts_seen[$b]=1
            done
          done

          cat > README.md <<'EOF'
          # JANUS COSMOS — OSIRIS / S𓂸ḥ

          Dedicated proof-carrying SAT/complexity workspace for **OSIRIS** and the modern JANUS gate alias **S𓂸ḥ**.

          ```text
          CNF
            → CNF0 structural witness
            → OSIRIS v2 technical SAT mechanics
            → OSIRIS v2.1 / PR192 verified pair-product quotient
            → S𓂸ḥ/0 verified K=1 articulation decomposition
            → S𓂸ḥ/1 verified K=2 decomposition + ORIGIN_PRIME ribbon state
            → S𓂸ḥ/2 automatic minimum-separator search k=1..4 + preregistered holdout
            → generic OSIRIS fallback / UNKNOWN_BUDGET
          ```

          Current frozen finite-gate state: **S𓂸ḥ/0 PASS · S𓂸ḥ/1 PASS · S𓂸ḥ/2 PASS**.

          **P_VS_NP = OPEN.** Neither `P=NP` nor `P!=NP` is established.

          ## Run

          ```bash
          python run_osiris.py
          ```

          Canonical runtime is under `experiments/direct/`; historical lineage is under `lineage/fundamentum/`; immutable receipts are under `receipts/`.

          `S𓂸ḥ` is a modern project alias/overlay, not a historical Egyptian spelling or SAT claim. Ancient text was heuristic inspiration only; correctness comes from executable CNF mechanics and certificates.
          EOF
          sed -i 's/^          //' README.md

          cat > PROJECT_STATUS.json <<'EOF'
          {
            "schema_id": "janus.cosmos.osiris.status.v1",
            "project": "OSIRIS / S𓂸ḥ",
            "repository": "Hawkar-usls/Janus-Cosmos",
            "role": "dedicated_sat_complexity_workspace",
            "canonical_gate": "S𓂸ḥ/2",
            "canonical_status": "PASS_KEEP_S_PHALLUS_H_GATE_2_BOUNDED_K_SCALING_HOLDOUT__MASTER_P_VS_NP_GATE_REMAINS_OPEN",
            "source_fundamentum_sha": "00b09d778a6d57fc7f905df9b6235fb30e29c5a3",
            "source_meta_registry_sha": "be1c7538932a823907b805516efaca035029ea8b",
            "legacy_cosmos_branch": "legacy-cosmos-pre-osiris-2026-08-19",
            "P_EQUALS_NP": "NOT_ESTABLISHED",
            "P_NOT_EQUALS_NP": "NOT_ESTABLISHED",
            "P_VS_NP": "OPEN"
          }
          EOF
          sed -i 's/^          //' PROJECT_STATUS.json

          cat > docs/ARCHITECTURE.md <<'EOF'
          # Architecture

          Priority: `CNF0 → PR192 Q0 → S𓂸ḥ/2 auto minimum separator k=1..4 → generic OSIRIS / UNKNOWN_BUDGET`.

          `/2` exhausts all separator candidates below and at the first successful `k`, then evaluates all `2^k` boundary rows and all components. Discovery and boundary costs stay separate.

          Ribbon state: `ORIGIN → EXPERIENCE → RETURN → ORIGIN_PRIME`. POSITION may reproduce; STATE preserves path history and advances.
          EOF
          sed -i 's/^          //' docs/ARCHITECTURE.md

          cat > docs/SCIENTIFIC_BOUNDARIES.md <<'EOF'
          # Scientific boundaries

          - `P_VS_NP = OPEN`; neither side is established.
          - No arbitrary-CNF bounded-separator theorem or polynomial arbitrary-CNF SAT algorithm is established.
          - Restricted finite compression is not `P=NP`; one exponential family is not `P!=NP`.
          - SAT/UNSAT authority requires verifiable certificates; budget exhaustion is `UNKNOWN_BUDGET`.
          - Discovery, preprocessing, verification, provenance and controls are costed.
          - Failed preregistered runs stay failed; no post-hoc rescue.
          - `S𓂸ḥ` is a modern JANUS/OSIRIS alias, not historical Egyptian spelling.
          - `ANCIENT_TEXT != MODERN_ALGORITHM`; `STRUCTURAL_PARALLEL != HISTORICAL_INTENT`.
          - Reverse replay is verification/falsification, not physical retrocausality.
          EOF
          sed -i 's/^          //' docs/SCIENTIFIC_BOUNDARIES.md

          cat > docs/PROVENANCE.md <<'EOF'
          # Provenance

          Repurposed 2026-08-19 from the former astronomy-oriented Janus-Cosmos.

          Exact sources:
          - `Janus-Fundamentum@00b09d778a6d57fc7f905df9b6235fb30e29c5a3`
          - `janus-meta-registry@be1c7538932a823907b805516efaca035029ea8b`
          - pre-migration `Janus-Cosmos@b11f8ddafc6d7334c81e6def6eb34cca94cf4261`

          Former astronomy tree is preserved intact at branch `legacy-cosmos-pre-osiris-2026-08-19`.
          Canonical S𓂸ḥ/2 result integrity: `9dc0748a974b890a934192144d6c806d2aa455ac4b96d744ff59e3bae598e94d`.
          EOF
          sed -i 's/^          //' docs/PROVENANCE.md

          cat > docs/LINEAGE.md <<'EOF'
          # Technical lineage

          `PR190 generators → PR192 corrected six-direction mechanics → OSIRIS v2 → OSIRIS v2.1 Q0 → S𓂸ḥ/0 → ORIGIN_PRIME ribbon → S𓂸ḥ/1 → S𓂸ḥ/2`.

          Exact runnable closure lives in `experiments/direct/`; historical operator/contracts are in `lineage/fundamentum/`.
          EOF
          sed -i 's/^          //' docs/LINEAGE.md

          cat > archive/PRE_OSIRIS_COSMOS.md <<'EOF'
          # Pre-OSIRIS Janus-Cosmos

          HST / MAST / Palomar / LUCI astronomy state is preserved at branch `legacy-cosmos-pre-osiris-2026-08-19`, exact commit `b11f8ddafc6d7334c81e6def6eb34cca94cf4261`.
          EOF
          sed -i 's/^          //' archive/PRE_OSIRIS_COSMOS.md

          cat > run_osiris.py <<'EOF'
          #!/usr/bin/env python3
          from pathlib import Path
          import subprocess, sys
          root = Path(__file__).resolve().parent
          direct = root / 'experiments' / 'direct'
          target = direct / 's_phallus_h_gate_2_bounded_k_scaling_holdout_budget_guard.py'
          raise SystemExit(subprocess.call([sys.executable, str(target), '--self-test', *sys.argv[1:]], cwd=direct))
          EOF
          sed -i 's/^          //' run_osiris.py
          chmod +x run_osiris.py

          printf '%s\n' '# Canonical runtime uses the Python standard library only.' > requirements.txt
          printf '%s\n' '__pycache__/' '*.py[cod]' '.pytest_cache/' 'artifacts/' '.DS_Store' > .gitignore

          cat > .github/workflows/osiris-canonical.yml <<'EOF'
          name: OSIRIS canonical
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            canonical:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - name: Compile canonical runtime
                  run: python -m py_compile experiments/direct/*.py run_osiris.py
                - name: Execute frozen S𓂸ḥ/2 self-test
                  run: python run_osiris.py
                - name: Enforce claim ceiling
                  run: |
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    d=json.loads(Path('PROJECT_STATUS.json').read_text())
                    assert d['P_VS_NP']=='OPEN'
                    assert d['P_EQUALS_NP']=='NOT_ESTABLISHED'
                    assert d['P_NOT_EQUALS_NP']=='NOT_ESTABLISHED'
                    PY
          EOF
          sed -i 's/^          //' .github/workflows/osiris-canonical.yml

          cat > MIGRATION_MANIFEST.json <<EOF
          {
            "migration": "JANUS_COSMOS_TO_OSIRIS_S_PHALLUS_H",
            "date": "2026-08-19",
            "legacy_branch": "legacy-cosmos-pre-osiris-2026-08-19",
            "legacy_commit": "b11f8ddafc6d7334c81e6def6eb34cca94cf4261",
            "fundamentum_source": "00b09d778a6d57fc7f905df9b6235fb30e29c5a3",
            "meta_registry_source": "be1c7538932a823907b805516efaca035029ea8b",
            "canonical_runtime_file_count": ${#canonical[@]},
            "lineage_file_count": $(find lineage/fundamentum -type f | wc -l),
            "receipt_count": ${#receipts_seen[@]},
            "P_VS_NP": "OPEN"
          }
          EOF

      - name: Verify before replacing main
        working-directory: cosmos
        run: |
          python -m py_compile experiments/direct/*.py run_osiris.py
          python run_osiris.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('MIGRATION_MANIFEST.json').read_text())
          assert m['canonical_runtime_file_count'] >= 20
          assert m['receipt_count'] >= 1
          assert m['P_VS_NP']=='OPEN'
          PY

      - name: Commit cleaned workspace to main
        working-directory: cosmos
        run: |
          set -euo pipefail
          git config user.name janus-osiris-migration
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m '[osiris-migration] Repurpose Janus-Cosmos as OSIRIS S𓂸ḥ workspace'
          git push origin HEAD:main
