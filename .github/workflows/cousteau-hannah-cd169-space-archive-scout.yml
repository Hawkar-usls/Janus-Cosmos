name: Cousteau Hannah CD169 Space Archive Scout
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_bodc_9406_space_archive_scout.py'
      - '.github/workflows/cousteau-hannah-cd169-space-archive-scout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory BODCREQ-9406 metadata before sample inspection
        run: |
          python workspace/hannah_bodc_9406_space_archive_scout.py \
            --output out/JANUS-HANNAH-CD169-SPACE-ARCHIVE-SCOUT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hannah-cd169-space-archive-scout
          path: out/JANUS-HANNAH-CD169-SPACE-ARCHIVE-SCOUT.json
          if-no-files-found: error
          retention-days: 7
