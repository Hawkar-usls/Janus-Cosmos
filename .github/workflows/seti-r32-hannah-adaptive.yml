name: JANUS SETI R32 HANNAH adaptive recognition
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r32-hannah-adaptive.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-seti-r32-hannah
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test fixed family invariance and abstention
        run: |
          python -m py_compile research/seti/r32_hannah_adaptive.py
          python research/seti/r32_hannah_adaptive.py selftest
          python - <<'PY'
          import hashlib,pathlib
          assert hashlib.sha256(pathlib.Path('research/seti/memory/hannah_library_v0003.json').read_bytes()).hexdigest()=='ec382441e707ebf131e3cb84b7037a9729f31ef3163412e99eca4462dcf0d807'
          PY
      - name: Freeze new targets before scoring
        run: python research/seti/r32_hannah_adaptive.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: manifest
        with:
          name: janus-seti-r32-manifest
          path: runtime/r32/manifest.json
      - name: Calibrate and evaluate frozen family policies; stage G4
        env:
          HANNAH_MANIFEST_ARTIFACT_ID: ${{ steps.manifest.outputs.artifact-id }}
          HANNAH_MANIFEST_ARTIFACT_SHA256: ${{ steps.manifest.outputs.artifact-digest }}
        run: python research/seti/r32_hannah_adaptive.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r32-adaptive-result
          path: runtime/r32/*.json
          if-no-files-found: warn
      - name: Verify result and exact memory lineage
        run: |
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('runtime/r32')
          d=json.loads((p/'result.json').read_text());h=json.loads((p/'hook_result.json').read_text());l=json.loads((p/'library.json').read_text())
          prev=json.loads(pathlib.Path('research/seti/memory/hannah_library_v0003.json').read_text())
          assert len(d['targets'])==8 and len({x['day'] for x in d['targets']})==8
          assert len(d['modes'])==7 and all(v['positives']==512 and v['controls']==512 for v in d['modes'].values())
          assert all(v['positives']==128 for v in d['leak_challenge'].values())
          assert d['gate']==('PASS_DEVELOPMENT' if all(d['gate_checks'].values()) else 'HOLD')
          assert h['observations']==128 and h['replay']['added']==0 and h['verified_rfi']==1
          assert l['entries'][:109]==prev['entries'] and len(l['entries'])==109+h['delta']['added']
          assert h['library_sha256']==hashlib.sha256((p/'library.json').read_bytes()).hexdigest()
          assert d['lock_sha256']==hashlib.sha256((p/'lock.json').read_bytes()).hexdigest()
          assert all(x=='PASS' for x in d['selftests'].values())
          assert not d['production_adoption'] and not h['production_adoption']
          PY
