name: JANUS R37F2D2 natural archive integrity
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f2d2-integrity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r37f2d2-integrity
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.3 beautifulsoup4==4.13.4
      - name: Audit official HTTPS checksum references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r37f2d2_integrity.py
          python research/seti/r37f2d2_integrity.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f2d2-integrity
          path: runtime/r37f2d2/result.json
          if-no-files-found: warn
