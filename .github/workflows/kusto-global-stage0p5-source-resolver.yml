name: KUSTO Global Stage0.5 Source Resolver

on:
  push:
    branches:
      - feature/kusto-global-blind-anomaly-hunt-v1
    paths:
      - 'workspace/kusto_global_stage0p5_source_resolver.py'
      - 'data/cousteau/JANUS-KUSTO-GLOBAL-NCEI-MULTISURVEY-OPPORTUNITY-MAP-RECEIPT-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-global-stage0p5-source-resolver.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve frozen Stage0 regions without reading depth
        run: python workspace/kusto_global_stage0p5_source_resolver.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-global-stage0p5-source-resolver-v1
          path: workspace/kusto_global_anomaly_out/JANUS-KUSTO-GLOBAL-STAGE0P5-SOURCE-RESOLVER-RUN-2026-09-23-v1.0.json
          retention-days: 30
