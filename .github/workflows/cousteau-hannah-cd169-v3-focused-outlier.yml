name: Cousteau Hannah CD169 V3 Focused Outlier
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_cd169_v3_focused_outlier_diagnostic.py'
      - '.github/workflows/cousteau-hannah-cd169-v3-focused-outlier.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NetCDF reader
        run: python -m pip install --disable-pip-version-check netCDF4 numpy
      - name: Syntax check
        run: python -m py_compile workspace/hannah_cd169_v3_focused_outlier_diagnostic.py
      - name: Run focused source/outlier diagnostic
        id: diag
        continue-on-error: true
        run: |
          python workspace/hannah_cd169_v3_focused_outlier_diagnostic.py \
            --output out/JANUS-HANNAH-CD169-V3-FOCUSED-OUTLIER-RUN-001.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hannah-cd169-v3-focused-outlier
          path: out/JANUS-HANNAH-CD169-V3-FOCUSED-OUTLIER-RUN-001.json
          if-no-files-found: error
          retention-days: 7
      - name: Propagate execution failure after receipt preservation
        if: steps.diag.outcome == 'failure'
        run: exit 1
