name: JANUS SETI R20C verified spectral tile cache
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r20c-verified-cache.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verified cache restore and cold range replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r20c_verified_tile_cache.py
          python research/seti/r20c_verified_tile_cache.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r20c-receipt
          path: runtime/r20c/result.json
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r20c/result.json"))
          assert d["source_tiles"]==48 and d["cold_replayed_tiles"]==8
          assert d["identical_patches"]==256 and d["mismatches"]==0
          assert len(d["negative_controls"])==5 and not d["production_adoption"]
          PY
