name: KUSTO Unseen EX2105 File Metadata Probe

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_unseen_ex2105_file_metadata_probe.py'
      - '.github/workflows/kusto-unseen-ex2105-file-metadata-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Probe EX2105 file-level metadata without depth
        run: python workspace/kusto_unseen_ex2105_file_metadata_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-unseen-ex2105-file-metadata-probe-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-UNSEEN-EX2105-FILE-METADATA-PROBE-2026-09-23-v1.0.json
          retention-days: 30
