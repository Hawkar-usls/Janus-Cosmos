name: JANUS R35B grand benchmark weak-signal ablation
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r35b-grand-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test exact templates and JUXTAPOSE
        run: |
          python -m py_compile research/seti/r35b_grand_benchmark.py
          python research/seti/r35b_grand_benchmark.py selftest
      - name: Freeze day-disjoint archive metadata
        run: python research/seti/r35b_grand_benchmark.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r35b-manifest
          path: runtime/r35b/manifest.json
      - name: Calibrate and compare nine arms on identical archive backgrounds
        run: python research/seti/r35b_grand_benchmark.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r35b-results
          path: |
            runtime/r35b/*.json
            runtime/r35b/common_inputs/*.npz
          if-no-files-found: warn
      - name: Validate paired counts and no promotion
        run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r35b/result.json"))
          assert len(d["modes"])==9
          assert all(v["positives"]==v["controls"]==512 for v in d["modes"].values())
          assert d["juxtapose"]["decision_equivalent"] and d["juxtapose"]["early_checks"]<=d["juxtapose"]["exhaustive_checks"]
          assert d["gate"]==("PASS_DEVELOPMENT" if all(d["gate_checks"].values()) else "HOLD")
          assert not d["production_adoption"]
          PY
