name: JANUS SETI R28B adaptive router and native BLISS
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r28b-router.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    outputs:
      inputs_id: ${{ steps.inputs.outputs.artifact-id }}
      inputs_digest: ${{ steps.inputs.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile research/seti/r28b_router.py
      - name: Freeze metadata-only targets
        run: python research/seti/r28b_router.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r28b-manifest
          path: runtime/r28b/manifest.json
      - name: Fresh frozen adaptive routing comparison
        run: python research/seti/r28b_router.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r28b-result
          path: runtime/r28b/
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r28b/result.json"))
          assert d["samples"]==1024 and len(d["modes"])==9 and d["selftests"]["tree_witness"]=="PASS"
          assert all(v["positives"]==512 and v["controls"]==512 for v in d["modes"].values())
          assert all(v["positives"]==128 for v in d["leak_challenge"].values())
          assert not d["production_adoption"]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: inputs
        with:
          name: janus-seti-r28b-common-inputs
          path: runtime/r28b/bliss_inputs/
  bliss:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build pinned native BLISS CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libhdf5-dev libfftw3-dev liblz4-dev pkg-config
          python -m pip install numpy==2.2.6 h5py==3.13.0 requests==2.32.3 matplotlib==3.10.1
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps 'git+https://github.com/UCBerkeleySETI/bliss.git@2b98afe960f13ee7e467aca499576d87ee7502f5'
      - name: Restore exact common input artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ID: ${{ needs.paired.outputs.inputs_id }}
          INPUT_DIGEST: ${{ needs.paired.outputs.inputs_digest }}
        run: |
          python - <<'PY'
          import os,hashlib,io,zipfile,pathlib,requests
          aid=os.environ["INPUT_ID"];assert aid.isdigit()
          u="https://api.github.com/repos/Hawkar-usls/Janus-Cosmos/actions/artifacts/"+aid+"/zip"
          r=requests.get(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"},timeout=60);r.raise_for_status()
          b=r.content;assert len(b)<64*1024**2
          assert hashlib.sha256(b).hexdigest()==os.environ["INPUT_DIGEST"].removeprefix("sha256:")
          p=pathlib.Path("runtime/r28b/bliss_inputs");p.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert len(z.namelist())==6 and sum(i.file_size for i in z.infolist())<64*1024**2
              for i in z.infolist():
                  assert pathlib.PurePosixPath(i.filename).name==i.filename and i.filename.endswith(".npz")
                  (p/i.filename).write_bytes(z.read(i))
          PY
      - name: Compare native BLISS on identical inputs
        run: python research/seti/r28b_bliss.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r28b-bliss-result
          path: runtime/r28b_bliss/
