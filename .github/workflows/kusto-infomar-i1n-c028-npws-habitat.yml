name: KUSTO INFOMAR I1N C028 NPWS Habitat Point Query

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_infomar_i1n_c028_npws_habitat_query.py'
      - 'data/cousteau/JANUS-KUSTO-INFOMAR-I1N-C028-NPWS-REEF-AND-COMMUNITY-POINT-QUERY-PREREG-2026-09-25-v1.0.json'
      - '.github/workflows/kusto-infomar-i1n-c028-npws-habitat.yml'
  workflow_dispatch:

jobs:
  i1n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Query exact C028 point against official NPWS reef/community GIS
        run: python workspace/kusto_infomar_i1n_c028_npws_habitat_query.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-infomar-i1n-c028-npws-habitat-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INFOMAR-I1N-C028-NPWS-REEF-AND-COMMUNITY-POINT-QUERY-RUN-2026-09-25-v1.0.json
          retention-days: 30
