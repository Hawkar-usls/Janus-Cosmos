      - name: Common-support ablations, legacy baselines, paired gates and tentative winner lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r41_consolidation.py tournament
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41-progress-99-summary
          path: |
            runtime/r41/progress/99-summary.json
            runtime/r41/winner_lock.json
            runtime/r41/result.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41-consolidation
          path: |
            runtime/r41/*.json
            runtime/r41/*.npz
            runtime/r41/progress/*.json
          retention-days: 90
          if-no-files-found: warn
