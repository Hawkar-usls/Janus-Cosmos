name: Cousteau Hannah CD169 PRISM CDF Metadata
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_cd169_prism_cdf_metadata_probe.py'
      - '.github/workflows/cousteau-hannah-cd169-prism-cdf-metadata.yml'
permissions:
  contents: read
jobs:
  cdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check netCDF4==1.7.4
      - name: Probe archived PRISM NetCDF metadata after S2
        id: probe
        continue-on-error: true
        run: |
          python workspace/hannah_cd169_prism_cdf_metadata_probe.py \
            --output out/JANUS-HANNAH-CD169-PRISM-CDF-METADATA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hannah-cd169-prism-cdf-metadata
          path: out/JANUS-HANNAH-CD169-PRISM-CDF-METADATA.json
          if-no-files-found: error
          retention-days: 7
      - name: Propagate probe failure
        if: steps.probe.outcome == 'failure'
        run: exit 1
