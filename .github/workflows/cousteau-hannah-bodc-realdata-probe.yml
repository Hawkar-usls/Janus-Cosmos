name: Cousteau Hannah BODC Realdata Probe

on:
  push:
    branches:
      - janus-echo-cousteau
    paths:
      - 'workspace/hannah_bodc_realdata_probe.py'
      - '.github/workflows/cousteau-hannah-bodc-realdata-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realdata-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SFTP client dependency
        run: python -m pip install --disable-pip-version-check paramiko==3.5.1

      - name: Prepare anonymous BODC SFTP credential without storing it in repository
        shell: bash
        run: |
          set +x
          AUTHOR_EMAIL="$(git log -1 --pretty=%ae)"
          if [ -z "$AUTHOR_EMAIL" ]; then
            echo 'Unable to derive anonymous FTP password email from commit metadata' >&2
            exit 1
          fi
          echo "BODC_ANON_PASSWORD=$AUTHOR_EMAIL" >> "$GITHUB_ENV"

      - name: Run real BODC edge mnemonic probe
        run: |
          python workspace/hannah_bodc_realdata_probe.py \
            --output out/JANUS-HANNAH-BODC-REALDATA-PROBE.json

      - name: Upload derived receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hannah-bodc-realdata-probe
          path: out/JANUS-HANNAH-BODC-REALDATA-PROBE.json
          if-no-files-found: error
          retention-days: 7
