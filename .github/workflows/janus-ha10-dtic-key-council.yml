name: JANUS HA10 DTIC Key Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_ha10_dtic_key_council.py"
      - ".github/workflows/janus-ha10-dtic-key-council.yml"

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask JANUS about DTIC key
        run: python workspace/janus_ha10_dtic_key_council.py
      - name: Show answer
        run: cat data/cousteau/JANUS-HA10-DTIC-KEY-COUNCIL-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-ha10-dtic-key-council-${{ github.run_number }}
          path: data/cousteau/JANUS-HA10-DTIC-KEY-COUNCIL-RUN-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-HA10-DTIC-KEY-COUNCIL-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze DTIC key council ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
