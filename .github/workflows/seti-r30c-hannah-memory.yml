name: JANUS SETI R30C HANNAH RFI memory
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r30c-hannah-memory.yml']
  workflow_dispatch:
    inputs:
      parent_artifact:
        description: 'Optional prior trusted HANNAH library artifact ID'
        required: false
        type: string
      parent_sha256:
        description: 'Exact SHA256 of the prior artifact ZIP'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-seti-r30c-hannah-${{ github.ref }}
  cancel-in-progress: false
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      HANNAH_PARENT_ARTIFACT: ${{ inputs.parent_artifact }}
      HANNAH_PARENT_SHA256: ${{ inputs.parent_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test memory firewall
        run: |
          python -m py_compile research/seti/r30c_hannah_memory.py
          python research/seti/r30c_hannah_memory.py selftest
      - name: Populate immutable measured archive passports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/r30c_hannah_memory.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r30c-hannah-memory
          path: runtime/r30c/*.json
          if-no-files-found: warn
      - name: Check ledger contract, not scientific origin performance
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('runtime/r30c')
          d=json.loads((p/'result.json').read_text());l=json.loads((p/'library.json').read_text())
          assert len({r['id'] for r in l['entries']})==len(l['entries'])==d['delta']['total']
          assert d['verified_rfi']+d['rfi_candidates']+d['unknown_without_recurrence']==len(l['entries'])
          assert d['library_sha256']==hashlib.sha256((p/'library.json').read_bytes()).hexdigest()
          assert d['replay']['added']==0 and d['observations']>=96
          assert all(v=='PASS' for v in d['selftests'].values())
          assert not d['production_adoption']
          PY
