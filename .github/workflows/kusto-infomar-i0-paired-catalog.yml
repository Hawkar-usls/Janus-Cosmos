name: KUSTO INFOMAR I0 Paired Catalog Inventory

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_infomar_i0_paired_catalog_inventory.py'
      - 'data/cousteau/JANUS-KUSTO-INFOMAR-I0-PAIRED-CATALOG-INVENTORY-PREREG-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-infomar-i0-paired-catalog.yml'
  workflow_dispatch:

jobs:
  i0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Inventory INFOMAR bathymetry/backscatter catalogs without pixels
        run: python workspace/kusto_infomar_i0_paired_catalog_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-infomar-i0-paired-catalog-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INFOMAR-I0-PAIRED-CATALOG-INVENTORY-RUN-2026-09-24-v1.0.json
          retention-days: 30
