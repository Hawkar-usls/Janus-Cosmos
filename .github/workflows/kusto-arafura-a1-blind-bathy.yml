name: KUSTO Arafura A1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_arafura_a1_blind_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-MONEY-SHOAL-UNSEEN-V2-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0-PREREG-METHOD-INVARIANT-CORRECTION-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0E-EXACT-MEMBER-SELECTION-FREEZE-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0G-MONEY-SHOAL-REPRESENTATION-BRIDGE-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-arafura-a1-blind-bathy.yml'
  workflow_dispatch:

jobs:
  a1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio pyproj
      - name: Run Arafura Money Shoal bathymetry-only blind discovery
        run: python workspace/kusto_arafura_a1_blind_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-arafura-a1-blind-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ARAFURA-A1-MONEY-SHOAL-BLIND-BATHYMETRY-RUN-2026-09-24-v1.0.json
          retention-days: 30
