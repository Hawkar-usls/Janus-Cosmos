name: JANUS SETI R7 Parkes alternate index and spectral replay
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-parkes-api-r7.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parkes:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c61a1
        with:
          python-version: '3.11'
      - name: Install pinned archive readers
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Resolve Parkes source and replay matched observations
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m py_compile research/seti/r7_parkes_api.py
          python research/seti/r7_parkes_api.py
      - name: Preserve archive queries and spectra
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r7-parkes
          path: runtime/
          retention-days: 90
