name: JANUS Numeric Sky Mirror R0M — mirrored values and sky checks
on:
  push:
    branches: [research/numeric-sky-audit-r0-mirror-20261121]
    paths: ['.github/workflows/janus-numeric-sky-mirror-r0m.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-numeric-sky-mirror-r0m
  cancel-in-progress: false
jobs:
  frozen-source-mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate frozen mirror contract and code
        run: |
          python -m py_compile research/numeric_sky/scan_numeric_sources.py research/numeric_sky/aggregate_verify.py research/numeric_sky/mirror_numbers_and_sky.py
          python -m json.tool research/numeric_sky/mirror_protocol.json >/dev/null
          python -m pip install requests==2.32.3
      - name: Verify all original scan shard artifacts are present before mirroring
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            cnt="$(gh api "repos/Hawkar-usls/Janus-Cosmos/actions/runs/44833839206/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("numsky-shard-"))] | length')"
            echo "Archived source shards: $cnt/8"
            if [ "$cnt" -eq 8 ]; then exit 0; fi
            sleep 30
          done
          echo "::error::Original R0 source artifacts incomplete; no mirror result may be claimed"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          run-id: 44833839206
          github-token: ${{ github.token }}
          pattern: numsky-shard-*
          path: runtime/numeric_sky/collected
          merge-multiple: false
      - name: Create all numeric mirrors and celestial reflections, then compare catalog controls
        run: |
          python research/numeric_sky/mirror_numbers_and_sky.py
          test -s runtime/numeric_sky/mirror/mirrored_numeric_all.jsonl.gz
          test -s runtime/numeric_sky/mirror/mirror_summary.json
          test -s runtime/numeric_sky/mirror/mirrored_explicit_icrs_directions.json
      - name: Publish numeric mirror and sky audit with evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-numeric-sky-r0m-mirror-results
          path: runtime/numeric_sky/mirror/
          retention-days: 90
          if-no-files-found: warn
