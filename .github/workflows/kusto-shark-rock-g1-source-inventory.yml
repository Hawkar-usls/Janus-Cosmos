name: KUSTO Shark Rock G1 Source Inventory

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_shark_rock_g1_source_inventory.py'
      - 'data/cousteau/JANUS-KUSTO-SHARK-ROCK-BLIND-TILE-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-shark-rock-g1-source-inventory.yml'
  workflow_dispatch:

jobs:
  g1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests shapely
      - name: Run blind G1 source inventory
        run: python workspace/kusto_shark_rock_g1_source_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-shark-rock-g1-source-inventory-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SHARK-ROCK-G1-SOURCE-INVENTORY-RUN-2026-09-23-v1.0.json
          retention-days: 30
