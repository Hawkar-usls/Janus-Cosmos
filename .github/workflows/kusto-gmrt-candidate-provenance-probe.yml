name: KUSTO GMRT Candidate Provenance Probe
on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_gmrt_candidate_provenance_probe.py'
      - '.github/workflows/kusto-gmrt-candidate-provenance-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - run: python workspace/kusto_gmrt_candidate_provenance_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-gmrt-candidate-provenance-probe-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-GMRT-CAND002003-PROVENANCE-PROBE-2026-09-22-v1.0.json
          retention-days: 30
