name: Cousteau Hannah CD169 Native Nav Recovery
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/hannah_cd169_native_nav_recovery.py'
      - '.github/workflows/cousteau-hannah-cd169-native-nav-recovery.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover native PRISM navigation and cable target slice
        run: |
          python workspace/hannah_cd169_native_nav_recovery.py \
            --output out/JANUS-HANNAH-CD169-NATIVE-PRISM-NAV-RECOVERY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hannah-cd169-native-prism-nav-recovery
          path: out/JANUS-HANNAH-CD169-NATIVE-PRISM-NAV-RECOVERY.json
          if-no-files-found: error
          retention-days: 7
