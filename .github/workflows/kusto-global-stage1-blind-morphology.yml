name: KUSTO Global Stage1 Blind Morphology

on:
  push:
    branches:
      - feature/kusto-global-blind-anomaly-hunt-v1
    paths:
      - 'workspace/kusto_global_stage1_blind_morphology.py'
      - '.github/workflows/kusto-global-stage1-blind-morphology.yml'
  workflow_dispatch:

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests shapely
      - name: Run frozen global Stage1 blind morphology
        run: python workspace/kusto_global_stage1_blind_morphology.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-global-stage1-blind-morphology-v1
          path: workspace/kusto_global_anomaly_out/JANUS-KUSTO-GLOBAL-STAGE1-BLIND-MORPHOLOGY-RUN-2026-09-23-v1.0.json
          retention-days: 30
