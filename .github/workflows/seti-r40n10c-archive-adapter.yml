        run: python research/seti/r40n10c_archive_adapter.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r40n10c-progress-99-summary
          path: |
            runtime/r40n10c/result.json
            runtime/r40n10c/progress/99-summary.json
