name: JANUS COSMOS R42A7B1b — older public archive index and ON/OFF discovery
on:
  push:
    branches: [research/seti-r42a7b-independent-onoff-20261121]
    paths: ['.github/workflows/seti-r42a7b-archive-early.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and install parser
        run: |
          python -m py_compile research/seti/r42a7b_archive_early_probe.py research/seti/r42a7b_archive_discovery.py
          python -m pip install requests==2.32.3 beautifulsoup4==4.13.4
      - name: Discover explicitly labelled ON/OFF from older public archive and audit raw link availability
        run: |
          PYTHONPATH=research/seti python research/seti/r42a7b_archive_early_probe.py
          test -s runtime/r42a7b_early/early_archive_provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r42a7b-older-archive-onoff-index-only
          path: runtime/r42a7b_early/
          if-no-files-found: warn
          retention-days: 90
