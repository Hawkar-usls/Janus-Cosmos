name: JANUS H10N1 Generic Blind Morphology

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_h10n1_generic_blind_morphology.py"
      - ".github/workflows/janus-h10n1-generic-blind-morphology.yml"

permissions:
  contents: write

jobs:
  morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests numpy netCDF4
      - name: Run frozen generic blind morphology metrics
        run: python workspace/janus_h10n1_generic_blind_morphology.py
      - name: Show result
        run: cat data/cousteau/JANUS-H10N1-GENERIC-BLIND-MORPHOLOGY-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-h10n1-generic-blind-morphology-${{ github.run_number }}
          path: data/cousteau/JANUS-H10N1-GENERIC-BLIND-MORPHOLOGY-RUN-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze morphology receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-H10N1-GENERIC-BLIND-MORPHOLOGY-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze generic blind H10N1 morphology ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
