name: JANUS R42A3B full historical score contract
on:
  push:
    branches: [research/seti-r42a3b-full-score-contract-20261120]
    paths: ['.github/workflows/seti-r42a3b-full-score-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r42a3b-full-score-contract
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Authenticate and reuse completed pilot group 01
        run: |
          python -m py_compile research/seti/r42a3b_full_score_contract.py
          PYTHONPATH=research/seti python -c 'import r42a3b_full_score_contract as m; m.prepare()'
          test -s runtime/r42a3b/preparation.json
          test -s runtime/r42a3b/group-01.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a3b-progress-01
          path: runtime/r42a3b/group-01.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 02 of 11
        run: |
          PYTHONPATH=research/seti python -c 'import r42a3b_full_score_contract as m; m.group(1)'
          test -s runtime/r42a3b/group-02.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a3b-progress-02
          path: runtime/r42a3b/group-02.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 03 of 11
        run: |
          PYTHONPATH=research/seti python -c 'import r42a3b_full_score_contract as m; m.group(2)'
          test -s runtime/r42a3b/group-03.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42a3b-progress-03
          path: runtime/r42a3b/group-03.json
          if-no-files-found: error
          retention-days: 90
      - name: Replay group 04 of 11
        run: |
          PYTHONPATH=research/seti python -c 'import r42a3b_full_score_contract as m; m.group(3)'
          test -s runtime/r42a3b/group-04.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
