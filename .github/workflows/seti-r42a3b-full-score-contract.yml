      - name: Verify all 3168 rows and calculate fixed-routing descriptive DET
        run: |
          PYTHONPATH=research/seti python -c 'import r42a3b_full_score_contract as m; m.summarize()'
          test -s runtime/r42a3b/result.json
          test -s runtime/r42a3b/curve.json
          test "$(find runtime/r42a3b -name '*-scores.npz' -type f | wc -l)" -eq 22
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
