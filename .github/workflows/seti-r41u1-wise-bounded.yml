name: JANUS R41U1 bounded native AllWISE
on:
  push:
    branches: [research/seti-r41u1-wise-bounded-20261120]
    paths: ['.github/workflows/seti-r41u1-wise-bounded.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r41u1-wise-bounded
  cancel-in-progress: false
jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.3 astropy==7.0.2 astroquery==0.4.10
      - name: Restore authenticated Gaia and JPL catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r41u1_wise_bounded.py
          python research/seti/r41u1_wise_bounded.py prepare
      - name: Bounded native WISE target A
        run: python research/seti/r41u1_wise_bounded.py bounded A
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1-target-A
          path: |
            runtime/r41u1/ir-A.json
            runtime/r41u1/A-*
          retention-days: 90
          if-no-files-found: error
      - name: Bounded native WISE target B
        run: python research/seti/r41u1_wise_bounded.py bounded B
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1-target-B
          path: |
            runtime/r41u1/ir-B.json
            runtime/r41u1/B-*
          retention-days: 90
          if-no-files-found: error
      - name: Bounded native WISE target C
        run: python research/seti/r41u1_wise_bounded.py bounded C
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1-target-C
          path: |
            runtime/r41u1/ir-C.json
            runtime/r41u1/C-*
          retention-days: 90
          if-no-files-found: error
      - name: Bounded native WISE target D
        run: python research/seti/r41u1_wise_bounded.py bounded D
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1-target-D
          path: |
            runtime/r41u1/ir-D.json
            runtime/r41u1/D-*
          retention-days: 90
          if-no-files-found: error
      - name: Bounded native WISE target E
        run: python research/seti/r41u1_wise_bounded.py bounded E
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1-target-E
          path: |
            runtime/r41u1/ir-E.json
            runtime/r41u1/E-*
          retention-days: 90
          if-no-files-found: error
      - name: Bounded native WISE target F
        run: python research/seti/r41u1_wise_bounded.py bounded F
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1-target-F
          path: |
            runtime/r41u1/ir-F.json
            runtime/r41u1/F-*
          retention-days: 90
          if-no-files-found: error
      - name: Bounded native WISE target G
        run: python research/seti/r41u1_wise_bounded.py bounded G
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r41u1-target-G
          path: |
            runtime/r41u1/ir-G.json
            runtime/r41u1/G-*
          retention-days: 90
          if-no-files-found: error
      - name: Summarize native image intake
        run: python research/seti/r41u1_wise_bounded.py summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r41u1-wise-bounded
          path: runtime/r41u1/
          retention-days: 90
          if-no-files-found: warn
