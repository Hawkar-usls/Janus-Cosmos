name: JANUS R42A7 — non-destructive RFI shadow feature qualification
on:
  push:
    branches: [research/seti-r42a7-nondestructive-rfi-20261121]
    paths:
      - '.github/workflows/seti-r42a7-shadow-rfi.yml'
      - 'research/seti/r42a7_shadow_rfi.py'
      - 'research/seti/r42a7_shadow_rfi_protocol.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r42a7-shadow-rfi
  cancel-in-progress: false
jobs:
  shadow-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Freeze source and independent feature specification
        run: |
          python -m py_compile research/seti/r42a7_shadow_rfi.py research/seti/r42a6_signal_preservation.py research/seti/r42a5_combined_score.py
          python -m json.tool research/seti/r42a7_shadow_rfi_protocol.json >/dev/null
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 requests==2.32.3
      - name: Unit test pure feature extraction without injected labels
        run: |
          PYTHONPATH=research/seti python - <<'PY'
          import numpy as np
          import r42a7_shadow_rfi as m
          v=np.random.default_rng(424207).normal(0,1,(4,16,128)).astype('float32')
          p=np.tile(np.arange(16)+56,(4,1))
          x=m.features(v,p)
          assert x.shape==(4,8) and np.isfinite(x).all()
          assert (x[:,0]>=0).all() and (x[:,1]>=0).all()
          print("R42A7_PURE_FEATURE_TEST_PASS")
          PY
      - name: Authenticate frozen FIT source spectra and calculate six-fold shadow review with NO audit access
        run: |
          python research/seti/r42a7_shadow_rfi.py
          test -s runtime/r42a7/fit_only_cv.json
          test -s runtime/r42a7/frozen_feature_receipt.json
          test -s runtime/r42a7/fit_model_lock.json
          test -s runtime/r42a7/result.json
      - name: Preserve complete R42A7 shadow evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r42a7-nondestructive-fit-only-shadow-rfi
          path: runtime/r42a7/
          if-no-files-found: warn
          retention-days: 90
