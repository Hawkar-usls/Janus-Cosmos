name: KUSTO CAND003 All66 Raw Beam Geometry

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_all66_raw_beam_geometry.py'
      - '.github/workflows/kusto-cand003-all66-raw-beam-geometry.yml'
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan all preserved raw EM12 beam geometry without reading depth
        run: python workspace/kusto_cand003_all66_raw_beam_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-all66-raw-beam-geometry-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-DOMINANT-CELLS-ALL66-RAW-BEAM-GEOMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
