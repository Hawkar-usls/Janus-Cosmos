name: KUSTO CAND003 Three-Year Triple-Lineage Gate

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_three_year_triple_lineage.py'
      - '.github/workflows/kusto-cand003-three-year-triple-lineage.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests
      - name: Run frozen CAND003 2005-to-2008 triple-lineage comparison
        run: mkdir -p workspace/kusto_cross_survey_out && python workspace/kusto_cand003_three_year_triple_lineage.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-three-year-triple-lineage-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-THREE-YEAR-TRIPLE-LINEAGE-RUN-2026-09-22-v1.0.json
          retention-days: 30
