name: JANUS BAS H10N1 Primary Recovery

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_bas_h10n1_primary_recovery.py"
      - ".github/workflows/janus-bas-h10n1-primary-recovery.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: pip install requests numpy netCDF4
      - name: Recover authoritative BAS grid and frozen H10N1 cell only
        run: python workspace/janus_bas_h10n1_primary_recovery.py
      - name: Show recovery receipt
        run: cat data/cousteau/JANUS-BAS-H10N1-PRIMARY-RECOVERY-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-bas-h10n1-primary-recovery-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-BAS-H10N1-PRIMARY-RECOVERY-RUN-001-2026-08-22-v1.0.json
            workspace/bas_h10n1_recovery/
          retention-days: 90
      - name: Freeze recovery receipt only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-BAS-H10N1-PRIMARY-RECOVERY-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze BAS H10N1 primary recovery ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
