name: KUSTO Lake Sammamish LS1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_lake_sammamish_ls1_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-LAKE-SAMMAMISH-UNSEEN-DUALCHANNEL-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-LAKE-SAMMAMISH-LS0-SOURCE-BINDING-RECEIPT-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-lake-sammamish-ls1-bathy.yml'
  workflow_dispatch:

jobs:
  ls1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run Lake Sammamish unseen blind bathymetry
        run: python workspace/kusto_lake_sammamish_ls1_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-lake-sammamish-ls1-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-LAKE-SAMMAMISH-LS1-BLIND-BATHYMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
