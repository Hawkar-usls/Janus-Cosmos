name: KUSTO CAND003 Line31 Leave-Two-Cell Influence

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cand003_line31_leave_two_cell_influence.py'
      - '.github/workflows/kusto-cand003-line31-leave-two-cell-influence.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy shapely requests
      - name: Run frozen exhaustive leave-two-cell-out influence diagnostic
        run: python workspace/kusto_cand003_line31_leave_two_cell_influence.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-line31-leave-two-cell-influence-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-LINE31-LEAVE-TWO-CELL-OUT-INFLUENCE-RUN-2026-09-23-v1.0.json
          retention-days: 30
