name: KUSTO Lake Sammamish LS0 Source

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_lake_sammamish_ls0_source.py'
      - 'data/cousteau/JANUS-KUSTO-LAKE-SAMMAMISH-UNSEEN-DUALCHANNEL-PREREG-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-lake-sammamish-ls0-source.yml'
  workflow_dispatch:

jobs:
  ls0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve Lake Sammamish source files without raster reads
        run: python workspace/kusto_lake_sammamish_ls0_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-lake-sammamish-ls0-source-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-LAKE-SAMMAMISH-LS0-SOURCE-BINDING-RUN-2026-09-23-v1.0.json
          retention-days: 30
