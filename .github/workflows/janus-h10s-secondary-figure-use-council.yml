name: JANUS H10S Secondary Figure Use Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_h10s_secondary_figure_use_council.py"
      - ".github/workflows/janus-h10s-secondary-figure-use-council.yml"

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask JANUS whether secondary figure may be spatially used
        run: python workspace/janus_h10s_secondary_figure_use_council.py
      - name: Show council answer
        run: cat data/cousteau/JANUS-H10S-SECONDARY-FIGURE-USE-COUNCIL-RUN-008-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-h10s-secondary-figure-use-council-${{ github.run_number }}
          path: data/cousteau/JANUS-H10S-SECONDARY-FIGURE-USE-COUNCIL-RUN-008-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze council result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-H10S-SECONDARY-FIGURE-USE-COUNCIL-RUN-008-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze H10S secondary figure use council ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
