name: LOVE EDEM GlobSed Exact Cell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workspace/love_edem_globsed_exact_cell.py"
      - ".github/workflows/love-edem-globsed-exact-cell.yml"

permissions:
  contents: write

jobs:
  globsed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests numpy netCDF4
      - name: Resolve exact sediment cell
        run: python workspace/love_edem_globsed_exact_cell.py
      - name: Validate frozen point
        run: |
          python - <<'PY'
          import json
          p='data/love/JANUS-LOVE-EDEM-GLOBSED-EXACT-CELL-RUN-001-RECEIPT.json'
          r=json.load(open(p))
          assert r['frozen_point']['no_recenter'] is True
          assert r['status'] in ('GLOBSED_CELL_RESOLVED','GLOBSED_CELL_UNRESOLVED')
          PY
      - name: Persist receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/JANUS-LOVE-EDEM-GLOBSED-EXACT-CELL-RUN-001-RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "cosmos: freeze LOVE EDEM GlobSed exact cell run 1"
          git pull --rebase origin main
          git push
