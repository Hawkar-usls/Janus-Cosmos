name: LOVE EDEM Catalog Crosscheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/love-edem-catalog-verify.yml"
      - "workspace/love_edem_catalog_verify.py"
      - "data/love/LOVE-EDEM-CATALOG-CROSSCHECK-GATE-v1.json"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install legacy astronomy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astropy>=7.0" "astroquery>=0.4.11"

      - name: Query real catalogs
        run: |
          python workspace/love_edem_catalog_verify.py \
            --output data/love/LOVE-EDEM-CATALOG-CROSSCHECK-v1-LATEST-RECEIPT.json

      - name: Show receipt
        run: |
          cat data/love/LOVE-EDEM-CATALOG-CROSSCHECK-v1-LATEST-RECEIPT.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: love-edem-catalog-crosscheck-${{ github.run_number }}
          path: data/love/LOVE-EDEM-CATALOG-CROSSCHECK-v1-LATEST-RECEIPT.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist receipt to Janus-Cosmos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love/LOVE-EDEM-CATALOG-CROSSCHECK-v1-LATEST-RECEIPT.json
          git commit -m "cosmos: freeze LOVE EDEM catalog crosscheck run ${{ github.run_number }}"
          git push
