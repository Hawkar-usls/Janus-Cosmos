name: KUSTO Arafura A0C Current Route

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_arafura_a0c_current_route.py'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-MONEY-SHOAL-UNSEEN-V2-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0-PREREG-METHOD-INVARIANT-CORRECTION-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-arafura-a0c-current-route.yml'
  workflow_dispatch:

jobs:
  a0c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve current Arafura numeric source routes without raster values
        run: python workspace/kusto_arafura_a0c_current_route.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-arafura-a0c-current-route-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ARAFURA-A0C-CURRENT-ROUTE-RUN-2026-09-24-v1.0.json
          retention-days: 30
