name: JANUS Cosmos ALI Video Physics Claim Audit Gate

on:
  pull_request:
    paths:
      - 'workspace/janus_cosmos_simulation_audit.py'
      - 'tests/test_cosmos_simulation_audit.py'
      - 'data/cosmos/**'
      - 'docs/ALI_SIMULATION_HYPOTHESIS_AUDIT.md'
      - 'docs/SCIENTIFIC_BOUNDARIES.md'
      - '.github/workflows/cosmos-video-physics-gate.yml'
  push:
    branches: [main]
    paths:
      - 'workspace/janus_cosmos_simulation_audit.py'
      - 'tests/test_cosmos_simulation_audit.py'
      - 'data/cosmos/**'
      - 'docs/ALI_SIMULATION_HYPOTHESIS_AUDIT.md'
      - 'docs/SCIENTIFIC_BOUNDARIES.md'
      - '.github/workflows/cosmos-video-physics-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-hypothesis-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run whole JANUS BHB plus video-physics test family
        run: |
          set -euo pipefail
          python -m py_compile workspace/janus_cosmos_simulation_audit.py tests/test_cosmos_simulation_audit.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Byte-exact replay against frozen ALI video-topic audit receipt
        run: |
          set -euo pipefail
          mkdir -p artifacts/cosmos
          python workspace/janus_cosmos_simulation_audit.py --batch data/cosmos/COSMOS-ALI-SIMULATION-CLAIMS-2026-10-18.json > artifacts/cosmos/COSMOS-ALI-SIMULATION-AUDIT-RESULT.json
          cmp artifacts/cosmos/COSMOS-ALI-SIMULATION-AUDIT-RESULT.json data/cosmos/COSMOS-ALI-SIMULATION-AUDIT-RESULT-2026-10-18.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-cosmos-ali-simulation-hypothesis-audit
          path: artifacts/cosmos/*.json
          retention-days: 30
          if-no-files-found: error
