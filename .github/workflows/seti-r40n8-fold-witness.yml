name: JANUS R40N8 continuity and disjoint temporal fold witness
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r40n8-fold-witness.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r40n8-fold-witness
  cancel-in-progress: false
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 requests==2.32.3 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0 hdf5plugin==5.0.0 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Audit WISE loss and two vetoes; fit temporal folds, lock and test fresh days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r40n8_fold_witness.py
          /usr/bin/time -v python research/seti/r40n8_fold_witness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r40n8-fold-witness
          path: |
            runtime/r40n8/*.json
            runtime/r40n8/*.npz
          retention-days: 90
          if-no-files-found: warn
