name: KUSTO CAND003 Internal EM12 Product Crosscheck
on:
  push:
    branches: [feature/kusto-cross-survey-validation-v1]
    paths:
      - 'workspace/kusto_cand003_internal_em12_product_crosscheck.py'
      - '.github/workflows/kusto-cand003-internal-em12-product-crosscheck.yml'
  workflow_dispatch:
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check numpy scipy
      - run: python workspace/kusto_cand003_internal_em12_product_crosscheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cand003-internal-em12-product-crosscheck-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CAND003-CD169-EM12-INTERNAL-PRODUCT-CROSSCHECK-RUN-2026-09-22-v1.0.json
          retention-days: 30
