name: JANUS R36F1 registered hybrid exact integration
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r36f1-hybrid.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Reproduce original registered hybrid and compare exact twin lanes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r36f1_hybrid.py
          lscpu
          /usr/bin/time -v python research/seti/r36f1_hybrid.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r36f1-hybrid-exact
          path: runtime/r36f1/*.json
          if-no-files-found: warn
