name: KUSTO India Coordinate G0 Bathymetry
on:
  push:
    branches: [feature/kusto-global-groundtruth-calibration-v1]
    paths:
      - 'workspace/kusto_india_170710306_832693611_g0.py'
      - 'data/cousteau/JANUS-KUSTO-INDIA-170710306N-832693611E-G0-PREREG-2026-09-25-v1.0.json'
      - '.github/workflows/kusto-india-170710306-832693611-g0.yml'
  workflow_dispatch:
jobs:
  g0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check requests rasterio numpy pyproj
      - run: python workspace/kusto_india_170710306_832693611_g0.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-india-170710306-832693611-g0-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INDIA-170710306N-832693611E-G0-RUN-2026-09-25-v1.0.json
          retention-days: 30
