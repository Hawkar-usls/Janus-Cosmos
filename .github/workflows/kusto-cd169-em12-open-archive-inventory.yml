name: KUSTO CD169 EM12 Open Archive Inventory

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cd169_em12_open_archive_inventory.py'
      - '.github/workflows/kusto-cd169-em12-open-archive-inventory.yml'
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory open CD169 EM12 archive
        run: python workspace/kusto_cd169_em12_open_archive_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cd169-em12-open-archive-inventory-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CD169-EM12-OPEN-ARCHIVE-PROCESSING-INVENTORY-2026-09-22-v1.0.json
          retention-days: 30
