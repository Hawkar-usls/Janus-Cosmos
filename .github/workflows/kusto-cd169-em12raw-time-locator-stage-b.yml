name: KUSTO CD169 EM12 Raw Time Locator Stage B

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cd169_em12raw_time_locator_stage_b.py'
      - '.github/workflows/kusto-cd169-em12raw-time-locator-stage-b.yml'
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan raw EM12 datagram headers only
        run: python workspace/kusto_cd169_em12raw_time_locator_stage_b.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cd169-em12raw-time-locator-stage-b-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CD169-EM12RAW-ZIP-TIME-LOCATOR-STAGE-B-2026-09-23-v1.0.json
          retention-days: 30
