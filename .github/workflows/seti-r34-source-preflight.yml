name: JANUS R34 independent source metadata scout
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r34-source-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-r34-metadata
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Official archive index only, no spectral access
        run: |
          mkdir -p runtime/r34pre
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request,urllib.parse
          p=pathlib.Path("research/seti/r34_independent_exam_protocol.json")
          s=json.loads(p.read_bytes());out=pathlib.Path("runtime/r34pre")
          result=[]
          for i,target in enumerate(s["source_metadata_preflight"]["query_targets"]):
              url="https://seti.berkeley.edu/opendata/api/query-files?"+urllib.parse.urlencode({"target":target,"telescope":"Parkes","file-type":"HDF5"})
              row={"target":target,"url":url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"JANUS COSMOS R34 metadata research"}),timeout=45) as r:
                      assert urllib.parse.urlparse(r.url).hostname=="seti.berkeley.edu"
                      raw=r.read(32*1024*1024+1);assert len(raw)<=32*1024*1024
                  d=json.loads(raw)
                  rr=d if isinstance(d,list) else next(d[k] for k in ("data","files","results") if isinstance(d.get(k),list))
                  (out/f"index-{i}.json").write_bytes(raw)
                  names=[]
                  for v in rr:
                      u=v.get("url","") if isinstance(v,dict) else ""
                      if not isinstance(u,str):continue
                      n=urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit("/",1)[-1])
                      if "31268146" in n: names.append({"name":n,"url":u,"mjd":v.get("mjd")})
                  row.update(count=len(rr),matching_names=len(names),sha256=hashlib.sha256(raw).hexdigest(),matches=names[:100])
              except Exception as e:row.update(error=str(e)[:300])
              result.append(row)
          d={"status":"METADATA_ONLY_NOT_QUALIFIED","no_spectral_access":True,"exam_started":False,"queries":result,"protocol_sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/"result.json").write_text(json.dumps(d,indent=2)+"\n")
          print("R34_PREFLIGHT",json.dumps({**d,"queries":[{k:v for k,v in q.items() if k!="matches"} for q in result]}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-r34-source-metadata
          path: runtime/r34pre/*.json
