name: KUSTO INFOMAR I1B Preoutcome Batch Probe

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_infomar_i1b_preoutcome_batch_probe.py'
      - 'data/cousteau/JANUS-KUSTO-INFOMAR-I1A-PREOUTCOME-FIRST-FIVE-BATCH-FREEZE-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-infomar-i1b-preoutcome-batch-probe.yml'
  workflow_dispatch:

jobs:
  i1b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Verify preoutcome first-five membership and probe prospective routes
        run: python workspace/kusto_infomar_i1b_preoutcome_batch_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-infomar-i1b-preoutcome-batch-probe-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-INFOMAR-I1B-PREOUTCOME-BATCH-METADATA-AND-TRANSPORT-RECEIPT-2026-09-24-v1.0.json
          retention-days: 30
