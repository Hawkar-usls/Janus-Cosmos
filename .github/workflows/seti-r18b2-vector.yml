name: JANUS SETI R18B2 vector Undina Keymaster and residual Markov
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r18b2-vector.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze fresh archive target manifest
        run: |
          python -m py_compile research/seti/juxtapose_undina_r18b2_vector.py
          python research/seti/juxtapose_undina_r18b2_vector.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r18b2-manifest
          path: runtime/r18b2/manifest.json
      - name: Calibrate and run prospective vector waves
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/seti/juxtapose_undina_r18b2_vector.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r18b2-result
          path: runtime/r18b2/
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r18b2/result.json"))
          assert d["samples"]==1024 and d["decision_mismatches"]==0
          assert len(d["totals"])==11 and not d["production_adoption"]
          PY
