name: JANUS COSMOS — Зеркало Януса, точка 3773
on:
  push:
    branches: [research/zerkalo-janusa-collapse-r2-20261121]
    paths: ['.github/workflows/zerkalo-janusa-singularity-3773.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-zerkalo-janusa-singularity-3773
  cancel-in-progress: false
jobs:
  singularity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      META_COMMIT: b835d7f0e8f74cba33b40f73598c2b1aaf8271a6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate frozen collapse algorithm
        run: |
          python -m py_compile research/numeric_sky/collapse_3773.py
          python -m json.tool research/numeric_sky/singularity_3773_protocol.json >/dev/null
      - name: Prepare independent catalog clients
        run: python -m pip install requests==2.32.3 astropy==7.1.1 astroquery==0.4.11
      - name: Derive ordinal 3773 from source atlas and query SIMBAD Gaia and WISE with 256 controls
        run: |
          python research/numeric_sky/collapse_3773.py
          test -s runtime/numeric_sky/singularity/3773_coordinate.json
          test -s runtime/numeric_sky/singularity/3773_catalog_checks.json
          test -s runtime/numeric_sky/singularity/3773_result.json
      - name: Save complete research source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-zerkalo-3773-singularity-independent-catalog
          path: runtime/numeric_sky/singularity/
          if-no-files-found: warn
          retention-days: 90
