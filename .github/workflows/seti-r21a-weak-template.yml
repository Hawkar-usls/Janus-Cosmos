name: JANUS SETI R21A weak smooth and robust template exam
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r21a-weak-template.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze metadata-only fresh targets
        run: |
          python -m py_compile research/seti/r21a_weak_template.py
          python research/seti/r21a_weak_template.py freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-r21a-manifest
          path: runtime/r21a/manifest.json
      - name: Fresh weak-signal detector comparison
        run: python research/seti/r21a_weak_template.py scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r21a-result
          path: runtime/r21a/
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r21a/result.json"))
          assert d["samples"]==1024 and d["selftest"]["status"]=="PASS"
          assert d["selftest"]["brute_force_cases"]==12 and len(d["modes"])==8
          assert all(x["positives"]==512 and x["controls"]==512 for x in d["modes"].values())
          assert not d["production_adoption"]
          PY
