name: KUSTO Maui Puunua M1 Blind Bathymetry

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_maui_puunua_m1_bathy.py'
      - 'data/cousteau/JANUS-KUSTO-MAUI-PUUNUA-UNSEEN-DUALCHANNEL-V2-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-MAUI-PUUNUA-M0-SOURCE-BINDING-RECEIPT-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-maui-puunua-m1-bathy.yml'
  workflow_dispatch:

jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run Maui Puunoa v2 blind bathymetry
        run: python workspace/kusto_maui_puunua_m1_bathy.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-maui-puunua-m1-bathy-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-MAUI-PUUNUA-M1-BLIND-BATHYMETRY-RUN-2026-09-23-v1.0.json
          retention-days: 30
