name: JANUS Echo Cousteau 5D Deep Analysis

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/janus-echo-cousteau-5d-deep-analysis.yml"
      - "workspace/cousteau_5d_tranception_reverse.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-5D-TRANCEPTION-REVERSE-DEEP-ANALYSIS-PREREG-2026-08-21-v1.0.json"

permissions:
  contents: write

jobs:
  deep-analysis-5d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 5D Tranception Reverse engine
        run: |
          python workspace/cousteau_5d_tranception_reverse.py

      - name: Show summary
        run: |
          cat data/cousteau/JANUS-ECHO-COUSTEAU-5D-TRANCEPTION-REVERSE-DEEP-ANALYSIS-RUN-001-2026-08-21-v1.0-SUMMARY.json

      - name: Upload event-sourced reasoning artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-5d-deep-analysis-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-ECHO-COUSTEAU-5D-TRANCEPTION-REVERSE-DEEP-ANALYSIS-RUN-001-2026-08-21-v1.0.json
            data/cousteau/JANUS-ECHO-COUSTEAU-5D-TRANCEPTION-REVERSE-DEEP-ANALYSIS-RUN-001-2026-08-21-v1.0-SUMMARY.json
            data/cousteau/5d_stream/run-001/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist immutable run products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-5D-TRANCEPTION-REVERSE-DEEP-ANALYSIS-RUN-001-2026-08-21-v1.0.json
          git add data/cousteau/JANUS-ECHO-COUSTEAU-5D-TRANCEPTION-REVERSE-DEEP-ANALYSIS-RUN-001-2026-08-21-v1.0-SUMMARY.json
          git add data/cousteau/5d_stream/run-001/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Cousteau: freeze 5D deep-analysis run ${{ github.run_number }}"
          git push origin HEAD:janus-echo-cousteau
