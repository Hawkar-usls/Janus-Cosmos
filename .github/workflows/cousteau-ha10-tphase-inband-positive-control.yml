name: Cousteau HA10 T-Phase In-Band Positive Control

on:
  workflow_dispatch:
  pull_request:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ha10-tphase-inband-positive-control.yml"
      - "workspace/cousteau_ha10_tphase_inband_positive_control.py"
      - "tests/test_cousteau_ha10_tphase_inband_positive_control.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-TPHASE-INBAND-ARRIVAL-POSITIVE-CONTROL-PROTOCOL-2026-08-22-v1.0.json"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-CONFIRMATORY-WINDOW-FREEZE-2026-08-22-v1.0.json"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json"
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-ha10-tphase-inband-positive-control.yml"
      - "workspace/cousteau_ha10_tphase_inband_positive_control.py"
      - "tests/test_cousteau_ha10_tphase_inband_positive_control.py"
      - "data/cousteau/JANUS-ECHO-COUSTEAU-HA10-TPHASE-INBAND-ARRIVAL-POSITIVE-CONTROL-PROTOCOL-2026-08-22-v1.0.json"

permissions:
  contents: read

jobs:
  inband-positive-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify preregistration and immutable upstream receipts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-TPHASE-INBAND-ARRIVAL-POSITIVE-CONTROL-PROTOCOL-2026-08-22-v1.0.json)" = "d1800856076fc46cb04b5461bb1f2bf786af532e"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-CONFIRMATORY-WINDOW-FREEZE-2026-08-22-v1.0.json)" = "f5fbc4b155d514094867b88bb33af71d3b458f76"
          test "$(git hash-object data/cousteau/JANUS-ECHO-COUSTEAU-HA10-RESPONSE-CORRECTED-CONFIRMATORY-RUN-001-2026-08-22-v1.0.json)" = "eb8b48fb7f043160c057f9df6264a781412ed854"
          test "$(git hash-object workspace/cousteau_ha10_tphase_inband_positive_control.py)" = "244169a1331a16529e2a963585a5659dae109c66"
          test "$(git hash-object tests/test_cousteau_ha10_tphase_inband_positive_control.py)" = "f87c058aa247c81c904aaf56764d12e106eb314e"
          echo "INBAND_CONTROL_PREREGISTRATION_BINDING=PASS"
          echo "FROZEN_119HZ_NEGATIVE_BINDING=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen direct scientific stack and record full environment
        shell: bash
        run: |
          set -euo pipefail
          # Run 32567886788 stopped in unit tests before any waveform-control
          # execution because NumPy 2.5 removed np.trapz. Pinning 2.3.5 preserves
          # the preregistered trapezoidal integral without inspecting control data.
          python -m pip install \
            "numpy==2.3.5" \
            "scipy==1.18.1" \
            "requests==2.34.2" \
            "obspy==1.5.0"
          mkdir -p artifacts/ha10-inband-positive-control
          python -m pip freeze | sort > artifacts/ha10-inband-positive-control/python-environment.txt
          python - <<'PY'
          import numpy, scipy, requests, obspy
          assert numpy.__version__ == '2.3.5'
          assert scipy.__version__ == '1.18.1'
          assert requests.__version__ == '2.34.2'
          assert obspy.__version__ == '1.5.0'
          print('DIRECT_DEPENDENCY_PIN=PASS')
          PY

      - name: Compile and test fail-closed control semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile workspace/cousteau_ha10_tphase_inband_positive_control.py tests/test_cousteau_ha10_tphase_inband_positive_control.py
          python -m unittest tests.test_cousteau_ha10_tphase_inband_positive_control -v

      - name: Execute preregistered in-band control
        shell: bash
        run: |
          set -euo pipefail
          python workspace/cousteau_ha10_tphase_inband_positive_control.py \
            --output "artifacts/ha10-inband-positive-control/run-${GITHUB_RUN_ID}.json"

      - name: Validate claim ceiling and immutable-negative firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path('artifacts/ha10-inband-positive-control').glob('run-*.json'))
          assert len(paths) == 1, paths
          receipt = json.loads(paths[0].read_text(encoding='utf-8'))
          assert receipt['status'] == 'CONTROL_RUN_COMPLETE'
          assert receipt['authority_delta_for_119hz'] == 0
          assert receipt['frozen_119hz_negative_result_immutable'] is True
          assert receipt['frozen_119hz_verdict'] == 'NEGATIVE_CONFIRMATORY_HA10_PUBLIC_SLICE'
          assert receipt['target_identity'] == 'UNCONFIRMED'
          assert receipt['target_evidence_delta'] == 'NONE_FROM_POSITIVE_CONTROL'
          assert receipt['processing_contract']['119hz_or_117_121hz_bins_used'] is False
          assert receipt['processing_contract']['whole_spectrum_peak_search_performed'] is False
          assert receipt['processing_contract']['best_subband_selection_performed'] is False
          assert receipt['summary']['verdict'] in {
              'PASS_HA10_INBAND_TPHASE_PIPELINE_CONTROL',
              'FAIL_HA10_INBAND_TPHASE_PIPELINE_CONTROL',
              'BLOCKED_POSITIVE_CONTROL_DATA_ACCESS_OR_RESPONSE',
          }
          print('POSITIVE_CONTROL_RECEIPT_VALID=TRUE')
          print('POSITIVE_CONTROL_AUTHORITY_DELTA_FOR_119HZ=0')
          print('FROZEN_119HZ_NEGATIVE_RESULT_IMMUTABLE=TRUE')
          print('CONTROL_VERDICT=' + receipt['summary']['verdict'])
          PY

      - name: Prove workflow has no repository writeback
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- data/cousteau
          echo "SOURCE_WRITEBACK=FALSE"

      - name: Upload positive-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cousteau-ha10-inband-positive-control-${{ github.run_id }}
          path: artifacts/ha10-inband-positive-control/
          if-no-files-found: error
          retention-days: 30
