name: KUSTO Arafura A2 Paired Support V2

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_arafura_a2_support_domain_v2.py'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-MONEY-SHOAL-UNSEEN-V2-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0-PREREG-METHOD-INVARIANT-CORRECTION-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0E-EXACT-MEMBER-SELECTION-FREEZE-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0G-MONEY-SHOAL-REPRESENTATION-BRIDGE-RECEIPT-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A1-MONEY-SHOAL-BLIND-BATHYMETRY-RECEIPT-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A2-UNCHANGED-V2-IMPLEMENTATION-FREEZE-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-arafura-a2-support-domain-v2.yml'
  workflow_dispatch:

jobs:
  a2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio pyproj
      - name: Run Arafura Money Shoal held-out backscatter replay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_arafura_a2_support_domain_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-arafura-a2-support-domain-v2
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ARAFURA-A2-MONEY-SHOAL-UNSEEN-BACKSCATTER-V2-RUN-2026-09-24-v1.0.json
          retention-days: 30
