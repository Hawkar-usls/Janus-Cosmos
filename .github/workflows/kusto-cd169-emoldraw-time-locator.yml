name: KUSTO CD169 EMOLDRAW Time Locator

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_cd169_emoldraw_time_locator.py'
      - '.github/workflows/kusto-cd169-emoldraw-time-locator.yml'
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate frozen interval using MBF_EMOLDRAW timestamp layout
        run: python workspace/kusto_cd169_emoldraw_time_locator.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cd169-emoldraw-time-locator-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-CD169-EM12RAW-EMOLDRAW-TIME-LOCATOR-2026-09-23-v1.0.json
          retention-days: 30
