name: KUSTO Elizabeth Middleton EMR0E Support Mask

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_elizabeth_middleton_emr0e_support_mask.py'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EMR0C-EXACT-SOURCE-SELECTION-FREEZE-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ELIZABETH-MIDDLETON-EMR0D-RASTER-HEADER-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-elizabeth-middleton-emr0e-support-mask.yml'
  workflow_dispatch:

jobs:
  emr0e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio
      - name: Audit discovery bathymetry valid-support mask only
        run: python workspace/kusto_elizabeth_middleton_emr0e_support_mask.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-elizabeth-middleton-emr0e-support-mask-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ELIZABETH-MIDDLETON-EMR0E-DISCOVERY-SUPPORT-MASK-AUDIT-2026-09-24-v1.0.json
          retention-days: 30
