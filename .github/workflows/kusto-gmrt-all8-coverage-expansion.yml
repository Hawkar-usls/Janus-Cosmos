name: KUSTO GMRT All8 Coverage Expansion
on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_gmrt_all8_coverage_expansion.py'
      - '.github/workflows/kusto-gmrt-all8-coverage-expansion.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests pyshp shapely
      - run: python workspace/kusto_gmrt_all8_coverage_expansion.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-gmrt-all8-coverage-expansion-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-GMRT-ALL8-INDEPENDENT-COVERAGE-EXPANSION-RUN-2026-09-22-v1.0.json
          retention-days: 30
