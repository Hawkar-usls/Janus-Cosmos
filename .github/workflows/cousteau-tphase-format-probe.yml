name: Cousteau T-phase Format Probe

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-tphase-format-probe.yml"
      - "workspace/cousteau_tphase_format_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python workspace/cousteau_tphase_format_probe.py
      - name: Show compact format
        run: |
          python - <<'PY'
          import json
          p='data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-INNER-CATALOG-FORMAT-PROBE-2026-08-21-v1.0.json'
          d=json.load(open(p,encoding='utf-8'))
          for m in d['members']:
              print('\nMEMBER',m['name'],'lines',m.get('line_count'))
              print('\n'.join(m.get('first_40_lines',[])[:12]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-tphase-format-probe-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-INNER-CATALOG-FORMAT-PROBE-2026-08-21-v1.0.json
          retention-days: 30
      - name: Freeze format probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-EA-TPHASE-INNER-CATALOG-FORMAT-PROBE-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze T-phase inner catalog format probe ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
