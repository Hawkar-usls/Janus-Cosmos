name: JANUS SIT2E-B - July September Power Calibration
on:
  push:
    branches:
      - research/janus-sit2eb-integrity-calibration-20261122
    paths:
      - 'research/seti/janus_sit2eb_power_calibration.py'
      - '.github/workflows/janus-sit2eb-power-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-power-dev-cal:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout research only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned decoding dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.1.0 requests==2.32.3 beautifulsoup4==4.12.3
      - name: Verify only July and September are eligible for decoded radio power
        run: |
          python -m py_compile research/seti/janus_sit2eb_power_calibration.py
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('research/seti/janus_sit2eb_power_calibration.py')
          s=ast.parse(p.read_text())
          vals={x.targets[0].id:ast.literal_eval(x.value) for x in s.body if isinstance(x,ast.Assign) and len(x.targets)==1 and isinstance(x.targets[0],ast.Name) and x.targets[0].id in ('DATES','SOURCE_SHA')}
          assert vals['DATES']==('2025-07-31','2025-09-12')
          assert len(vals['SOURCE_SHA'])==4
          assert all('Oct' not in x for x in vals['SOURCE_SHA'])
          print('OCTOBER_DATA_ACCESS_NOT_CONFIGURED')
          PY
      - name: Decode authentic power and score same-panel JANUS vs full matched filters
        run: python research/seti/janus_sit2eb_power_calibration.py --calibrate
      - name: Preserve result JSON only, never radio power
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-sit2eb-july-september-power-calibration
          path: runtime/sit2eb_power/sit2eb_calibration.json
          if-no-files-found: warn
          retention-days: 90
