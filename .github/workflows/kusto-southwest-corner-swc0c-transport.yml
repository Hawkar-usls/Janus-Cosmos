name: KUSTO South-west Corner SWC0C Transport Route

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_southwest_corner_swc0c_ckan_transport.py'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0-UNCHANGED-V2-PREREG-2026-09-24-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0-SOURCE-PAIR-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-southwest-corner-swc0c-transport.yml'
  workflow_dispatch:

jobs:
  swc0c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve current CKAN transport routes without reading bodies
        run: python workspace/kusto_southwest_corner_swc0c_ckan_transport.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-southwest-corner-swc0c-transport-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0C-CKAN-TRANSPORT-ROUTE-RUN-2026-09-24-v1.0.json
          retention-days: 30
