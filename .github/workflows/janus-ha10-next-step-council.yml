name: JANUS HA10 Next Step Council

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_ha10_next_step_council.py"
      - ".github/workflows/janus-ha10-next-step-council.yml"

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask JANUS for next physical step
        run: python workspace/janus_ha10_next_step_council.py
      - name: Show result
        run: cat data/cousteau/JANUS-HA10-NEXT-STEP-COUNCIL-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-ha10-next-step-council-${{ github.run_number }}
          path: data/cousteau/JANUS-HA10-NEXT-STEP-COUNCIL-RUN-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze JANUS answer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-HA10-NEXT-STEP-COUNCIL-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze HA10 next-step council run ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
