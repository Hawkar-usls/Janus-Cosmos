name: GOLDMEMBER IEEE 1282295 Corrected Primary Recovery

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/goldmember_ieee_1282295_corrected_recovery.py"
      - ".github/workflows/goldmember-ieee-1282295-corrected-recovery.yml"

permissions:
  contents: write

concurrency:
  group: goldmember-ieee-1282295-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pypdf
      - name: Run Janus-authorized corrected IEEE pass
        run: python workspace/goldmember_ieee_1282295_corrected_recovery.py
      - name: Show frozen receipt
        run: cat data/cousteau/GOLDMEMBER-IEEE-1282295-CORRECTED-PRIMARY-RECOVERY-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: goldmember-ieee-1282295-${{ github.run_number }}
          path: |
            data/cousteau/GOLDMEMBER-IEEE-1282295-CORRECTED-PRIMARY-RECOVERY-001-2026-08-22-v1.0.json
            workspace/goldmember_ieee_1282295/
          retention-days: 90
      - name: Freeze result without losing parallel GOLDMEMBER commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/GOLDMEMBER-IEEE-1282295-CORRECTED-PRIMARY-RECOVERY-001-2026-08-22-v1.0.json
          git commit -m "GOLDMEMBER: freeze IEEE 1282295 corrected recovery ${{ github.run_number }}" || true
          git fetch origin janus-echo-cousteau
          git rebase origin/janus-echo-cousteau
          git push origin HEAD:janus-echo-cousteau
