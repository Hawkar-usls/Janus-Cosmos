name: KUSTO South-west Corner SWC0 Source Binding

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_southwest_corner_swc0_source.py'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0-UNCHANGED-V2-PREREG-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-southwest-corner-swc0-source.yml'
  workflow_dispatch:

jobs:
  swc0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve current South-west Corner source resources without raster values
        run: python workspace/kusto_southwest_corner_swc0_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-southwest-corner-swc0-source-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0-SOURCE-BINDING-RUN-2026-09-24-v1.0.json
          retention-days: 30
