name: KUSTO Shark Rock G3 Truth Score

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_shark_rock_g3_truth_score.py'
      - 'data/cousteau/JANUS-KUSTO-SHARK-ROCK-G3-TRUTH-UNLOCK-SCORING-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-SHARK-ROCK-G2B-BLIND-MULTISURVEY-MORPHOLOGY-RECEIPT-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-shark-rock-g3-truth-score.yml'
  workflow_dispatch:

jobs:
  g3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Score frozen blind candidates against ROV truth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_shark_rock_g3_truth_score.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-shark-rock-g3-truth-score-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SHARK-ROCK-G3-TRUTH-UNLOCK-SCORING-RUN-2026-09-23-v1.0.json
          retention-days: 30
