name: Cousteau Author MAR Data Set S1 Probe

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - ".github/workflows/cousteau-author-mar-dataset-s1-probe.yml"
      - "workspace/cousteau_author_mar_dataset_s1_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Probe author MAR Data Set S1
        id: probe
        continue-on-error: true
        run: python workspace/cousteau_author_mar_dataset_s1_probe.py
      - name: Show result
        if: always()
        run: |
          test -f data/cousteau/JANUS-ECHO-COUSTEAU-AUTHOR-MAR-DATASET-S1-ACQUISITION-PROBE-2026-08-21-v1.0.json
          cat data/cousteau/JANUS-ECHO-COUSTEAU-AUTHOR-MAR-DATASET-S1-ACQUISITION-PROBE-2026-08-21-v1.0.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cousteau-author-mar-dataset-s1-probe-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-AUTHOR-MAR-DATASET-S1-ACQUISITION-PROBE-2026-08-21-v1.0.json
          if-no-files-found: error
          retention-days: 90
      - name: Freeze probe, including BLOCKED state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-AUTHOR-MAR-DATASET-S1-ACQUISITION-PROBE-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze author MAR Data Set S1 probe ${{ github.run_number }}" || true
          for i in 1 2 3; do
            git pull --rebase origin janus-echo-cousteau || true
            git push origin HEAD:janus-echo-cousteau && exit 0
            sleep 2
          done
          exit 1
