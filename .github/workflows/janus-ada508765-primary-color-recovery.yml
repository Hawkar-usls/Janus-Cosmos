name: JANUS ADA508765 Primary Color Recovery

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_ada508765_primary_color_recovery.py"
      - ".github/workflows/janus-ada508765-primary-color-recovery.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pypdf pymupdf
      - name: Recover and validate primary color copy
        run: python workspace/janus_ada508765_primary_color_recovery.py
      - name: Show recovery receipt
        run: cat data/cousteau/JANUS-ADA508765-PRIMARY-COLOR-COPY-RECOVERY-RUN-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-ada508765-primary-color-recovery-${{ github.run_number }}
          path: |
            data/cousteau/JANUS-ADA508765-PRIMARY-COLOR-COPY-RECOVERY-RUN-001-2026-08-22-v1.0.json
            workspace/ada508765_recovery/*.pdf
          retention-days: 90
      - name: Freeze receipt only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ADA508765-PRIMARY-COLOR-COPY-RECOVERY-RUN-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze ADA508765 primary color recovery ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
