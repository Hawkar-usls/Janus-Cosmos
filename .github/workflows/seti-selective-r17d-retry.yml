name: JANUS SETI R17D selective hybrid corrected replay
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-selective-r17d-retry.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Run corrected selective replay
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python research/seti/r15d_r16d_r17d_replay.py r17d
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r17d-corrected
          path: runtime/r17d/*.json
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/r17d/result.json"))
          assert not d["production_adoption"]
          assert d["test_selective"]["n"]==1024
          assert d["test_selective"]["detected"]>=d["test_classical"]["detected"]
          PY
