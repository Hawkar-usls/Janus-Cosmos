name: LOVE EDEM Center Object Probe

on:
  push:
    branches:
      - research/love-g1-007-multieye-v2
    paths:
      - 'janus_cosmos/love_edem_center_object_probe.py'
      - '.github/workflows/love-edem-center-object-probe.yml'
  pull_request:
    branches:
      - research/luci-only-v1
    paths:
      - 'janus_cosmos/love_edem_center_object_probe.py'
      - '.github/workflows/love-edem-center-object-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  center-object-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install astronomy stack
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile probe
        run: python -m py_compile janus_cosmos/love_edem_center_object_probe.py
      - name: Query exact 30 arcsec centers
        run: >-
          python -u -m janus_cosmos.love_edem_center_object_probe
          --radius-arcsec 30
          --output results/love_edem_center_object_probe/result.json
      - name: Enforce interpretation firewall
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results/love_edem_center_object_probe/result.json', encoding='utf-8'))
          assert d['firewall']['catalog_proximity_is_not_identity'] is True
          assert d['firewall']['edem_identity_confirmed'] is False
          assert d['firewall']['love_candidate_activated'] is False
          for label,t in d['targets'].items():
              print('\n', label)
              print(json.dumps(t['summary'], indent=2, default=str))
              print('WISE crossmatches=', json.dumps(t['nearest_allwise_crossmatches'], indent=2, default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: love-edem-center-object-probe
          path: results/love_edem_center_object_probe/
          if-no-files-found: error
          retention-days: 14
