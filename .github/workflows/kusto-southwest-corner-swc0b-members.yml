name: KUSTO South-west Corner SWC0B Member Inventory

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_southwest_corner_swc0b_member_inventory.py'
      - 'data/cousteau/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0-SOURCE-PAIR-RECEIPT-2026-09-24-v1.0.json'
      - '.github/workflows/kusto-southwest-corner-swc0b-members.yml'
  workflow_dispatch:

jobs:
  swc0b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Inventory source archive members without pixel decode
        run: python workspace/kusto_southwest_corner_swc0b_member_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-southwest-corner-swc0b-members-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-SOUTHWEST-CORNER-SWC0B-ARCHIVE-MEMBER-INVENTORY-2026-09-24-v1.0.json
          retention-days: 30
