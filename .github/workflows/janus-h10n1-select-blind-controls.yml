name: JANUS H10N1 Select Blind Controls

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/janus_h10n1_select_blind_controls.py"
      - ".github/workflows/janus-h10n1-select-blind-controls.yml"

permissions:
  contents: write

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests numpy netCDF4
      - name: Select controls without morphology inputs
        run: python workspace/janus_h10n1_select_blind_controls.py
      - name: Show control manifest
        run: cat data/cousteau/JANUS-H10N1-BLIND-CONTROL-MANIFEST-001-2026-08-22-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-h10n1-blind-controls-${{ github.run_number }}
          path: data/cousteau/JANUS-H10N1-BLIND-CONTROL-MANIFEST-001-2026-08-22-v1.0.json
          retention-days: 90
      - name: Freeze manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-H10N1-BLIND-CONTROL-MANIFEST-001-2026-08-22-v1.0.json
          git commit -m "JANUS: freeze H10N1 blind control manifest ${{ github.run_number }}" || true
          git push origin HEAD:janus-echo-cousteau
