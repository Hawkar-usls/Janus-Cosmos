name: KUSTO Arafura A0B WFS Route

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_arafura_a0b_wfs_route.py'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-MONEY-SHOAL-UNSEEN-V2-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-ARAFURA-A0-BATHYMETRY-ROUTE-REPAIR-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-arafura-a0b-wfs-route.yml'
  workflow_dispatch:

jobs:
  a0b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Resolve current AusSeabed numeric bathymetry route
        run: python workspace/kusto_arafura_a0b_wfs_route.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-arafura-a0b-wfs-route-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-ARAFURA-A0B-AUSSEABED-WFS-ROUTE-RUN-2026-09-23-v1.0.json
          retention-days: 30
