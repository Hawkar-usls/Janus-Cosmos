name: JANUS Cousteau Argo Strict Seasonal and Spatial Baselines
on:
  push:
    branches:
      - experiment/cousteau-southern-ocean-20261109
    paths:
      - workspace/cousteau_argo_strong_baselines.py
      - workspace/cousteau_argo_external_holdout.py
      - .github/workflows/cousteau-argo-strong-baselines.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cousteau-argo-strong-baselines
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Fixed-comparator synthetic self-test
        run: python workspace/cousteau_argo_strong_baselines.py --self-test
      - name: Compare strong baselines against real frozen Argo90 source
        run: |
          python workspace/cousteau_argo_strong_baselines.py \
            --observations data/cousteau/southern_ocean/argo_observations/argo_core_D_QC1_run-42585534673.json \
            --receipt data/cousteau/southern_ocean/argo_runs/run-42585534673.json \
            --out data/cousteau/southern_ocean/argo_strong_baselines/argo90-strong-controls-run-42585534673.json
      - name: Preserve all comparator metrics regardless of branch update
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argo90-strong-baselines-${{ github.run_id }}
          path: data/cousteau/southern_ocean/argo_strong_baselines/*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Archive immutable results with collision retries
        shell: bash
        run: |
          set -euo pipefail
          f=data/cousteau/southern_ocean/argo_strong_baselines/argo90-strong-controls-run-42585534673.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cousteau: archive falsification versus spatial/seasonal controls [skip ci]"
          for retry in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
