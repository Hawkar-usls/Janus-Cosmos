name: KUSTO Lake Sammamish LS2 Unseen Backscatter

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_lake_sammamish_ls2_backscatter.py'
      - 'data/cousteau/JANUS-KUSTO-LAKE-SAMMAMISH-UNSEEN-DUALCHANNEL-PREREG-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-LAKE-SAMMAMISH-LS0-SOURCE-BINDING-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-LAKE-SAMMAMISH-LS1-BLIND-BATHYMETRY-RECEIPT-2026-09-23-v1.0.json'
      - 'data/cousteau/JANUS-KUSTO-LAKE-SAMMAMISH-LS2-BACKSCATTER-IMPLEMENTATION-ADDENDUM-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-lake-sammamish-ls2-backscatter.yml'
  workflow_dispatch:

jobs:
  ls2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scipy requests rasterio affine
      - name: Run preregistered unseen backscatter replay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workspace/kusto_lake_sammamish_ls2_backscatter.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-lake-sammamish-ls2-unseen-backscatter-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-LAKE-SAMMAMISH-LS2-UNSEEN-BACKSCATTER-REPLAY-RUN-2026-09-23-v1.0.json
          retention-days: 30
