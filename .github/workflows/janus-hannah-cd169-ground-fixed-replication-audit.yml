name: JANUS Hannah CD169 Ground Fixed Replication Audit
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - 'workspace/janus_hannah_cd169_ground_fixed_replication_audit.py'
      - 'data/cousteau/JANUS-HANNAH-CD169-GROUND-FIXED-REPLICATION-RECEIPT-2026-08-26-v1.0.json'
      - '.github/workflows/janus-hannah-cd169-ground-fixed-replication-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit frozen receipt
        run: |
          python workspace/janus_hannah_cd169_ground_fixed_replication_audit.py \
            data/cousteau/JANUS-HANNAH-CD169-GROUND-FIXED-REPLICATION-RECEIPT-2026-08-26-v1.0.json \
            --output out/JANUS-HANNAH-CD169-GROUND-FIXED-REPLICATION-AUDIT-RUN-001-2026-08-26-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-hannah-cd169-ground-fixed-replication-audit
          path: out/JANUS-HANNAH-CD169-GROUND-FIXED-REPLICATION-AUDIT-RUN-001-2026-08-26-v1.0.json
          retention-days: 7
