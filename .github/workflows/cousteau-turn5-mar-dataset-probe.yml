name: Cousteau Turn 5 MAR Dataset Probe

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/cousteau_turn5_mar_dataset_probe.py"
      - ".github/workflows/cousteau-turn5-mar-dataset-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Probe authoritative MAR support dataset
        run: python workspace/cousteau_turn5_mar_dataset_probe.py
      - name: Show probe
        run: cat data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-MAR-SUPPORT-DATA-PROBE-2026-08-21-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-turn5-mar-probe-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-MAR-SUPPORT-DATA-PROBE-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-MAR-SUPPORT-DATA-PROBE-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze Turn 5 MAR dataset probe ${{ github.run_number }}" || true
          git pull --rebase origin janus-echo-cousteau || true
          git push origin HEAD:janus-echo-cousteau
