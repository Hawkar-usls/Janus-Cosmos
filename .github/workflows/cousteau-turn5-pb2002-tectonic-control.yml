name: Cousteau Turn 5 PB2002 Tectonic Control

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/cousteau_turn5_pb2002_tectonic_control.py"
      - ".github/workflows/cousteau-turn5-pb2002-tectonic-control.yml"

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pandas numpy scikit-learn
      - name: Run independent tectonic control with frozen diagnostics
        shell: bash
        run: |
          set +e
          python workspace/cousteau_turn5_pb2002_tectonic_control.py > /tmp/cousteau_turn5.log 2>&1
          code=$?
          cat /tmp/cousteau_turn5.log
          if [ ! -f data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json ]; then
            python - "$code" <<'PY'
          import json,sys,pathlib,datetime
          code=int(sys.argv[1]); log=pathlib.Path('/tmp/cousteau_turn5.log').read_text(errors='replace')
          out={'artifact_id':'JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0','created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'BLOCKED_TECHNICAL_EXECUTION','exit_code':code,'log_tail':log[-12000:],'scientific_interpretation':'BLOCKER_ONLY__NOT_TECTONIC_RESULT'}
          p=pathlib.Path('data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
          fi
          exit 0
      - name: Show result
        run: cat data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-turn5-pb2002-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze run or blocker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze Turn 5 PB2002 tectonic control diagnostic ${{ github.run_number }}" || true
          git pull --rebase origin janus-echo-cousteau || true
          git push origin HEAD:janus-echo-cousteau
