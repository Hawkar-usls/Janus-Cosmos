name: Cousteau Turn 5 PB2002 Tectonic Control

on:
  workflow_dispatch:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - "workspace/cousteau_turn5_pb2002_tectonic_control.py"
      - ".github/workflows/cousteau-turn5-pb2002-tectonic-control.yml"

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus-echo-cousteau
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pandas numpy scikit-learn
      - name: Run independent tectonic control
        run: python workspace/cousteau_turn5_pb2002_tectonic_control.py
      - name: Show summary
        run: |
          python - <<'PY'
          import json
          p='data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json'
          d=json.load(open(p,encoding='utf-8'))
          print(json.dumps({'count_reconciliation':d['count_reconciliation'],'tectonic_distance_control':d['tectonic_distance_control'],'scientific_interpretation':d['scientific_interpretation']},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cousteau-turn5-pb2002-${{ github.run_number }}
          path: data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json
          retention-days: 90
      - name: Freeze run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cousteau/JANUS-ECHO-COUSTEAU-TURN5-PB2002-TECTONIC-CONTROL-2026-08-21-v1.0.json
          git commit -m "Cousteau: freeze Turn 5 PB2002 tectonic control ${{ github.run_number }}" || true
          git pull --rebase origin janus-echo-cousteau || true
          git push origin HEAD:janus-echo-cousteau
