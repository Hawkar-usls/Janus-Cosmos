name: Cousteau Hannah CD169 Space Format Freeze
on:
  push:
    branches: [janus-echo-cousteau]
    paths:
      - '.github/workflows/cousteau-hannah-cd169-space-format-freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read BODC-supplied TOBI README format only
        run: |
          python workspace/hannah_bodc_9406_format_probe.py \
            --output out/JANUS-HANNAH-CD169-TOBI-FORMAT-FOR-SPACE-REPLAY.json
      - name: Print frozen format excerpt only
        run: |
          python - <<'PY'
          import json
          p='out/JANUS-HANNAH-CD169-TOBI-FORMAT-FOR-SPACE-REPLAY.json'
          d=json.load(open(p,encoding='utf-8'))
          print('README_SHA256', d.get('readme_sha256'))
          for x in d.get('format_lines',[]):
              print(f"README_LINE_{x['line']:03d}: {x['text']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-cd169-tobi-format-for-space-replay
          path: out/JANUS-HANNAH-CD169-TOBI-FORMAT-FOR-SPACE-REPLAY.json
          retention-days: 7
