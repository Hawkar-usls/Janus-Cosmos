name: KUSTO RB1202 Public Route Probe
on:
  push:
    branches: [feature/kusto-cross-survey-validation-v1]
    paths:
      - 'workspace/kusto_rb1202_public_route_probe.py'
      - '.github/workflows/kusto-rb1202-public-route-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check requests
      - run: python workspace/kusto_rb1202_public_route_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-rb1202-route-probe-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-RB1202-PUBLIC-FNV-FBT-ROUTE-PROBE-2026-09-23-v1.0.json
          retention-days: 30
