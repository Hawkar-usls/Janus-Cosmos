name: KUSTO Cross Sound CS0 Route Probe

on:
  push:
    branches:
      - feature/kusto-global-groundtruth-calibration-v1
    paths:
      - 'workspace/kusto_cross_sound_cs0_route_probe.py'
      - 'data/cousteau/JANUS-KUSTO-CROSS-SOUND-CS0-SCIENCEBASE-ITEM-DOWNLOAD-ROUTE-REPAIR-2026-09-23-v1.0.json'
      - '.github/workflows/kusto-cross-sound-cs0-route-probe.yml'
  workflow_dispatch:

jobs:
  cs0-route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Probe item-level download routes without reading payload
        run: python workspace/kusto_cross_sound_cs0_route_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-cross-sound-cs0-route-v1
          path: workspace/kusto_global_groundtruth_out/JANUS-KUSTO-CROSS-SOUND-CS0-PRIMARY-DOWNLOAD-ROUTE-RUN-2026-09-23-v1.0.json
          retention-days: 30
