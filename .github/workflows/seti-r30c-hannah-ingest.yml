name: JANUS SETI R30C HANNAH incremental memory
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r30c-hannah-ingest.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-seti-hannah-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4 numba==0.61.2
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate inherited memory and ingest measured scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r30c_hannah_memory.py research/seti/r30c_hannah_ingest.py
          python research/seti/r30c_hannah_ingest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-seti-r30c-incremental-library
          path: runtime/r30c_ingest/*.json
          if-no-files-found: warn
      - name: Verify immutable ledger and label gate
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('runtime/r30c_ingest')
          d=json.loads((p/'result.json').read_text());l=json.loads((p/'library.json').read_text())
          assert d['new_observations']==16 and d['new_scans']==4
          assert len(l['entries'])==d['delta']['total']==59+d['delta']['added']
          assert len({e['id'] for e in l['entries']})==len(l['entries'])
          assert d['review_counts']['verified_rfi']==1 and d['replay']['added']==0
          assert d['library_sha256']==hashlib.sha256((p/'library.json').read_bytes()).hexdigest()
          assert all(v=='PASS' for v in d['selftests'].values()) and not d['production_adoption']
          PY
