name: KUSTO Unseen PF0501 Reference Replacement Search

on:
  push:
    branches:
      - feature/kusto-cross-survey-validation-v1
    paths:
      - 'workspace/kusto_unseen_pf0501_reference_replacement_search.py'
      - '.github/workflows/kusto-unseen-pf0501-reference-replacement-search.yml'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests shapely
      - name: Run frozen coverage-only reference replacement search
        run: python workspace/kusto_unseen_pf0501_reference_replacement_search.py
      - uses: actions/upload-artifact@v4
        with:
          name: kusto-unseen-pf0501-reference-replacement-search-v1
          path: workspace/kusto_cross_survey_out/JANUS-KUSTO-UNSEEN-PF0501-REFERENCE-REPLACEMENT-SEARCH-RUN-2026-09-23-v1.0.json
          retention-days: 30
