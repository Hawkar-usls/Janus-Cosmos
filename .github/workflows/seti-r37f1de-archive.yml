name: JANUS R37F1DE chronology and natural SIGPROC
on:
  push:
    branches: [research/seti-radio-candidate-search-20261117]
    paths: ['.github/workflows/seti-r37f1de-archive.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: janus-r37f1de-archive
  cancel-in-progress: false
jobs:
  chronology:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Reauthenticate historical labels and inspect chronology schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r37f1de_archive.py
          python research/seti/r37f1de_archive.py cassini
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f1d-chronology
          path: runtime/r37f1de/cassini.json
          if-no-files-found: warn
  natural:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.13.0 hdf5plugin==5.0.0 requests==2.32.3 beautifulsoup4==4.13.4
      - name: Qualify SIGPROC and HDF5 natural survey headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/seti/r37f1de_archive.py
          python research/seti/r37f1de_archive.py natural
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: janus-r37f1e-natural-sigproc
          path: runtime/r37f1de/natural.json
          if-no-files-found: warn
