name: JANUS TACHYON STAR T3B TESS Prepointed Flux Replication

on:
  push:
    branches: [research/luci-only-v1]
    paths:
      - 'experiments/luci/run_tachyon_star_t3b_tess.py'
      - 'tests/test_tachyon_star_t3b_tess.py'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T3B-TESS-PREREG.json'
      - '.github/workflows/tachyon-star-t3b-tess.yml'
  pull_request:
    paths:
      - 'experiments/luci/run_tachyon_star_t3b_tess.py'
      - 'tests/test_tachyon_star_t3b_tess.py'
      - 'data/tachyon_star/JANUS-TACHYON-STAR-T3B-TESS-PREREG.json'
      - '.github/workflows/tachyon-star-t3b-tess.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Retrieve and verify frozen T3A prepointed cadence manifest before FLUX access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p parent_t3a
          gh run download 31951308441 -n janus-tachyon-star-t3a-tess -D parent_t3a
          echo 'be8bc23021e9b9a6fa6efa65815e79bc39a1bb011192acab2825c013c1ac4202  parent_t3a/tess_prepointed_cadence_manifest.csv' | sha256sum -c -
          test "$(awk 'END{print NR-1}' parent_t3a/tess_prepointed_cadence_manifest.csv)" -eq 42
          test -s data/tachyon_star/JANUS-TACHYON-STAR-T3B-TESS-PREREG.json
      - name: Run T3B strict unit tests
        run: python -m unittest tests/test_tachyon_star_t3b_tess.py -v
      - name: Execute frozen TESS prepointed FLUX replication
        shell: bash
        run: |
          mkdir -p results/tachyon_star_t3b_tess
          set +e
          python -m experiments.luci.run_tachyon_star_t3b_tess \
            --prepoint-manifest parent_t3a/tess_prepointed_cadence_manifest.csv \
            --output-dir results/tachyon_star_t3b_tess \
            --cache-dir .cache/tachyon_star_t3b_tess
          rc=$?
          set -e
          echo "$rc" > results/tachyon_star_t3b_tess/scientific_runner_exit_code.txt
          test -s results/tachyon_star_t3b_tess/receipt.json
          test -s results/tachyon_star_t3b_tess/trial_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-tachyon-star-t3b-tess
          path: results/tachyon_star_t3b_tess/
          if-no-files-found: error
          compression-level: 6
